const fresh=()=>({version:2,context:{company:'',product:'',industry:'food',model:'Sản phẩm',address:'AH',uc:'',situation:'',baseline:'',mission:'',aspiration:'',commitment:'',values:'',market:'',limit:''},nodes:[],lens:{customer:'',operation:'',evidence:''},improve:{action:'',owner:'',due:'',proof:'',lesson:'',decision:''},snapshots:[]});
function assess(s){const issues=[];const add=(code,text,id)=>issues.push({code,text,id});
 if(!s.context.company.trim()||!s.context.product.trim())add('CONTEXT','Bổ sung doanh nghiệp và sản phẩm/dịch vụ đang thiết kế.');
 if(!s.context.uc.trim()||!s.context.situation.trim())add('UC','Chưa rõ UC và bối cảnh sử dụng; không thể xác nhận phù hợp khách hàng.');
 for(const t of ['V','B','F'])if(!s.nodes.some(n=>n.type===t&&n.text.trim()))add('EMPTY_'+t,'Chưa có nội dung '+t+'.');
 s.nodes.forEach(n=>{if(!n.text.trim())add('TEXT','Một thành phần '+n.type+' chưa được mô tả.',n.id);
 const next=n.type==='F'?'B':'V';
 if(n.type!=='V'&&!n.links.some(id=>s.nodes.some(x=>x.id===id&&x.type===next)))add('LINK','Chưa nối '+n.type+' với '+next+': '+(n.text||'chưa đặt tên'),n.id);
 if(n.type==='V'&&!s.nodes.some(x=>x.type==='B'&&x.links.includes(n.id)))add('SUPPORT','Giá trị chưa có lợi ích hỗ trợ: '+(n.text||'chưa đặt tên'),n.id);
 if(n.type==='B'&&!s.nodes.some(x=>x.type==='F'&&x.links.includes(n.id)))add('SUPPORT','Lợi ích chưa có tính năng hỗ trợ: '+(n.text||'chưa đặt tên'),n.id);
 if(!n.audience.trim())add('AUDIENCE','Chưa chỉ rõ người hưởng lợi / sử dụng của '+(n.text||n.type),n.id);
 if(!n.condition.trim())add('CONDITION','Chưa nêu điều kiện / giới hạn của '+(n.text||n.type),n.id);
 if(n.status==='observed'&&(!n.source.trim()||!n.date))add('EVIDENCE','Đã khai có bằng chứng nhưng thiếu nguồn hoặc ngày: '+(n.text||n.type),n.id);
 if(n.status==='planned'&&(!n.measure.trim()||!n.owner.trim()))add('PLAN','Giả thuyết chưa có cách kiểm chứng hoặc người phụ trách: '+(n.text||n.type),n.id);
 if(n.type==='F'&&n.control==='open'&&!n.owner.trim())add('OPEN','Open Rim cần người chịu trách nhiệm cho nguồn lực bên ngoài.',n.id);
 });
 return {issues,linked:s.nodes.filter(n=>n.type!=='V'&&n.links.length).length,declared:s.nodes.filter(n=>n.status==='observed'&&n.source.trim()&&n.date).length,planned:s.nodes.filter(n=>n.status==='planned').length};}
function validate(x){if(!x||x.version!==2||!x.context||!Array.isArray(x.nodes)||x.nodes.length>500)throw Error('Không đúng hồ sơ V-RIM 2.0 hoặc quá 500 thành phần.');const base=fresh();
 for(const k of Object.keys(base.context)){if(typeof x.context[k]!=='string'||x.context[k].length>20000)throw Error('Dữ liệu bối cảnh không hợp lệ.');base.context[k]=x.context[k];}
 const ids=new Set();for(const n of x.nodes){if(!n||typeof n.id!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(n.id)||ids.has(n.id)||!['V','B','F'].includes(n.type))throw Error('Thành phần không hợp lệ hoặc trùng ID.');ids.add(n.id);const q=node(n.type);for(const k of Object.keys(q)){if(k==='links')continue;if(typeof n[k]!=='string'||n[k].length>20000)throw Error('Trường dữ liệu không hợp lệ.');q[k]=n[k];}if(!['planned','internal','observed'].includes(n.status)||!['core','open'].includes(n.control)||!Array.isArray(n.links)||n.links.some(id=>typeof id!=='string'))throw Error('Trạng thái/liên kết không hợp lệ.');q.links=[...new Set(n.links)];base.nodes.push(q);}
 for(const n of base.nodes)if(n.links.some(id=>!base.nodes.some(y=>y.id===id&&y.type===(n.type==='F'?'B':n.type==='B'?'V':''))))throw Error('Liên kết sai tầng hoặc mất thành phần.');
 for(const group of ['lens','improve'])for(const k of Object.keys(base[group])){const v=x[group]?.[k]??'';if(typeof v!=='string'||v.length>20000)throw Error('Ghi chú không hợp lệ.');base[group][k]=v;}
 if(Array.isArray(x.snapshots))base.snapshots=x.snapshots.filter(a=>a&&typeof a.date==='string'&&typeof a.text==='string').slice(-20).map(a=>({date:a.date.slice(0,100),text:a.text.slice(0,100000)}));return base;}
 const api={uid,node,fresh,assess,validate};if(typeof module!=='undefined')module.exports=api;root.VRIM=api;
})(typeof window!=='undefined'?window:globalThis);
</script><script>const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function textField(label,path,val,placeholder='',long=false){return `<label class="field">${label}${long?`<textarea data-path="${path}" placeholder="${placeholder}">${esc(val)}</textarea>`:`<input data-path="${path}" value="${esc(val)}" placeholder="${placeholder}">`}</label>`;}

function contextView(){const c=state.context;return intro('01 / ACTIVATE','Bắt đầu từ doanh nghiệp của bạn.','Một bản thiết kế tập trung vào một dòng sản phẩm/dịch vụ và một bối cảnh. Xuất hồ sơ để lưu các cấu hình khác nhau.')+`<div class="card"><div class="grid2">${textField('Tên doanh nghiệp','context.company',c.company,'Ví dụ: Magic Oven Foods')}${textField('Dòng sản phẩm / dịch vụ','context.product',c.product,'Ví dụ: Suất ăn sáng văn phòng')}${selectField('Ngành tham khảo','context.industry',c.industry,[...VRIM_LIBRARY.map(x=>[x[0],x[1]]),['other','Ngành khác / kết hợp']])}${selectField('Mô hình cung cấp','context.model',c.model,['Sản phẩm','Dịch vụ','Thuê bao','Dự án','Nền tảng','Kết hợp'].map(x=>[x,x]))}${selectField('Address trọng tâm','context.address',c.address,[['AH','AH · Hộ gia đình'],['AR','AR · Bán lẻ / bán lại'],['AC','AC · Doanh nghiệp'],['other','Loại khác / cần định nghĩa']])}${textField('UC cụ thể: người mua, dùng, quyết định…','context.uc',c.uc,'Không đồng nhất người mua với người dùng')}${textField('Bối cảnh / việc khách muốn giải quyết','context.situation',c.situation,'Khi nào, ở đâu, để làm gì?',true)}${textField('Hiện trạng và cách khách đang làm','context.baseline',c.baseline,'Phương án hiện có; vấn đề; nguồn thông tin',true)}</div></div><div class="callout">Ngành giúp gợi mở, không quyết định giá trị thay khách hàng. Có thể chỉnh toàn bộ mẫu và bổ sung nội dung riêng.</div><button class="primary" data-go="practice">Thiết kế V-RIM của tôi →</button>`;}
function paradigmView(){return `<div class="hero"><div><span class="eyebrow">02 / PARADIGM · MÔ THỨC THỰC CHIẾN</span><h1>Từ điều sản phẩm có.<br>Đến điều khách hàng cần.</h1><p>Nhìn rõ cấu trúc VBF. Thiết kế từ Giá trị, truy nguyên bằng Lợi ích và Tính năng — rồi kiểm chứng trong thực tế.</p><button class="primary" data-go="practice">Mở mâm xe của tôi ↗</button></div><div class="hero-rim">${wheelSVG([],null,true)}<span>V-RIM / VALUE ARCHITECTURE</span></div></div><div class="trio">${[['V','Giá trị','Vì sao sự thay đổi này có ý nghĩa với khách?'],['B','Lợi ích','Khách nhận được cải thiện cụ thể nào?'],['F','Tính năng','Sản phẩm có gì, làm được gì hoặc cung cấp ra sao?']].map(([t,h,d])=>`<div class="definition ${t}"><span>${t}</span><h3>${h}</h3><p>${d}</p></div>`).join('')}</div><div class="flow-note"><b>Thiết kế: V → B → F</b><span>↔</span><b>Kiểm tra: F → B → V</b><small>Một–nhiều và nhiều–một. Không phải ba danh sách đứng riêng.</small></div><section class="library"><div class="section-row"><div><span class="eyebrow">THƯ VIỆN GỢI MỞ</span><h2>24 tình huống. 12 nhóm ngành.</h2></div><span class="badge">Ví dụ giả lập · không phải bằng chứng</span></div><div class="searchbar"><label>Tìm tình huống<input id="search" value="${esc(search)}" placeholder="Tồn kho, an tâm, giao hàng…"></label><label>Nhóm ngành<select id="industryFilter"><option value="all">Tất cả ngành</option>${VRIM_LIBRARY.map(x=>`<option value="${x[0]}" ${industry===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label></div><div id="examples">${examplesView()}</div></section><div class="card"><h2>Phân biệt để thiết kế đúng</h2><div class="grid2"><p><b>“Chất lượng cao”</b> chưa đủ cụ thể. Chất lượng ở thuộc tính nào, theo tiêu chí nào, ai cần?</p><p><b>“Tăng doanh thu 30%”</b> là lời hứa cần căn cứ và điều kiện, không phải giá trị đã được xác nhận.</p></div><p class="muted">Value ở đây là giá trị đối với khách hàng; không tự đồng nhất với giá trị cốt lõi tổ chức trong MTUA.</p></div>`;}
function examplesView(){let count=0;const html=VRIM_LIBRARY.filter(x=>industry==='all'||industry===x[0]).flatMap(x=>x[3].map((e,i)=>({group:x,e,i}))).filter(({group,e})=>(group[1]+' '+e.join(' ')).toLocaleLowerCase('vi').includes(search.toLocaleLowerCase('vi'))).map(({group:g,e,i})=>{count++;return `<article class="example card"><div class="section-row"><span class="eyebrow">${g[1]}</span><span class="badge">${String(VRIM_LIBRARY.indexOf(g)*2+i+1).padStart(2,'0')}</span></div><h3>${e[0]}</h3><p class="muted">${e[1]}</p><div class="example-chain">${[['F',e[2]],['B',e[3]],['V',e[4]]].map(([t,v])=>`<div><b class="pill ${t}">${t}</b><p>${v}</p></div>`).join('')}</div><details><summary>Điều kiện, bằng chứng & điểm dễ nhầm</summary><p><b>Điều kiện:</b> ${e[5]}</p><p><b>Cần thu:</b> ${e[6]}</p><p class="warning">${e[7]}</p><p><b>Gợi mở:</b> Điều gì sẽ thay đổi nếu người mua không phải người dùng? Nếu điều kiện trên không có, lời hứa nào phải giảm?</p></details><button data-example="${g[0]}:${i}">＋ Thêm làm giả thuyết của tôi</button></article>`;}).join('');return count?`<div class="example-grid">${html}</div>`:'<div class="card">Không có tình huống khớp. Thử từ khóa khác hoặc tạo nội dung riêng trong Thiết kế.</div>';}
function wheelSVG(nodes,sel,decor=false){const a=nodes.filter(n=>n.text.trim()),shown=a.slice(0,18);let spokes='',marks='';const linked=new Set(sel?[sel,...(nodes.find(n=>n.id===sel)?.links||[]),...nodes.filter(n=>n.links.includes(sel)).map(n=>n.id)]:[]);for(let i=0;i<12;i++){const r=i*Math.PI/6;const x=220+Math.sin(r)*148,y=220-Math.cos(r)*148;spokes+=`<path d="M ${220+Math.sin(r-.12)*63} ${220-Math.cos(r-.12)*63} L ${x+Math.cos(r)*12} ${y+Math.sin(r)*12} L ${x-Math.cos(r)*12} ${y-Math.sin(r)*12} L ${220+Math.sin(r+.12)*63} ${220-Math.cos(r+.12)*63} Z" fill="url(#metal)" stroke="#a5b6ba"/>`;}
shown.forEach((n,i)=>{const r=i*2*Math.PI/shown.length,x=220+Math.sin(r)*178,y=220-Math.cos(r)*178,active=!sel||linked.has(n.id);marks+=`<g tabindex="0" role="button" aria-label="${esc(n.type+' '+n.text)}" data-select="${n.id}" opacity="${active?1:.28}" class="wheel-node"><circle cx="${x}" cy="${y}" r="18" fill="${{V:'#167567',B:'#d49a36',F:'#5467a6'}[n.type]}" stroke="white" stroke-width="3" ${n.status==='planned'?'stroke-dasharray="4 3"':''}/><text x="${x}" y="${y+5}" text-anchor="middle" fill="white" font-size="13" font-weight="700">${n.type}${nodes.filter(v=>v.type===n.type).indexOf(n)+1}</text><title>${esc(n.text)}</title></g>`;});return `<svg viewBox="0 0 440 440" role="img" aria-label="Mâm xe V-RIM minh họa cấu trúc, không biểu thị điểm chất lượng"><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".4" stop-color="#c6d2d4"/><stop offset=".7" stop-color="#f7fafa"/><stop offset="1" stop-color="#889fa3"/></linearGradient><radialGradient id="rim"><stop stop-color="#edf2ee"/><stop offset="1" stop-color="#dce5e2"/></radialGradient></defs><ellipse cx="220" cy="405" rx="137" ry="16" fill="#173e3520"/><circle cx="220" cy="220" r="196" fill="#16483f"/><circle cx="220" cy="220" r="187" fill="url(#metal)"/><circle cx="220" cy="220" r="161" fill="#264f4a"/><circle cx="220" cy="220" r="151" fill="url(#rim)"/>${spokes}<circle cx="220" cy="220" r="65" fill="url(#metal)" stroke="#94a8a7"/><circle cx="220" cy="220" r="48" fill="#154c40"/><text x="220" y="217" text-anchor="middle" fill="white" font-size="16" font-weight="700">V-RIM</text><text x="220" y="234" text-anchor="middle" fill="#b8d9c8" font-size="9">MYBIZCAR</text>${marks}${decor?'<text x="220" y="79" fill="#16483f" font-size="15" text-anchor="middle">V · B · F</text>':''}</svg>`;}
function practiceView(){const s=state;return intro('03 / PRACTISE','Mâm xe mang cấu trúc của bạn.','Thêm thành phần riêng, nối các mắt xích và phân biệt điều đang có với điều cần kiểm chứng.')+`<div class="context-strip"><div><b>${esc(s.context.company||'Chưa đặt tên doanh nghiệp')}</b><span>${esc(s.context.product||'Chưa xác định sản phẩm/dịch vụ')} · ${esc(s.context.uc||'Chưa xác định UC')}</span></div><button data-go="activate">Sửa bối cảnh</button></div><div class="studio"><div class="wheel-panel card"><span class="eyebrow">BẢN ĐỒ CẤU TRÚC VBF</span><div id="wheel"></div><div class="legend"><span class="pill V">V</span> Giá trị <span class="pill B">B</span> Lợi ích <span class="pill F">F</span> Tính năng</div><p class="muted small">Hình minh họa, không phải thang sức khỏe. Nét đứt: dự kiến. Bấm điểm để xem liên kết. Mâm hiển thị tối đa 18 điểm; danh sách giữ toàn bộ.</p><div id="selection"></div><div id="stats"></div></div><div><div class="card"><div class="section-row"><h2>Thành phần VBF</h2><div class="segmented">${['all','V','B','F'].map(t=>`<button data-filter="${t}" class="${filter===t?'chosen':''}">${t==='all'?'Tất cả':t}</button>`).join('')}</div></div><div class="add-row">${['V','B','F'].map(t=>`<button data-add="${t}">＋ ${t} · ${names[t]}</button>`).join('')}</div><div class="option-bank"><label>Gợi mở theo thành phần<select id="optionType"><option>V</option><option>B</option><option>F</option></select></label><label>Chọn ý để cụ thể hóa<select id="optionText">${VRIM_OPTIONS.V.map(x=>`<option>${x}</option>`).join('')}</select></label><button id="addOption">Thêm ý</button></div><p class="hint">Ý gợi mở chưa phải tuyên bố hoàn chỉnh. Cần sửa theo khách hàng và dữ kiện của bạn.</p></div><div id="nodes">${nodesView()}</div><div class="card"><h2>Điều kiện của cả bản thiết kế</h2>${textField('Giới hạn lời hứa với khách','context.limit',s.context.limit,'Điều chưa thể cam kết, điều kiện hoặc ngoại lệ',true)}${textField('Giả thuyết thị trường cần kiểm chứng','context.market',s.context.market,'Address/UC nào cần giá trị này? Nguồn nào sẽ kiểm tra?',true)}<details><summary>Đối chiếu Strategic Fit với MTUA</summary><div class="grid2">${[['mission','Meaningful Mission'],['aspiration','Targeted Aspiration'],['commitment','Unwavering Commitment'],['values','Anchoring Values']].map(([k,l])=>textField(l,'context.'+k,s.context[k],'Giải thích mối liên hệ, không tự chấm đạt',true)).join('')}</div></details></div><button class="primary" data-go="lens">Soi thiết kế qua Lăng kính →</button></div></div>`;}
function nodesView(){const arr=state.nodes.filter(n=>filter==='all'||n.type===filter);return arr.length?arr.map(n=>{const next=n.type==='F'?'B':'V',candidates=state.nodes.filter(x=>x.type===next&&x.id!==n.id);return `<article class="card node-card ${n.type}" id="node-${n.id}"><div class="section-row"><button class="node-title" data-select="${n.id}"><span class="pill ${n.type}">${n.type}${state.nodes.filter(x=>x.type===n.type).indexOf(n)+1}</span>${names[n.type]}</button><button class="quiet" data-delete="${n.id}" aria-label="Xóa thành phần ${n.type}">Xóa</button></div>${textField('Nội dung cụ thể','node.'+n.id+'.text',n.text,n.type==='V'?'Ý nghĩa đối với khách, không chỉ khẩu hiệu':n.type==='B'?'Sự cải thiện cụ thể khách nhận được':'Thuộc tính / chức năng / cách cung cấp có thể quan sát',true)}<div class="grid2">${textField('Cho UC nào?','node.'+n.id+'.audience',n.audience,'Người dùng / người mua / người quyết định')}${selectField('Trạng thái dữ kiện','node.'+n.id+'.status',n.status,[['planned','Dự kiến / giả thuyết'],['internal','Đang có · khai báo nội bộ'],['observed','Có bằng chứng · cần đối chiếu']])}</div>${n.type!=='V'?`<fieldset><legend>Nối với ${next} · ${names[next]} (chọn nhiều)</legend>${candidates.length?candidates.map(x=>`<label class="check"><input type="checkbox" data-link="${n.id}" value="${x.id}" ${n.links.includes(x.id)?'checked':''}>${esc(x.text||'(chưa đặt tên)')}</label>`).join(''):`<p class="hint">Thêm ${next} trước, rồi quay lại liên kết.</p>`}</fieldset>`:''}<details><summary>Điều kiện, kiểm chứng & trách nhiệm</summary>${textField('Điều kiện / giới hạn để mối liên hệ có hiệu lực','node.'+n.id+'.condition',n.condition,'Không tự động chuyển từ tính năng sang lợi ích',true)}<div class="grid2">${textField('Nguồn bằng chứng hiện có','node.'+n.id+'.source',n.source,'Tên tài liệu, phản hồi, mã hồ sơ; không nhập dữ liệu nhạy cảm',true)}<label class="field">Ngày của bằng chứng<input type="date" data-path="node.${n.id}.date" value="${esc(n.date)}"></label>${textField('Cách kiểm chứng / dữ liệu cần thu','node.'+n.id+'.measure',n.measure,'Đo gì, hỏi ai, đối chiếu với mốc nào?',true)}${textField('Tiêu chí mong muốn / ngưỡng do doanh nghiệp đề xuất','node.'+n.id+'.target',n.target,'Chốt trước khi đo; không tự coi là chuẩn ngành',true)}${textField('Người chịu trách nhiệm','node.'+n.id+'.owner',n.owner,'Vai trò hoặc người phụ trách')}${n.type==='F'?selectField('Core / Open Rim','node.'+n.id+'.control',n.control,[['core','Core · Phải kiểm soát'],['open','Open · Huy động bên ngoài']]):''}</div></details></article>`;}).join(''):`<div class="empty"><span>＋</span><h3>${state.nodes.length?'Chưa có thành phần trong bộ lọc này':'Bắt đầu mâm xe của bạn'}</h3><p>Thêm V, B, F riêng hoặc chọn tình huống trong thư viện. Không giới hạn ba dòng.</p><button data-go="paradigm">Khám phá ví dụ đa ngành →</button></div>`;}
function updateWheel(){if(!$('#wheel'))return;$('#wheel').innerHTML=wheelSVG(state.nodes,selected);const n=state.nodes.find(x=>x.id===selected);$('#selection').innerHTML=n?`<div class="selected-info"><b>${n.type} · ${esc(n.text||'Chưa đặt tên')}</b><p>${esc(n.audience||'Chưa rõ UC')}</p><button data-edit="${n.id}">Mở thành phần này ↓</button></div>`:'<p class="hint">Chọn một điểm để khám phá cấu trúc liên quan.</p>';const a=VRIM.assess(state);$('#stats').innerHTML=`<div class="mini-stats"><div><b>${state.nodes.length}</b><span>thành phần</span></div><div><b>${a.planned}</b><span>giả thuyết</span></div><div><b>${a.issues.length}</b><span>mục cần rà</span></div></div>`;}
function lensView(){const a=VRIM.assess(state);return intro('04 / LENS','Ba góc nhìn. Những câu hỏi cần thiết.','Kiểm tra cấu trúc, không chấm điểm thành công. Điền đủ không chứng minh khách hàng đã nhận giá trị.')+`<div class="trio">${[['customer','Khách hàng','UC có thực sự cần giá trị này? Ai hưởng lợi, ai phải chịu thêm chi phí?'],['operation','Khả năng thực hiện','Tính năng và điều kiện có đủ để tạo lợi ích? Core/Open có người chịu trách nhiệm?'],['evidence','Bằng chứng','Nguồn nào hỗ trợ? Điều gì vẫn là giả thuyết? Có phản hồi trái chiều không?']].map(([k,t,p])=>`<div class="card"><h3>${t}</h3><p>${p}</p>${textField('Ghi nhận phản biện','lens.'+k,state.lens[k],'Ý kiến của CEO, học viên hoặc giảng viên',true)}</div>`).join('')}</div><div class="card"><div class="section-row"><h2>${a.issues.length?'Các điểm cần rà soát':'Chưa phát hiện thiếu trường theo bộ quy tắc'}</h2><span class="badge">${a.issues.length} mục</span></div><p class="muted">Kiểm tra tự động chỉ xác định thiếu dữ kiện và liên kết. Không đánh giá được tính đúng của lời khai hoặc quan hệ nhân quả.</p><div class="issues">${a.issues.map(i=>`<div><span>↗</span><p>${esc(i.text)}</p>${i.id?`<button data-edit="${i.id}">Bổ sung</button>`:`<button data-go="${i.code==='CONTEXT'||i.code==='UC'?'activate':'practice'}">Mở</button>`}</div>`).join('')||'<p>Cần người đánh giá đối chiếu nguồn và thử nghiệm thị trường trước khi kết luận.</p>'}</div></div>`;}
function summary(){return ['V-RIM — '+state.context.company,state.context.product,'UC: '+state.context.uc,'Bối cảnh: '+state.context.situation,...state.nodes.map(n=>`${n.type}: ${n.text}\nCho: ${n.audience} | Trạng thái: ${n.status}\nLiên kết: ${n.links.map(id=>state.nodes.find(x=>x.id===id)?.text).join('; ')}\nĐiều kiện: ${n.condition}\nNguồn: ${n.source} (${n.date})\nKiểm chứng: ${n.measure} | Tiêu chí: ${n.target}`)].join('\n\n');}
function improveView(){return intro('05 / IMPROVE','Chọn một thay đổi có ý nghĩa.','Giữ bản trước khi sửa. Thay đổi nội dung tại Thiết kế; ghi lý do và cách kiểm chứng ở đây.')+`<div class="card"><div class="section-row"><h2>Lưu mốc bản thiết kế</h2><button id="snapshot">Lưu bản trước cải tiến</button></div><p class="hint">Giữ tối đa 20 mốc trên trình duyệt; xuất JSON để sao lưu dài hạn.</p>${state.snapshots.map((s,i)=>`<details><summary>Mốc ${i+1} · ${esc(s.date)}</summary><pre>${esc(s.text)}</pre></details>`).join('')||'<p class="muted">Chưa có mốc nào.</p>'}</div><div class="card">${textField('Thay đổi ưu tiên và lý do','improve.action',state.improve.action,'Sửa một liên kết, giảm lời hứa hoặc bổ sung điều kiện…',true)}${textField('Bằng chứng sẽ dùng để kiểm tra cải tiến','improve.proof',state.improve.proof,'Thu gì, từ ai, trong phạm vi nào?',true)}<button class="primary" data-go="practice">Quay lại sửa bản thiết kế →</button></div>`;}
function extractView(){return intro('06 / EXTRACT & RESOLVE','Mang thiết kế vào thực tế.','Một hành động, một người chịu trách nhiệm, một thời hạn và bằng chứng để xem xét lại.')+`<div class="card">${textField('Bài học quan trọng nhất','improve.lesson',state.improve.lesson,'Điều làm thay đổi cách bạn nhìn sản phẩm/dịch vụ',true)}<div class="grid2">${textField('Người chịu trách nhiệm','improve.owner',state.improve.owner)}<label class="field">Ngày xem xét lại<input type="date" data-path="improve.due" value="${esc(state.improve.due)}"></label></div>${selectField('Quyết định hiện tại','improve.decision',state.improve.decision,[['','Chưa quyết định'],['Thử nghiệm','Thử nghiệm'],['Cải tiến','Cải tiến'],['Tạm dừng','Tạm dừng'],['Giữ trong phạm vi đã kiểm chứng','Giữ trong phạm vi đã kiểm chứng']])}<div class="callout">Không gắn nhãn “đã hoàn thành” chỉ vì điền đủ. Kết quả ứng dụng cần dữ liệu ngoài lớp học.</div><button id="export2" class="primary">Xuất toàn bộ hồ sơ MyBizCar ↓</button></div><div class="card"><h2>Bản tóm tắt</h2><pre>${esc(summary())}</pre></div>`;}
function addExample(key){const [g,i]=key.split(':'),group=VRIM_LIBRARY.find(x=>x[0]===g),e=group[3][+i];const v=VRIM.node('V'),b=VRIM.node('B'),f=VRIM.node('F');[v,b,f].forEach(n=>{n.audience=e[1];n.condition=e[5];n.measure=e[6];});v.text=e[4];b.text=e[3];f.text=e[2];b.links=[v.id];f.links=[b.id];state.nodes.push(v,b,f);if(!state.context.product)state.context.product=group[2];save();selected=v.id;filter='all';go('practice');toast('Đã thêm 3 giả thuyết; giữ nguyên nội dung cũ. Hãy sửa theo doanh nghiệp.');}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MyBizCar-VRIM-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-select]');if(!b)return;
 if((b.dataset.add||b.id==='addOption'||b.dataset.example)&&state.nodes.length+(b.dataset.example?3:1)>500){toast('Một hồ sơ hỗ trợ tối đa 500 thành phần. Xuất hồ sơ và tách phạm vi thiết kế.');return;}
 if(b.dataset.go){go(b.dataset.go);return;}if(b.dataset.example){addExample(b.dataset.example);return;}
 if(b.dataset.add){const n=VRIM.node(b.dataset.add);state.nodes.push(n);selected=n.id;filter='all';save();render();$('#node-'+n.id)?.scrollIntoView({behavior:'smooth',block:'center'});return;}
 if(b.dataset.filter){filter=b.dataset.filter;render();return;}
 if(b.dataset.select){selected=b.dataset.select;updateWheel();return;}
 if(b.dataset.edit){selected=b.dataset.edit;filter='all';go('practice');$('#node-'+selected)?.scrollIntoView({behavior:'smooth',block:'center'});return;}
 if(b.dataset.delete){if(!confirm('Xóa thành phần và các liên kết đến nó? Các thành phần khác được giữ nguyên.'))return;state.nodes=state.nodes.filter(n=>n.id!==b.dataset.delete);state.nodes.forEach(n=>n.links=n.links.filter(id=>id!==b.dataset.delete));selected=null;save();render();return;}
 if(b.id==='addOption'){const n=VRIM.node($('#optionType').value);n.text=$('#optionText').value;state.nodes.push(n);selected=n.id;filter='all';save();render();return;}
 if(['export','export2'].includes(b.id))exportData();if(b.id==='import')$('#file').click();if(b.id==='print')printReport();
 if(b.id==='snapshot'){state.snapshots.push({date:new Date().toLocaleString('vi-VN'),text:summary()});state.snapshots=state.snapshots.slice(-20);save();render();toast('Đã lưu mốc trước cải tiến.');}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-select]:not(button)')){e.preventDefault();selected=e.target.dataset.select;updateWheel();}});
function change(e){const el=e.target;if(el.dataset.path){const parts=el.dataset.path.split('.');if(parts[0]==='node'){const n=state.nodes.find(n=>n.id===parts[1]);if(n)n[parts[2]]=el.value;}else state[parts[0]][parts[1]]=el.value;save();updateWheel();}
 if(el.dataset.link){const n=state.nodes.find(n=>n.id===el.dataset.link);n.links=el.checked?[...new Set([...n.links,el.value])]:n.links.filter(id=>id!==el.value);save();updateWheel();}
 if(el.id==='search'){search=el.value;$('#examples').innerHTML=examplesView();}if(el.id==='industryFilter'){industry=el.value;$('#examples').innerHTML=examplesView();}if(el.id==='optionType')$('#optionText').innerHTML=VRIM_OPTIONS[el.value].map(x=>`<option>${x}</option>`).join('');}
document.addEventListener('input',e=>{change(e);if(e.target.dataset.path?.startsWith('node.')&&e.target.dataset.path.endsWith('.text'))document.querySelectorAll('[data-link]').forEach(box=>{const n=state.nodes.find(x=>x.id===box.value);if(n&&box.nextSibling)box.nextSibling.textContent=n.text||'(chưa đặt tên)';});});document.addEventListener('change',e=>{if(e.target.matches('select,input[type=checkbox],input[type=date]'))change(e);});
$('#file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>3000000)throw Error('Hồ sơ vượt giới hạn 3 MB.');const next=VRIM.validate(JSON.parse(await f.text()));if(!confirm('Thay hồ sơ đang mở bằng hồ sơ nhập? Hãy xuất hồ sơ hiện tại trước nếu cần giữ.'))return;state=next;storageOK=true;selected=null;save();render();toast('Đã nhập và kiểm tra cấu trúc hồ sơ.');}catch(err){toast('Không nhập: '+err.message);}finally{e.target.value='';}});
function printReport(){const w=window.open('','_blank');if(!w){toast('Trình duyệt chặn cửa sổ in. Cho phép mở cửa sổ rồi thử lại.');return;}const a=VRIM.assess(state);w.document.write(`<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Hồ sơ V-RIM</title><style>body{font:12pt Arial;line-height:1.5;margin:2cm;color:#173e35}pre{white-space:pre-wrap;font:inherit}h1{font-size:23pt}li{margin:8px 0}@media print{button{display:none}}</style></head><body><button onclick="print()">In / lưu PDF</button><h1>MyBizCar · Hồ sơ V-RIM</h1><p>Nền học thuyết Nguyễn Chí Thành · Bản thiết kế do người dùng khai báo</p><pre>${esc(summary())}</pre><h2>Định hướng và giới hạn</h2><pre>${esc(JSON.stringify(state.context,null,2))}</pre><h2>Cần rà soát</h2><ul>${a.issues.map(i=>`<li>${esc(i.text)}</li>`).join('')}</ul><h2>Lăng kính</h2><pre>${esc(JSON.stringify(state.lens,null,2))}</pre><h2>Cải tiến và cam kết</h2><pre>${esc(JSON.stringify(state.improve,null,2))}</pre><p>Không phải chứng nhận giá trị thị trường. Nguồn bằng chứng cần được đối chiếu độc lập.</p></body></html>`);w.document.close();}
render();
</script></body></html>

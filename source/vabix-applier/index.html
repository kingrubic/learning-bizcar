  <section class="intro"><div><div class="eyebrow">Dẫn giảng thực hành</div><h1>Tỉnh thức · Kiến tạo · Điều hướng</h1><p>Chọn một buổi, xử lý tình huống và mang về một hành động có thể thực hiện ngay.</p></div><div class="save" id="save-status" role="status">Câu trả lời được lưu theo buổi</div></section>

<script>
const STEPS=[["A","Cùng khởi động"],["P","Mô thức"],["P","Thực hành"],["L","Soi chiếu"],["I","Cải tiến"],["E","Đúc kết"],["R","Giải quyết"]];
const DATA=[
 {name:"TỈNH",sub:"Thấy rõ trước khi phản ứng",focus:"SELF-AWARENESS",scenario:"Một nhân viên báo rằng ca trước bàn giao thiếu thông tin. Đơn hàng đang chậm và cấp trên vừa nhắn hỏi tiến độ. Bạn cảm thấy bực: “Họ lại thiếu trách nhiệm.”",activate:"Trong 30 giây đầu, bạn sẽ làm gì?",choices:["Gọi ngay ca trước và yêu cầu giải thích vì sao làm thiếu.","Tách điều mình biết khỏi điều mình đang suy đoán; hỏi thêm dữ kiện trước khi kết luận.","Tạm bỏ qua vì đang bận giải quyết đơn hàng."],feedback:["Bạn có thể nhận được câu trả lời nhanh, nhưng sự bực tức dễ biến một giả định thành lời buộc tội.","Bạn tạo khoảng dừng giữa kích hoạt và hành động. Hãy kiểm tra việc bàn giao cụ thể trước khi gán nguyên nhân.","Vấn đề có thể lặp lại nếu tín hiệu ban đầu bị bỏ qua."],frame:[["NHẬN DIỆN","Cảm xúc và tín hiệu cơ thể lúc này là gì?"],["TÁCH BẠCH","Đâu là dữ kiện, đâu là diễn giải, đâu là giả định?"],["LỰA CHỌN","Câu hỏi nào giúp thấy rõ trước khi hành động?"]],practice:"Hãy viết một câu hỏi đầu tiên bạn sẽ nói với nhân viên, sao cho vừa làm rõ sự việc vừa không quy kết.",lens:["Câu hỏi của bạn đang tìm dữ kiện hay tìm người có lỗi?","Bạn đã xác minh điều gì xảy ra, ở khâu nào và ảnh hưởng ra sao?","Nếu giả định ban đầu sai, cách nói này có còn phù hợp?"],extract:"TỈNH là nhìn rõ phản ứng của mình và thực tại trước khi đưa ra phán đoán.",task:"Trong một tình huống gây khó chịu, ghi lại 1 dữ kiện, 1 diễn giải và 1 câu hỏi làm rõ trước khi phản hồi."},
 {name:"CHỦ",sub:"Làm chủ mình dưới áp lực",focus:"SELF-MASTERY",scenario:"Khách hàng gọi phản ánh xe giao trễ. Cấp trên yêu cầu báo cáo ngay. Nhân viên của bạn đang chờ quyết định, trong khi thông tin từ điều độ chưa đầy đủ.",activate:"Bạn ưu tiên hành động nào trước?",choices:["Hứa với khách một thời điểm giao mới để giảm căng thẳng, dù chưa xác minh.","Ổn định nhịp phản ứng, xác minh mốc thời gian và phân công người cập nhật cho khách.","Đợi đủ mọi thông tin rồi mới liên hệ khách."],feedback:["Lời hứa thiếu căn cứ có thể làm suy giảm niềm tin lần thứ hai.","Bạn vừa giữ LỬA ở mức hữu ích, dùng LÝ để kiểm chứng và dùng LỰC để triển khai hành động.","Chờ đợi quá lâu khiến khách không biết chuyện gì đang xảy ra."],frame:[["LỬA","Điều tiết năng lượng và cảm xúc, không để áp lực dẫn dắt."],["LÝ","Đọc dữ kiện, cân nhắc hệ quả và giới hạn hiểu biết."],["LỰC","Quyết định, phân công và theo tới kết quả."]],practice:"Viết một chỉ đạo 2 câu cho đội ngũ: việc cần xác minh ngay và thời điểm cập nhật tiếp theo cho khách.",lens:["Bạn đã nói rõ ai xác minh và ai cập nhật khách chưa?","Mốc cập nhật có thực tế và nằm trong quyền kiểm soát không?","Lời nói có giữ được sự bình tĩnh và trách nhiệm?"],extract:"CHỦ là điều tiết LỬA, soi bằng LÝ và huy động LỰC để hành động có chủ đích.",task:"Chọn một tình huống áp lực thật; trước khi chỉ đạo, dành 60 giây viết LỬA – LÝ – LỰC của mình."},
 {name:"KIẾN TẠO",sub:"Từ SELF đến SHARED",focus:"RÕ · THẬT · CHỦ · LỰC",scenario:"Một kỹ thuật viên nghe tiếng rung bất thường nhưng không báo ngay. Lần trước, người báo nhầm đã bị phê bình trước cả ca. Sau đó thiết bị phải dừng đột xuất.",activate:"Bạn mở cuộc trao đổi sau sự cố như thế nào?",choices:["Hỏi ai đã biết tiếng rung mà không báo để xác định trách nhiệm.","Hỏi tín hiệu xuất hiện khi nào, điều gì khiến báo cáo bị chậm, rồi làm rõ quy tắc báo rủi ro.","Nói mọi người cứ mạnh dạn báo cáo từ nay về sau."],feedback:["Cần làm rõ trách nhiệm, nhưng mở đầu bằng truy lỗi có thể khiến tín hiệu thật tiếp tục bị giấu.","Bạn tìm sự thật, trách nhiệm và điều kiện vận hành cùng lúc. Tiếp theo cần quy định rõ ngưỡng báo cáo và phản hồi của quản lý.","Lời động viên khó thay đổi hành vi nếu quy tắc và cách phản hồi không thay đổi."],frame:[["RÕ","Mục tiêu, tiêu chuẩn và quyền quyết định rõ."],["THẬT","Tin xấu và near-miss được nói sớm, đúng sự thật."],["CHỦ","Người làm có quyền và trách nhiệm trong ranh giới rõ."],["LỰC","Năng lực, nguồn lực và phối hợp đủ để thực thi."]],practice:"Thiết kế một quy tắc báo tín hiệu bất thường: báo cho ai, trong bao lâu, người nhận phản hồi ra sao?",lens:["Quy tắc có giúp người báo thấy an toàn để nói thật không?","Quyền dừng việc và ngưỡng chuyển cấp có rõ chưa?","Người thực hiện có đủ công cụ và năng lực để nhận diện tín hiệu?"],extract:"KIẾN TẠO là tạo điều kiện đủ RÕ – THẬT – CHỦ – LỰC để nhiều người cùng tạo kết quả.",task:"Chọn một việc đang phụ thuộc quá nhiều vào mình; sửa một điều kiện RÕ, THẬT, CHỦ hoặc LỰC trong vòng 24 giờ."},
 {name:"ĐIỀU HƯỚNG",sub:"Từ SHARED đến SYSTEM",focus:"SEE · SENSE · SELECT · STEER",scenario:"Ba chuyến giao hàng liên tiếp trễ. Kinh doanh nói điều độ xếp xe kém; điều độ nói trạm xuất hàng chậm; trạm nói khách thay đổi giờ nhận. Dữ liệu mỗi bên khác nhau.",activate:"Bạn bắt đầu điều hướng ở đâu?",choices:["Yêu cầu điều độ tăng xe ngay để xử lý triệu chứng.","Tập hợp mốc thời gian của ba chuyến, xác định điểm nghẽn chung và thử một thay đổi có người theo dõi.","Họp tất cả bộ phận để thống nhất rằng mỗi bên phải cố gắng hơn."],feedback:["Thêm xe có thể hữu ích, nhưng chưa chắc đúng điểm nghẽn; cần quan sát dòng công việc trước.","Bạn đi từ tín hiệu đến giả thuyết, lựa chọn thử nghiệm rồi theo dõi kết quả. Hãy xác định khi nào cần hiệu chỉnh.","Cuộc họp thiếu dữ kiện và quyết định rõ dễ kết thúc bằng cam kết chung chung."],frame:[["SEE","Thấy tín hiệu và sự kiện trên toàn dòng công việc."],["SENSE","Hiểu mối liên hệ, nguyên nhân khả dĩ và điều chưa biết."],["SELECT","Chọn điểm can thiệp có thể kiểm chứng."],["STEER","Phân công, theo dõi phản hồi và hiệu chỉnh."]],practice:"Chọn một điểm nghẽn trong tình huống. Viết một thử nghiệm 7 ngày: thay đổi gì, ai phụ trách, đo tín hiệu nào?",lens:["Bạn đang xử lý điểm nghẽn hay chỉ chuyển áp lực sang bộ phận khác?","Tín hiệu đo được có giúp biết thử nghiệm hiệu quả không?","Nếu kết quả xấu hơn, khi nào và ai sẽ hiệu chỉnh?"],extract:"ĐIỀU HƯỚNG là nhìn toàn hệ thống, chọn can thiệp phù hợp, theo dõi phản hồi và hiệu chỉnh liên tục.",task:"Lấy một vấn đề lặp lại; trong 24 giờ, vẽ dòng công việc và thống nhất một tín hiệu theo dõi với người liên quan."}
];
const key=(typeof window.__vabixStorageKey==="string"&&window.__vabixStorageKey)||"vabix-applier-leadership-v1";let saved={};try{saved=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){}
let session=Number.isInteger(window.__vabixSession)?Math.max(0,Math.min(3,window.__vabixSession)):Number.isInteger(saved.session)?Math.max(0,Math.min(3,saved.session)):0, step=Number.isInteger(saved.step)?Math.max(0,Math.min(6,saved.step)):0;
saved.answers=saved.answers||{};
const $=id=>document.getElementById(id);const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function markProgress(){const r=record();const filled=v=>typeof v==="string"&&v.trim().length>0;const bits=[Number.isInteger(r.choice),filled(r.observation),filled(r.practice),filled(r.lens),filled(r.improve),filled(r.extract),filled(r.action)&&filled(r.signal)];window.__bizcarProgress=Math.round(100*bits.filter(Boolean).length/bits.length)}function persist(){saved.session=session;saved.step=step;markProgress();try{localStorage.setItem(key,JSON.stringify(saved));$("save-status").textContent="Đã lưu trên thiết bị này"}catch(e){$("save-status").textContent="Chưa thể lưu trên thiết bị này"}}
function record(){return saved.answers[session]||(saved.answers[session]={})}
function changeSession(i){if(typeof window.__vabixOpenSession==="function"&&i!==session){persist();window.__vabixOpenSession(i);return}session=i;step=0;persist();render()}
function changeStep(i){step=i;persist();render();$("content").focus({preventScroll:true})}
function choice(i){const row=record();row.choice=i;row.choiceText=DATA[session].choices[i]||"";persist();render()}
function field(name,value){record()[name]=value;persist()}
function fieldHTML(name,label,placeholder,mini=false){return '<label class="field" for="'+name+'">'+label+'</label><textarea id="'+name+'" class="text-field '+(mini?'mini':'')+'" placeholder="'+esc(placeholder)+'">'+esc(record()[name]||"")+'</textarea>'}
function attachFields(){document.querySelectorAll("textarea").forEach(el=>el.addEventListener("input",()=>field(el.id,el.value)))}
function renderNav(){ $("sessions").innerHTML=DATA.map((d,i)=>'<button class="session-button '+(i===session?'active':'')+'" aria-current="'+(i===session?'true':'false')+'" data-session="'+i+'"><span>BUỔI 0'+(i+1)+'</span><strong>'+d.name+'</strong></button>').join("");document.querySelectorAll("[data-session]").forEach(el=>el.onclick=()=>changeSession(Number(el.dataset.session)));
 $("steps").innerHTML='<div class="rail-title">APPLIER · 07 BƯỚC</div>'+STEPS.map((s,i)=>'<button class="step '+(i===step?'active':'')+'" data-step="'+i+'" aria-current="'+(i===step?'step':'false')+'"><span class="n">'+s[0]+'</span>'+s[1]+'</button>').join("");document.querySelectorAll("[data-step]").forEach(el=>el.onclick=()=>changeStep(Number(el.dataset.step)))}
function optionHTML(d){return '<div class="options">'+d.choices.map((c,i)=>'<button class="option '+(record().choice===i?'selected':'')+'" data-choice="'+i+'" aria-pressed="'+(record().choice===i)+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+c+'</span></button>').join("")+'</div>'+(Number.isInteger(record().choice)?'<div class="feedback" role="status"><strong>Soi chiếu lựa chọn</strong><p>'+d.feedback[record().choice]+'</p></div>':'<p class="hint">Chọn phương án gần với phản ứng thật của bạn. Không có điểm số.</p>')}
function summaryText(){return DATA.map((d,i)=>{let a=saved.answers[i]||{};return 'BUỔI 0'+(i+1)+' — '+d.name+'\nLựa chọn: '+(Number.isInteger(a.choice)?d.choices[a.choice]:'Chưa chọn')+'\nBài thực hành: '+(a.practice||'Chưa ghi')+'\nSau soi chiếu, tôi sửa: '+(a.improve||'Chưa ghi')+'\nViệc trong 24 giờ: '+(a.action||'Chưa ghi')+'\nTín hiệu kiểm tra: '+(a.signal||'Chưa ghi')}).join('\n\n')}
function download(){const blob=new Blob(['THAO TRƯỜNG TỈNH THỨC – KIẾN TẠO – ĐIỀU HƯỚNG\nVABIX · APPLIER\n\n'+summaryText()],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="vabix-applier-hanh-dong.txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){renderNav();const d=DATA[session],r=record(),titles=["Cùng khởi động","Mô thức thực chiến","Thực hành tình huống","Soi chiếu quyết định","Cải tiến cách làm","Đúc kết bài học","Giải quyết trong 24 giờ"];let body="";
 if(step===0)body='<div class="scenario"><b>Tình huống thực tế</b>'+d.scenario+'</div><div class="prompt">'+d.activate+'</div>'+optionHTML(d);
 if(step===1)body='<p class="lead">Dùng mô thức này để nhìn lại tình huống vừa chọn. Mỗi thành phần là một câu hỏi có thể áp dụng tại nơi làm việc.</p><div class="framework">'+d.frame.map(([a,b])=>'<div><strong>'+a+'</strong><span>'+b+'</span></div>').join("")+'</div><div class="scenario"><b>Thử nối với công việc của bạn</b>Trong tình huống này, yếu tố nào đang yếu nhất? Vì sao?</div>'+fieldHTML("observation","Ghi nhanh một điều bạn vừa nhận ra","Ví dụ: Tôi đã kết luận trước khi có dữ kiện.",true);
 if(step===2)body='<div class="scenario"><b>Quay lại tình huống</b>'+d.scenario+'</div><div class="prompt">'+d.practice+'</div>'+fieldHTML("practice","Câu trả lời của bạn","Viết theo cách bạn sẽ thật sự nói hoặc làm trong công việc.")+'<p class="hint">Viết ngắn, cụ thể. Một người khác đọc vào phải biết bạn sẽ làm gì.</p>';
 if(step===3)body='<p class="lead">Đọc lại phần thực hành và kiểm tra bằng ba câu hỏi. Trao đổi với một học viên khác trước khi sửa.</p><div class="question-list">'+d.lens.map((x,i)=>'<div><b>0'+(i+1)+'.</b> '+x+'</div>').join("")+'</div><div class="action-card"><h3>Bản bạn đã viết</h3><p>'+esc(r.practice||"Bạn chưa viết phần thực hành. Có thể quay lại bước trước.")+'</p></div>'+fieldHTML("lens","Điểm mình cần xem lại","Điều gì trong câu trả lời ban đầu cần thay đổi?",true);
 if(step===4)body='<p class="lead">Giữ điều đã tốt, sửa một điểm có tác động lớn nhất. Viết phiên bản có thể dùng ngay.</p><div class="action-card"><h3>Bản đầu</h3><p>'+esc(r.practice||"Chưa có bản đầu; hãy viết một phương án cụ thể ở đây.")+'</p></div>'+fieldHTML("improve","Phiên bản sau cải tiến","Viết lời nói, quyết định hoặc quy tắc bạn sẽ áp dụng.")+'<p class="hint">Kiểm tra: ai làm, làm gì, khi nào và dựa vào tín hiệu nào?</p>';
 if(step===5)body='<div class="takeaway">'+d.extract+'</div><p class="prompt">Bài học nào áp dụng được ngay cho vai trò của bạn?</p>'+fieldHTML("extract","Đúc kết bằng lời của mình","Một câu ngắn, liên hệ với công việc của bạn.")+'<div class="action-card"><h3>Từ cá nhân đến hệ thống</h3><p>TỈNH giúp nhìn rõ · CHỦ giúp tự điều hành · KIẾN TẠO giúp đội ngũ cùng làm · ĐIỀU HƯỚNG giúp cả hệ thống học và hiệu chỉnh.</p></div>';
 if(step===6)body='<p class="lead">Rời lớp với một hành động có thể thực hiện trong 24 giờ và một tín hiệu để biết nó có tác dụng.</p><div class="action-card"><h3>Gợi ý sát nội dung buổi này</h3><p>'+d.task+'</p></div>'+fieldHTML("action","Trong 24 giờ, tôi sẽ làm gì?","Một việc nhỏ, có đối tượng và thời điểm rõ.")+fieldHTML("signal","Tôi sẽ nhìn vào tín hiệu nào để biết có thay đổi?","Ví dụ: số lần báo sớm, thời gian phản hồi, câu trả lời của nhân viên.",true)+'<button class="secondary" id="download">Tải kế hoạch 04 buổi (.txt)</button><p class="print-note">Câu trả lời được giữ trên thiết bị này. Bạn có thể tải bản ghi để dùng sau buổi học.</p>';
 $("content").innerHTML='<div class="card-head"><div><div class="kicker">BUỔI 0'+(session+1)+' · '+d.focus+' · '+STEPS[step][0]+'</div><h2>'+titles[step]+'</h2></div><span class="time">'+(step===0?'3–5':step===2||step===4?'7–10':'4–6')+' phút</span></div>'+body+'<div class="footer-actions"><button class="secondary" id="previous" '+(step===0?'disabled':'')+'>← Bước trước</button><div class="right"><button class="primary" id="next">'+(step===6?(session===3?'Xem lại từ đầu':'Sang buổi tiếp →'):'Bước tiếp →')+'</button></div></div>';
 attachFields();document.querySelectorAll("[data-choice]").forEach(el=>el.onclick=()=>choice(Number(el.dataset.choice)));$("previous").onclick=()=>changeStep(step-1);$("next").onclick=()=>step<6?changeStep(step+1):session<3?changeSession(session+1):(session=0,changeStep(0));if($("download"))$("download").onclick=download;markProgress();
}
(function(){const row=saved.answers[session];if(row&&Number.isInteger(row.choice)&&!row.choiceText){row.choiceText=DATA[session].choices[row.choice]||"";persist()}})();
render();
if(document.modelContext?.registerTool){
 const tools=[
  {name:"open_learning_step",title:"Mở bước thực hành",description:"Mở một buổi học và một bước APPLIER trên trang.",inputSchema:{type:"object",properties:{session:{type:"integer",minimum:1,maximum:4},step:{type:"integer",minimum:1,maximum:7}},required:["session","step"],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!Number.isInteger(input?.session)||input.session<1||input.session>4||!Number.isInteger(input?.step)||input.step<1||input.step>7)throw Error("Buổi phải từ 1 đến 4, bước từ 1 đến 7.");session=input.session-1;step=input.step-1;persist();render();return {session:input.session,step:input.step,title:STEPS[step][1]}}},
  {name:"save_learning_action",title:"Ghi hành động sau lớp",description:"Lưu hành động 24 giờ và tín hiệu kiểm tra cho một buổi học.",inputSchema:{type:"object",properties:{session:{type:"integer",minimum:1,maximum:4},action:{type:"string",minLength:1},signal:{type:"string",minLength:1}},required:["session","action","signal"],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!Number.isInteger(input?.session)||input.session<1||input.session>4||typeof input.action!=="string"||!input.action.trim()||typeof input.signal!=="string"||!input.signal.trim())throw Error("Cần buổi học, hành động và tín hiệu kiểm tra.");const a=saved.answers[input.session-1]||(saved.answers[input.session-1]={});a.action=input.action.trim();a.signal=input.signal.trim();session=input.session-1;step=6;persist();render();return {session:input.session,action:a.action,signal:a.signal}}},
  {name:"read_learning_summary",title:"Đọc bản thực hành",description:"Xem lại lựa chọn và hành động đã lưu trên thiết bị này.",inputSchema:{type:"object",properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(){return {summary:summaryText()}}}
 ];
 for(const tool of tools)try{Promise.resolve(document.modelContext.registerTool(tool)).catch(()=>{})}catch(e){}
}
</script>
</body>
</html>

{

 ],

const key=(typeof window.__babosoraStorageKey==="string"&&window.__babosoraStorageKey)||'babosora-applier-v1';
let state={session:0,step:0,group:'',answers:{},completed:{},example:{},caseIndex:{},revealed:{}};
try{state={...state,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}
if(Number.isInteger(window.__babosoraSession))state.session=Math.max(0,Math.min(3,window.__babosoraSession));
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}updateProgress()}
function ansKey(s=state.session){return 's'+s}function answers(s=state.session){return state.answers[ansKey(s)]||(state.answers[ansKey(s)]={})}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function updateProgress(){const platform=typeof window.__babosoraStorageKey==="string";const done=platform?STEPS.filter((_,j)=>state.completed[state.session+'-'+j]).length:Object.keys(state.completed).filter(k=>state.completed[k]).length;const total=platform?STEPS.length:SESSIONS.length*STEPS.length;const p=total?Math.round(done/total*100):0;window.__bizcarProgress=p;$('progress-fill').style.width=p+'%';$('progress-text').textContent=p+'%';renderSessionNav()}
function renderSessionNav(){ $('session-list').innerHTML=SESSIONS.map((s,i)=>{const count=STEPS.filter((_,j)=>state.completed[i+'-'+j]).length;return `<button class="session-link ${i===state.session?'active':''}" data-session="${i}"><b class="num">0${i+1}</b><div><b>${s.code}</b><span>${s.title}</span></div><i class="done">${count}/7</i></button>`}).join('');document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>{const i=+b.dataset.session;if(typeof window.__babosoraOpenSession==="function"&&i!==state.session){save();window.__babosoraOpenSession(i);return}state.session=i;state.step=0;save();render()})}
function renderHeader(){const s=SESSIONS[state.session];$('crumb').textContent=`BUỔI 0${state.session+1} · ${s.code}`;$('session-head').innerHTML=`<div><div class="session-kicker">BUỔI 0${state.session+1} · APPLIER LAB</div><h1>${s.title}</h1><p>${s.desc}</p></div><div class="deliverable"><b>Đầu ra của buổi</b><span>${s.deliverable}</span></div>`}
function renderSteps(){ $('stepbar').innerHTML=STEPS.map((x,i)=>`<button class="step-btn ${i===state.step?'active':''} ${state.completed[state.session+'-'+i]?'done-step':''}" data-step="${i}"><span class="step-code">${x[0]}</span><span class="step-label">${x[1]}</span></button>`).join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{state.step=+b.dataset.step;save();render();$('panel').focus({preventScroll:true})})}
function head(title,desc,badge){return `<div class="panel-head"><div><h2>${title}</h2><p>${desc}</p></div><span class="badge">${badge}</span></div>`}
function renderActivate(s){const a=s.activate,k='activate',chosen=answers()[k];return head('Cùng khởi động','Ra quyết định trước khi nhìn thấy mô thức.','3–5 phút')+`<div class="scenario"><b>Tình huống điều hành</b>${a.scenario}</div><div class="prompt">${a.prompt}</div><div class="choice-grid">${a.choices.map((c,i)=>`<button class="choice ${chosen===i?'selected':''}" data-choice="${i}"><span class="check">✓</span><span>${c}</span></button>`).join('')}</div>${Number.isInteger(chosen)?`<div class="feedback"><b>Soi nhanh</b><br>${a.feedback}</div>`:'<p class="muted">Chọn phương án gần với cách nhóm sẽ quyết định trong thực tế.</p>'}`}
function renderParadigm(s){let idx=state.example[state.session]||0,e=s.examples[idx];return head('Mô thức thực chiến','Nắm mô thức qua nhiều ví dụ ở các ngành khác nhau.',s.examples.length+' ví dụ')+`<div class="formula">${s.formula}</div><div class="concept-grid">${s.concepts.map(c=>`<div class="concept"><strong>${c[0]}</strong><p>${c[1]}</p></div>`).join('')}</div><div class="examples-title"><h3>Kho ví dụ</h3><span>Bấm chọn ngành để xem</span></div><div class="example-tabs">${s.examples.map((x,i)=>`<button class="example-tab ${i===idx?'active':''}" data-example="${i}">${x[0]}</button>`).join('')}</div><div class="example-card"><div class="industry">${e[0]}</div><div><h4>${e[1]}</h4><p>${e[2]}</p></div></div>`}
function renderPractice(s){let ci=state.caseIndex[state.session]||0,c=s.cases[ci],ca=answers()['case'+ci]||(answers()['case'+ci]={});return head('Thực hành nhóm','Dùng dữ kiện mở, bấm chọn nhanh và bảo vệ quyết định bằng mô thức.','15–20 phút')+`<div class="case-picker">${s.cases.map((x,i)=>`<button class="case-btn ${i===ci?'active':''}" data-case="${i}">${x.name}</button>`).join('')}</div><div class="case-layout"><div class="data-board"><h3>${c.name}</h3><p class="muted">${c.brief}</p><div class="fact-grid">${c.facts.map(f=>`<div class="fact"><span>${f[0]}</span><b>${f[1]}</b></div>`).join('')}</div><div class="prompt">Dữ kiện nào còn thiếu trước khi quyết định?</div><textarea class="text-field small" id="unknown" placeholder="Ghi ngắn các câu hỏi nhóm cần xác minh...">${esc(ca.unknown||'')}</textarea></div><div class="decision-board"><h3>Quyết định của nhóm</h3><p class="muted">Mỗi dòng chọn một phương án. Có thể thay đổi sau phần soi chiếu.</p>${c.fields.map((f,fi)=>`<div class="field"><label>${fi+1}. ${f[0]}</label><div class="select-options">${f[1].map((o,oi)=>`<button class="pill ${ca['f'+fi]===oi?'selected':''}" data-field="${fi}" data-option="${oi}">${o}</button>`).join('')}</div></div>`).join('')}<div class="result-box"><b>Tóm tắt:</b> ${summaryCase(c,ca)}</div><button class="reveal" id="reveal">${state.revealed[state.session+'-'+ci]?'Ẩn góc soi chiếu':'Mở góc soi chiếu sau khi nhóm chốt'}</button>${state.revealed[state.session+'-'+ci]?`<div class="reveal-content"><b>Góc soi chiếu:</b> ${c.insight}</div>`:''}</div></div>`}
function summaryCase(c,ca){let parts=[];c.fields.forEach((f,i)=>{if(Number.isInteger(ca['f'+i]))parts.push(`${f[0]}: ${f[1][ca['f'+i]]}`)});return parts.length?esc(parts.join(' · ')):'Nhóm chưa chọn đủ dữ kiện.'}
function renderReflect(s){const saved=answers().reflect||{};return head('Soi chiếu quyết định','Dùng tiêu chuẩn chung để phản biện phương án, không tranh luận bằng cảm tính.','8–10 phút')+`<div class="scenario"><b>Cách thực hiện</b>Đổi kết quả với một nhóm khác. Nhóm phản biện chỉ được đặt câu hỏi và chỉ ra bằng chứng còn thiếu, chưa đưa giải pháp ngay.</div><div class="checklist">${s.reflect.map((x,i)=>`<label class="check-row"><input type="checkbox" data-reflect="${i}" ${saved[i]?'checked':''}><span><b>${x}</b><span>Đánh dấu khi nhóm đã kiểm tra và có bằng chứng.</span></span></label>`).join('')}</div><div class="prompt">Điểm nhóm cần xem lại nhất</div><textarea class="text-field" id="reflection" placeholder="Ghi nhận phản biện quan trọng nhất...">${esc(answers().reflection||'')}</textarea>`}
function renderImprove(s){return head('Cải tiến phương án','Giữ điều đã đúng, sửa một điểm có tác động lớn nhất.','7–10 phút')+`<div class="two-col"><div><div class="prompt">Phương án ban đầu</div><textarea class="text-field" id="before" placeholder="Tóm tắt quyết định ban đầu...">${esc(answers().before||'')}</textarea></div><div><div class="prompt">Phiên bản sau soi chiếu</div><textarea class="text-field" id="after" placeholder="Nhóm sẽ thay đổi điều gì và vì sao?">${esc(answers().after||'')}</textarea></div></div><div class="prompt">Bằng chứng hoặc dữ liệu cần bổ sung</div><textarea class="text-field small" id="evidence" placeholder="Dữ liệu nào sẽ giúp xác nhận phương án?">${esc(answers().evidence||'')}</textarea>`}
function renderExtract(s){return head('Đúc kết mô thức','Chuyển trải nghiệm vừa làm thành nguyên lý quản trị có thể tái sử dụng.','4–6 phút')+`<div class="takeaway">${s.takeaway}</div><div class="flow"><span>B2A</span><i>→</i><span>BA</span><i>→</i><span>BTS</span><i>→</i><span>BO</span><i>→</i><span>SO</span><i>→</i><span>BRUCCS</span><i>→</i><span>RA</span></div><div class="prompt">Đúc kết bằng lời của nhóm</div><textarea class="text-field" id="extract" placeholder="Một câu ngắn mà nhóm sẽ dùng khi trở về doanh nghiệp...">${esc(answers().extract||'')}</textarea>`}
function renderResolve(s){return head('Giải quyết tại doanh nghiệp','Áp dụng mô thức vào một trường hợp thật và tạo đầu ra có thể hành động.','15 phút')+`<div class="own-grid">${s.own.map((x,i)=>`<div class="own-card"><label for="own-${x[0]}">${x[1]}</label><textarea id="own-${x[0]}" data-own="${x[0]}" class="text-field small" placeholder="${x[2]}">${esc((answers().own||{})[x[0]]||'')}</textarea></div>`).join('')}</div><div class="scenario"><b>Chuẩn đầu ra</b>Một người khác đọc kết quả phải biết nhóm chọn đối tượng nào, dựa trên dữ kiện gì, quyết định điều gì, ai thực hiện và khi nào kiểm tra lại.</div>`}
function controls(){return `<div class="panel-actions"><div class="timer"><span class="muted">Bộ đếm nhóm</span><span class="timer-display" id="timer-display">15:00</span><button class="secondary" id="timer-btn">Bắt đầu</button></div><div><button class="secondary" id="mark-btn">${state.completed[state.session+'-'+state.step]?'Đã hoàn thành ✓':'Đánh dấu hoàn thành'}</button> <button class="primary" id="next-btn">${state.step<6?'Bước tiếp →':state.session<3?'Sang buổi tiếp →':'Hoàn tất Flowbook'}</button></div></div>`}
let timerId=null,timerLeft=900;
function bind(s){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const i=+b.dataset.choice;answers().activate=i;answers().choiceText=SESSIONS[state.session].activate.choices[i]||'';save();renderPanel()});document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{state.example[state.session]=+b.dataset.example;save();renderPanel()});document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{state.caseIndex[state.session]=+b.dataset.case;save();renderPanel()});document.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{let ci=state.caseIndex[state.session]||0,ca=answers()['case'+ci]||(answers()['case'+ci]={});ca['f'+b.dataset.field]=+b.dataset.option;save();renderPanel()});if($('unknown'))$('unknown').oninput=e=>{let ci=state.caseIndex[state.session]||0,ca=answers()['case'+ci]||(answers()['case'+ci]={});ca.unknown=e.target.value;save()};if($('reveal'))$('reveal').onclick=()=>{let ci=state.caseIndex[state.session]||0,k=state.session+'-'+ci;state.revealed[k]=!state.revealed[k];save();renderPanel()};document.querySelectorAll('[data-reflect]').forEach(c=>c.onchange=()=>{let r=answers().reflect||(answers().reflect={});r[c.dataset.reflect]=c.checked;save()});['reflection','before','after','evidence','extract'].forEach(id=>{if($(id))$(id).oninput=e=>{answers()[id]=e.target.value;save()}});document.querySelectorAll('[data-own]').forEach(t=>t.oninput=()=>{let o=answers().own||(answers().own={});o[t.dataset.own]=t.value;save()});$('mark-btn').onclick=()=>{let k=state.session+'-'+state.step;state.completed[k]=!state.completed[k];save();toast(state.completed[k]?'Đã ghi nhận hoàn thành':'Đã bỏ đánh dấu');renderPanel()};$('next-btn').onclick=()=>{state.completed[state.session+'-'+state.step]=true;if(state.step<6)state.step++;else if(state.session<3){if(typeof window.__babosoraOpenSession==="function"){save();window.__babosoraOpenSession(state.session+1);return}state.session++;state.step=0}else{exportFlowbook();return}save();render();$('panel').focus({preventScroll:true})};$('timer-btn').onclick=startTimer}
function startTimer(){if(timerId){clearInterval(timerId);timerId=null;$('timer-btn').textContent='Tiếp tục';return}timerId=setInterval(()=>{timerLeft--;let m=Math.floor(timerLeft/60),s=timerLeft%60;if($('timer-display'))$('timer-display').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(timerLeft<=0){clearInterval(timerId);timerId=null;timerLeft=900;toast('Hết thời gian thảo luận nhóm')}} ,1000);$('timer-btn').textContent='Tạm dừng'}
function renderPanel(){clearInterval(timerId);timerId=null;timerLeft=900;const s=SESSIONS[state.session];let html=[renderActivate,renderParadigm,renderPractice,renderReflect,renderImprove,renderExtract,renderResolve][state.step](s);$('panel').innerHTML=html+controls();bind(s)}
function render(){renderSessionNav();renderHeader();renderSteps();renderPanel();updateProgress()}
function exportFlowbook(){let lines=['BABOSORA REVENUE FLOWBOOK','Nhóm/Doanh nghiệp: '+(state.group||'Chưa ghi'),'Ngày xuất: '+new Date().toLocaleDateString('vi-VN'),''];SESSIONS.forEach((s,i)=>{let a=state.answers['s'+i]||{};lines.push(`BUỔI 0${i+1} — ${s.title}`,s.deliverable);if(a.extract)lines.push('Đúc kết: '+a.extract);if(a.after)lines.push('Phương án cải tiến: '+a.after);if(a.own){s.own.forEach(x=>lines.push(`${x[1]}: ${a.own[x[0]]||'Chưa ghi'}`))}lines.push('')});const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BABOSORA-Revenue-Flowbook.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Đã tạo Revenue Flowbook')}
$('group-name').value=state.group||'';$('group-name').oninput=e=>{state.group=e.target.value;save()};$('export-btn').onclick=exportFlowbook;$('print-btn').onclick=()=>window.print();$('reset-btn').onclick=()=>{if(confirm('Xóa toàn bộ câu trả lời và tiến độ trên thiết bị này?')){localStorage.removeItem(key);location.reload()}};
(function(){const a=answers();if(Number.isInteger(a.activate)&&!a.choiceText){a.choiceText=SESSIONS[state.session].activate.choices[a.activate]||'';save()}})();
render();
if(document.modelContext?.registerTool){
 const tools=[
  {name:'open_applier_step',title:'Mở bước APPLIER',description:'Mở một buổi và bước APPLIER cụ thể.',inputSchema:{type:'object',properties:{session:{type:'integer',minimum:1,maximum:4},step:{type:'integer',minimum:1,maximum:7}},required:['session','step'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){state.session=input.session-1;state.step=input.step-1;save();render();return {session:input.session,step:input.step,title:STEPS[state.step][1]}}},
  {name:'read_flowbook_progress',title:'Đọc tiến độ Flowbook',description:'Xem tiến độ và các đầu ra đã lưu trên thiết bị.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(){return {group:state.group,completed:Object.values(state.completed).filter(Boolean).length,total:28,answers:state.answers}}}
 ];tools.forEach(t=>{try{Promise.resolve(document.modelContext.registerTool(t)).catch(()=>{})}catch(e){}})
}

<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M-RIM · SCP · MyBizCar</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4ec;color:#173d3d;font:16px/1.6 system-ui}header{background:#173d3d;color:white;padding:18px 4%;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header span{flex:1}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;color:#173d3d;border:1px solid #bdcdc7;border-radius:10px;padding:9px 14px}button:hover,button.active{background:#d5ecdd}nav{display:flex;gap:8px;padding:16px 4%;flex-wrap:wrap;border-bottom:1px solid #d4ddd4}nav button{flex:1;min-width:140px;text-align:left}nav small{display:block;font-size:12px}main{max-width:1400px;margin:auto;padding:28px}h1{font-size:38px;line-height:1.2}h2{font-size:24px}article,.card{background:white;border:1px solid #d9dfd4;border-radius:18px;padding:24px;margin-bottom:20px;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}.wheels{display:grid;grid-template-columns:1fr 1fr;gap:22px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:block;font-weight:600;margin:12px 0}input:not([type=checkbox]),textarea,select{width:100%;padding:10px;border:1px solid #b6c9c2;border-radius:8px;color:inherit;background:#fcfdf8}textarea{min-height:85px;resize:vertical}small,.muted{font-size:13px;color:#5b7270}.tag{font-size:13px;background:#e6eee3;padding:4px 9px;border-radius:15px}.warn{padding:12px;background:#fff2d9;border-left:4px solid #c9922e;margin:9px 0}.conflict{background:#ffebe3;border-left-color:#bd5745}.wheel{width:100%;height:280px}.wheel [role=button]{cursor:pointer}.wheel [role=button]:focus{outline:none;stroke:#d18d26;stroke-width:4}fieldset{border:1px solid #d8e1d6;border-radius:12px;margin:18px 0;padding:18px;min-width:0}summary{cursor:pointer;font-weight:bold}details{margin:14px 0}table{width:100%;border-collapse const sectors=[['Thực phẩm','Bữa sáng nhận trước giờ làm','Suất đóng gói → dùng nhanh → tiết kiệm thời gian','AC','Nhân viên văn phòng','Online','Logistics','Thời điểm nhận có khớp thời gian giao?'],['Bán lẻ','Chọn đúng sản phẩm gia dụng','Thông tin rõ → chọn đúng → giảm rủi ro mua','AH','Người sử dụng trong hộ','Omni','KOC','Tư vấn trực tuyến và cửa hàng có dùng cùng thông tin?'],['Phần mềm','Giảm nhập liệu lặp lại','Tích hợp dữ liệu → giảm thao tác → tiết kiệm nguồn lực','AC','Nhân viên vận hành','Online','Đơn vị liên kết','Hạ tầng và quyền phê duyệt của khách đã rõ chưa?'],['Sản xuất','Linh kiện phù hợp yêu cầu lắp ráp','Thông số phù hợp → lắp ổn định → giảm lỗi','AC','Kỹ thuật viên khách hàng','Offline','Đơn vị liên kết','Khách có cần mẫu thử và đánh giá kỹ thuật tại địa chỉ?'],['Đào tạo','Thiết kế quản trị áp dụng được','Bài tập thật → luyện kỹ năng → cải thiện cách quản lý','AC','Quản lý cấp trung','Omni','Đơn vị liên kết','Người học và người duyệt ngân sách có phải một người?'],['Du lịch','Hành trình phù hợp nhóm gia đình','Lịch trình phù hợp → thuận tiện → an tâm','AH','Thành viên gia đình','Online','KOL','Nội dung giới thiệu có đúng nhóm khách và điều kiện phục vụ?'],['Nông nghiệp','Vật tư phù hợp vùng canh tác','Đặc tính phù hợp → hỗ trợ canh tác → hiệu quả sử dụng','AR','Người tư vấn bán lại','Offline','Đơn vị truyền thông','Đơn vị mua để bán lại là AR; ai thực hiện vai trò đồng hành riêng?'],['Logistics','Giao nhận theo lịch','Theo dõi trạng thái → chủ động nhận → giảm gián đoạn','AC','Điều phối kho khách','Old','Đơn vị liên kết','Telesales có tiếp cận đúng người quyết định không?'],['Dịch vụ tại công cộng','Tiếp cận dịch vụ thuận tiện','Điểm phục vụ dễ dùng → tiếp cận nhanh → thuận tiện','AP','Người sử dụng tại địa điểm','Offline','Đơn vị liên kết','Ai vận hành địa điểm, ai trả tiền, ai sử dụng?'],['Nội thất','Giải pháp phù hợp không gian','Thiết kế theo hiện trạng → dùng phù hợp → tiện nghi','AH','Người sử dụng trong hộ','Omni','Đơn vị liên kết','Khảo const wbKeys=['concern','goal','self','peer','uncertain','lesson','apply','action','owner','due','proof'];
function fresh(){return {kind:'mrim',version:1,company:'',product:'',vbf:[],designs:[],workbook:Object.fromEntries(wbKeys.map(k=>[k,'']))}}
function item(kind){return Object.fromEntries(fields[kind].map(([k])=>[k,'']))}
function design(){return {id:uid(),name:'',vbf:[],segment:{...item('segment'),address:'',level:'',area:'',country:''},channel:{...item('channel'),types:[],offline:''},partners:[],partnerReason:'',constraints:{needHours:'',serveHours:'',targetUnits:'',capacityUnits:'',period:'',unit:''},improve:'',owner:'',due:''}}
let state=fresh(),tab='activate',selected='',focus='S',filter='',mode='own';const KEY='mybizcar-mrim-1';
function validate(s){const str=x=>typeof x==='string'&&x.length<=30000;if(!s||s.kind!=='mrim'||s.version!==1||!Array.isArray(s.vbf)||!Array.isArray(s.designs)||s.vbf.length>2000||s.designs.length>200)throw Error('Không đúng hồ sơ M-RIM 1.0');if(!str(s.company)||!str(s.product))throw Error('Bối cảnh không hợp lệ');for(const k of wbKeys)if(!str(s.workbook?.[k]))throw Error('Thiếu APPLIER');const vids=new Set;for(const v of s.vbf){if(!str(v.id)||vids.has(v.id)||!['V','B','F'].includes(v.type)||!str(v.text))throw Error('VBF không hợp lệ');vids.add(v.id)}const ids=new Set;for(const d of s.designs){if(!str(d.id)||ids.has(d.id))throw Error('ID trùng');ids.add(d.id);for(const k of ['name','partnerReason','improve','owner','due'])if(!str(d[k]))throw Error('Thiếu cấu hình');if(!Array.isArray(d.vbf)||d.vbf.some(k=>!vids.has(k)))throw Error('Mất liên kết VBF');for(const g of ['segment','channel'])for(const [k]of fields[g])if(!str(d[g]?.[k]))throw Error('Thiếu SCP');for(const k of ['address','level','area','country'])if(!str(d.segment[k]))throw Error('Thiếu địa bàn');if(d.segment.address&&!addr[d.segment.address]||d.segment.level&&!levels[d.segment.level])throw Error('Sai loại địa chỉ/địa bàn');if(!Array.isArray(d.channel.types)||d.channel.types.some(k=>!channels[k])||!str(d.channel.offline))throw Error('Kênh không hợp lệ');if(!Array.isArray(d.partners)||d.partners.length>100)throw Error('Đối tác không hợp lệ');for(const p of d.partners){for(const [k]of fields.partner)if(!str(p[k]))throw Error('Thiếu dữ kiện đối tác');if(!str(p.type)||!['partner','buyer','both'].includes(p.role))throw Error('Vai trò không hợp lệ')}for(const k of ['needHours','serveHours','targetUnits','capacityUnits']){const v=d.constraints?.[k];if(!str(v)||(v!==''&&(!Number.isFinite(Number(v))||Number(v)<0)))throw Error('Số liệu phải không âm hoặc để trống')}for(const k of ['period','unit'])if(!str(d.constraints[k]))throw Error('Thiếu kỳ/đơn vị')}return s}
try{let raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw))}catch{setTimeout(()=>notice('Không đọc được hồ sơ cũ; chưa ghi đè dữ liệu. Hãy giữ bản JSON dự phòng.'),100)}
const cur=()=>state.designs.find(d=>d.id===selected)||state.designs[0];function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notice('Không lưu được. Xuất JSON để giữ dữ liệu.')}}function notice(s){$('#notice').textContent=s;$('#notice').style.display='block';setTimeout(()=>$('#notice').style.display='none',5000)}
const opts=(o,v)=>'<option value="">Chưa chọn</option>'+Object.entries(o).map(([k,t])=>`<option value="${k}" ${v===k?'selected':''}>${esc(t)}</option>`).join('');
function field(l,p,v,type='textarea'){return `<label>${esc(l)}${type==='textarea'?`<textarea data-field="${p}">${esc(v)}</textarea>`:`<input data-field="${p}" type="${type}" ${type==='number'?'min="0" step="any"':''} value="${esc(v)}">`}</label>`}const wb=(l,k)=>field(l,'workbook.'+k,state.workbook[k]);
function audit(d){let a=[];const add=(type,msg)=>a.push({type,msg});if(!d.vbf.length)add('missing','Chưa nối VBF → chưa biết đang chọn SCP cho giá trị nào.');if(!d.segment.address||!d.segment.uc.trim()||!d.segment.area.trim()||!d.segment.level)add('missing','S thiếu UC, loại Address hoặc cấp/tên Area → bổ sung phạm vi khách hàng.');if(![d.segment.need,d.segment.aspiration,d.segment.pain].some(x=>x.trim()))add('missing','Chưa có NAP → xác minh nhu cầu, mong muốn hoặc điểm đau.');if(['capacity','authority','priority'].some(k=>!d.segment[k].trim()))add('missing','CAP chưa đầy đủ → xác minh Capacity, Authority, Priority.');if(!d.segment.fit.trim()||!d.segment.basis.trim())add('risk','Chưa có lý do khớp VBF hoặc nguồn kiểm chứng Segment.');if(!d.channel.types.length)add('missing','Chưa chọn kênh.');if(d.channel.types.includes('Offline')&&!d.channel.offline)add('missing','Offline chưa rõ khách đến điểm bán hay doanh nghiệp đến địa chỉ khách.');if(d.channel.types.includes('Omni')&&!d.channel.handoff.trim())add('risk','Chọn Omni nhưng chưa mô tả chuyển tiếp thông tin và trách nhiệm.');if(!d.channel.fit.trim()||!d.channel.operations.trim())add('missing','Kênh thiếu lý do phù hợp hoặc điều kiện vận hành.');if(!d.partners.length&&!d.partnerReason.trim())add('missing','Chưa có Partner hoặc lý do tự phục vụ không cần Partner.');for(const p of d.partners){if(p.role==='buyer')add('conflict',(p.name||'Một bên')+' chỉ được khai là mua để bán lại → quản trị ở S/AR, không tự coi là Partner.');if(!p.contribution.trim()||!p.coverage.trim()||!p.capability.trim())add('missing',(p.name||'Partner')+' thiếu đóng góp, phạm vi hoặc căn cứ năng lực.');if(p.role==='both'&&!p.contribution.trim())add('risk','Bên có hai vai trò cần tách đóng góp đồng hành khỏi giao dịch mua để bán lại.')}const q=d.constraints;if(q.needHours!==''&&q.serveHours!==''&&+q.serveHours>+q.needHours)add('conflict',`Thời gian phục vụ ${q.serveHours} giờ vượt thời gian khách chấp nhận ${q.needHours} giờ → đổi lời hứa, kênh, Partner hoặc phạm vi phục vụ.`);if(q.targetUnits!==''&&q.capacityUnits!==''){if(!q.unit.trim()||!q.period.trim())add('missing','Chưa có đơn vị/kỳ chung → chưa so sánh quy mô với công suất.');else if(+q.targetUnits>+q.capacityUnits)add('conflict',`Mục tiêu ${q.targetUnits} ${q.unit}/${q.period} vượt năng lực ${q.capacityUnits} → giảm phạm vi hoặc bổ sung năng lực.`)}return a}
function rim(kind,d){const left=kind==='V',items=left?['V','B','F']:['S','C','P'],colors=['#24877b','#cd973f','#577fbd'];return `<svg class="wheel" viewBox="0 0 400 300" role="img" aria-label="${left?'V-RIM giá trị':'M-RIM thị trường'}"><ellipse cx="200" cy="281" rx="112" ry="10" fill="#173d3d18"/><circle cx="200" cy="144" r="125" fill="#264b4e"/><circle cx="200" cy="144" r="107" fill="#e9eee2" stroke="#b8c9c3" stroke-width="12"/>${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6;return `<path d="M200 144 L${200+Math.cos(a)*100} ${144+Math.sin(a)*100}" stroke="#8caaa5" stroke-width="7"/>`}).join('')}<circle cx="200" cy="144" r="46" fill="#173d3d"/><text x="200" y="150" text-anchor="middle" fill="white" font-size="18" font-weight="bold">${kind}-RIM</text>${items.map((k,i)=>{const a=-Math.PI/2+i*2*Math.PI/3,x=200+Math.cos(a)*106,y=144+Math.sin(a)*106;return `<g role="button" tabindex="0" aria-label="${k}" data-wheel="${k}"><circle cx="${x}" cy="${y}" r="25" fill="${colors[i]}" stroke="white" stroke-width="3"/><text x="${x}" y="${y+7}" text-anchor="middle" fill="white" font-size="22">${k}</text></g>`}).join('')}</svg>`}
function wheels(d){const linked=state.vbf.filter(v=>d?.vbf.includes(v.id));return `<div class="wheels"><article><h2>V-RIM · Giá trị cung cấp</h2>${rim('V',d)}${linked.map(v=>`<p><span class="tag">${v.type}</span> ${esc(v.text)}</p>`).join('')||'<p>Chưa nối VBF cho phương án này.</p>'}</article><article><h2>M-RIM · Cấu trúc thị trường</h2>${rim('M',d)}<p><b>S:</b> ${esc(d?.segment.uc||'Chưa xác định UC')} · ${esc(d?.segment.address||'?')} · ${esc(d?.segment.area||'Chưa rõ Area')}</p><p><b>C:</b> ${esc(d?.channel.types.join(' / ')||'Chưa chọn kênh')}</p><p><b>P:</b> ${esc(d?.partners.map(p=>p.name||p.type).join(', ')||'Chưa có Partner')}</p></article></div><p class="muted">Bấm V/B/F để xem liên kết; S/C/P để mở phần thiết kế. Hai mâm là hình minh họa cấu trúc, không phải điểm đồng pha, đồng tốc hoặc đồng kích.</p>`}
function selectors(){return `<div class="row"><button data-action="add">＋ Phương án SCP</button>${state.designs.map(d=>`<button data-select="${esc(d.id)}" class="${d===cur()?'active':''}">${esc(d.name||'Chưa đặt tên')}</button>`).join('')}</div><br>`}
function activate(){return `<h1>Giá trị này dành cho ai?</h1><p>Thiết kế thị trường từ VBF: đúng UC tại Address và Area, qua kênh phù hợp, cùng Partner có đóng góp rõ.</p><div class="grid"><article>${field('Doanh nghiệp','company',state.company,'text')}${field('Sản phẩm / dịch vụ','product',state.product,'text')}${wb('Khó khăn khi chọn khách hàng, kênh hoặc đối tác','concern')}${wb('Điều muốn làm rõ sau buổi học','goal')}</article><article><h2>Mâm trước phải khớp nhau</h2><p>SCP không đứng riêng khỏi VBF. Một lựa chọn phải nói được vì sao phù hợp, cần điều kiện nào, bằng chứng ở đâu và khi nào cần thay đổi.</p><p>Chưa biết không có nghĩa không có nhu cầu. Hồ sơ đầy đủ không tự chứng minh thị trường sẽ mua.</p></article></div>${wheels(cur())}`}
function paradigm(){return `<h1>SCP · Mô thức thực chiến</h1><div class="grid"><article><h2>S · Segment theo B2A</h2><p>UC có thể ở bất kỳ địa chỉ nào; người dùng, người mua, người trả tiền và người quyết định có thể khác nhau.</p>${Object.values(addr).map(x=>`<p>${x}</p>`).join('')}<p>Area A0–A4: chọn cấp và tên địa bàn; tên đơn vị địa phương được tùy chỉnh khi dùng quốc tế.</p><p><b>NAP:</b> Need, Aspiration, Pain. <b>CAP:</b> Capacity, Authority, Priority. Không nhân điểm tự chấm.</p></article><article><h2>C · Channel</h2><p><b>Old:</b> TV, telesales và hình thức truyền thống được mô tả cụ thể.</p><p><b>Offline:</b> cửa hàng / điểm bán hoặc bán trực tiếp tại địa chỉ khách.</p><p><b>Online:</b> website, ứng dụng, sàn, hình thức trực tuyến.</p><p><b>Omni:</b> có chuyển tiếp và phối hợp giữa các kênh; không chỉ có nhiều kênh.</p></article><article><h2>P · Partners</h2><p>KOL, KOC, logistics, đơn vị truyền thông, đơn vị liên kết hoặc bất cứ bên nào có đóng góp đồng hành đưa sản phẩm dịch vụ đến Address/UC.</p><p>Khách mua để bán lại là <b>AR trong S</b>. Nếu cùng một bên có thêm vai trò Partner, ghi riêng phần đồng hành.</p></article></div><h2>12 ví dụ gợi mở theo ngành</h2><p>Tình huống mô phỏng; chọn mẫu không tạo bằng chứng hoặc kết luận phù hợp.</p><label>Lọc ngành<select id="sector"><option value="">Tất cả</option>${sectors.map((s,i)=>`<option value="${i}" ${filter===String(i)?'selected':''}>${s[0]}</option>`).join('')}</select></label><div class="grid">${sectors.map((s,i)=>filter!==''&&filter!==String(i)?'':`<article><span class="tag">${s[0]}</span><h3>${s[1]}</h3><p><b>VBF:</b> ${s[2]}</p><p><b>S:</b> ${s[3]} · ${s[4]}</p><p><b>C:</b> ${s[5]} · <b>P:</b> ${s[6]}</p><p><b>Cần kiểm tra:</b> ${s[7]}</p><button data-example="${i}">Dùng làm giả thuyết</button></article>`).join('')}</div>`}
function vbfEditor(d){return `<article id="vbf"><h2>Nền V-RIM</h2><p>Nhập bản sao VBF hoặc thêm thủ công. Không đồng bộ ngược sang V-RIM.</p><button data-action="rim">Nhập JSON V-RIM</button><form id="vbfForm"><label>Loại<select name="type"><option>V</option><option>B</option><option>F</option></select></label><label>Nội dung<input name="text" required maxlength="3000"></label><button>Thêm VBF</button></form>${state.vbf.map(v=>`<label class="check"><input type="checkbox" data-link="${esc(v.id)}" ${d.vbf.includes(v.id)?'checked':''}> ${v.type} · ${esc(v.text)}</label>`).join('')}</article>`}
function practise(){const d=cur();return `<h1>Thực hành thiết kế M-RIM</h1>${selectors()}${!d?'<article>Tạo một phương án hoặc chọn ví dụ trong Paradigm.</article>':`${wheels(d)}<article>${field('Tên phương án SCP','d.name',d.name,'text')}<button data-action="delete" class="danger">Xóa phương án…</button></article>${vbfEditor(d)}<div class="row">${['S','C','P','Kiểm tra'].map(k=>`<button data-focus="${k}" class="${focus===k?'active':''}">${k}</button>`).join('')}</div><br>${focus==='S'?segment(d):focus==='C'?channel(d):focus==='P'?partners(d):constraints(d)}<article><h2>Cảnh báo và hướng hiệu chỉnh</h2><div id="warnings">${warnings(d)}</div></article>`}`}
function segment(d){const s=d.segment;return `<article><h2>S · UC – Address – Area</h2><label>Nhóm địa chỉ<select data-selectfield="segment.address">${opts(addr,s.address)}</select></label><div class="grid"><div><label>Cấp địa bàn<select data-selectfield="segment.level">${opts(levels,s.level)}</select></label>${field('Tên địa bàn / đơn vị hành chính tương ứng','d.segment.area',s.area,'text')}${field('Quốc gia / quy ước địa bàn','d.segment.country',s.country,'text')}</div><div><p>Thiết kế một cấu hình theo một nhóm địa chỉ và phạm vi địa bàn. Tạo phương án khác nếu UC, kênh hoặc điều kiện phục vụ khác nhau.</p><p>AP chỉ địa điểm công cộng; không tự suy ra người chi trả hoặc quyền mua. AR là khách hàng mua để bán lại.</p></div></div>${fields.segment.map(([k,l])=>field(l,'d.segment.'+k,s[k])).join('')}</article>`}
function channel(d){const c=d.channel;return `<article><h2>C · Cách tiếp cận và phục vụ</h2>${Object.entries(channels).map(([k,l])=>`<label class="check"><input type="checkbox" data-channel="${k}" ${c.types.includes(k)?'checked':''}> ${l}</label>`).join('')}<label>Nếu Offline<select data-selectfield="channel.offline">${opts({store:'Khách đến cửa hàng / điểm bán',onsite:'Doanh nghiệp đến địa chỉ khách',both:'Kết hợp cả hai'},c.offline)}</select></label>${fields.channel.map(([k,l])=>field(l,'d.channel.'+k,c[k])).join('')}</article>`}
function partners(d){return `<article><h2>P · Bên đồng hành</h2><p>Chỉ mua để bán lại không phải vai trò Partner. Có thể tự phục vụ; ghi rõ lý do nếu chưa cần Partner.</p>${field('Lý do không dùng Partner hoặc phần doanh nghiệp tự thực hiện','d.partnerReason',d.partnerReason)}${d.partners.map((p,i)=>`<fieldset><label>Nhóm gợi mở<select data-partner="${i}:type">${opts(Object.fromEntries(['KOL','KOC','Logistics','Đơn vị truyền thông','Đơn vị liên kết','Khác'].map(x=>[x,x])),p.type)}</select></label><label>Vai trò trong phương án<select data-partner="${i}:role">${opts({partner:'Đồng hành đưa sản phẩm/dịch vụ đến khách',buyer:'Chỉ mua để bán lại — thuộc AR',both:'Có hai vai trò; tách phần đồng hành'},p.role)}</select></label>${fields.partner.map(([k,l])=>field(l,`p.${i}.${k}`,p[k])).join('')}<button data-remove="${i}">Xóa bên này…</button></fieldset>`).join('')}<button data-action="partner">＋ Partner</button></article>`}
function constraints(d){const c=d.constraints;return `<article><h2>Đối chiếu điều kiện định lượng</h2><p>Chỉ so sánh số liệu cùng phạm vi. Để trống khi chưa biết, không điền 0 thay dữ liệu thiếu. Mức số liệu do học viên khai báo, chưa được xác minh.</p><div class="grid"><div>${field('Khách chấp nhận tối đa bao nhiêu giờ từ đặt đến nhận?','d.constraints.needHours',c.needHours,'number')}${field('Thời gian dự kiến phục vụ trong cùng phạm vi (giờ)','d.constraints.serveHours',c.serveHours,'number')}</div><div>${field('Số lượng dự kiến phục vụ','d.constraints.targetUnits',c.targetUnits,'number')}${field('Năng lực phục vụ cùng kỳ','d.constraints.capacityUnits',c.capacityUnits,'number')}${field('Đơn vị chung: suất, đơn, sản phẩm…','d.constraints.unit',c.unit,'text')}${field('Kỳ chung: ngày, tuần, tháng…','d.constraints.period',c.period,'text')}</div></div></article>`}
function warnings(d){const a=audit(d);return a.map(x=>`<div class="warn ${x.type==='conflict'?'conflict':''}"><b>${{missing:'Thiếu dữ kiện',risk:'Cần kiểm chứng',conflict:'Mâu thuẫn dữ kiện khai báo'}[x.type]}:</b> ${esc(x.msg)}</div>`).join('')||'<p>Chưa phát hiện lỗi trong các quy tắc hiện có. Không phải xác nhận SCP phù hợp hay thị trường sẽ mua.</p>'}
function lens(){return `<h1>Lăng kính học viên</h1><article>${wb('Tôi thấy lựa chọn SCP nào cần xem lại?','self')}${wb('Phản biện từ học viên khác','peer')}${wb('Điều còn bất đồng, bằng chứng cần thu','uncertain')}</article>${state.designs.map(d=>`<article><h2>${esc(d.name||'Phương án chưa tên')}</h2>${warnings(d)}</article>`).join('')}<article><h2>Câu hỏi đối chiếu hai mâm</h2><ul><li>VBF đang đáp ứng NAP của ai? CAP có căn cứ chưa?</li><li>Người dùng khác người quyết định ở đâu?</li><li>Kênh có thực hiện được lợi ích hay chỉ tạo nhận biết?</li><li>Partner có năng lực đúng địa bàn và vai trò rõ không?</li><li>Đổi UC/Area có buộc đổi kênh hoặc Partner không?</li></ul></article>`}
function improve(){const d=cur();return `<h1>Cải tiến MyBizCar</h1>${selectors()}${d?`<article><p>Phản biện: ${esc(state.workbook.peer||'Chưa ghi nhận')}</p>${warnings(d)}${field('Điều chỉnh trước → sau; sửa VBF hay SCP; kiểm chứng bằng cách nào?','d.improve',d.improve)}${field('Người phụ trách','d.owner',d.owner,'text')}${field('Thời hạn','d.due',d.due,'date')}<button data-tab="practise">Hiệu chỉnh bản thiết kế</button></article>`:'<article>Chưa có phương án.</article>'}`}
function extract(){return `<h1>Rút ra bài học mang theo</h1><article>${wb('Bài học về khớp VBF và SCP','lesson')}${wb('Áp dụng tại bộ phận / dòng sản phẩm nào?','apply')}</article>`}
function resolve(){return `<h1>Cam kết hành động</h1><article>${wb('Hành động khảo sát / thử nghiệm ưu tiên','action')}${wb('Người phụ trách và phối hợp','owner')}${field('Thời hạn','workbook.due',state.workbook.due,'date')}${wb('Bằng chứng, tiêu chí xem xét và điều kiện đổi lựa chọn','proof')}<p>Xuất hồ sơ để mang theo. Không tự động nhắc lịch hay theo dõi thị trường.</p></article>`}
function render(){const i=steps.findIndex(s=>s[0]===tab);$('nav').innerHTML=steps.map(([k,l,en,vi])=>`<button data-tab="${k}" class="${tab===k?'active':''}"><b>${l} · ${en}</b><small>${vi}</small></button>`).join('');$('main').innerHTML=({activate,paradigm,practise,lens,improve,extract,resolve}[tab])()+`<footer class="row">${i?`<button data-tab="${steps[i-1][0]}">← ${steps[i-1][2]}</button>`:''}<small>APPLIER ${i+1}/7 · Lưu cục bộ, xuất JSON thường xuyên</small>${i<6?`<button data-tab="${steps[i+1][0]}">${steps[i+1][2]} →</button>`:''}</footer>`;bind()}
function update(path,v){let p=path.split('.'),o=state;if(p[0]==='d'){o=cur();p.shift()}else if(p[0]==='p'){p.shift();o=cur().partners[+p.shift()]}while(p.length>1)o=o[p.shift()];o[p[0]]=v;save()}
function bind(){document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=e.dataset.tab;render()});document.querySelectorAll('[data-field]').forEach(e=>e.oninput=()=>{if(e.type==='number'&&e.value!==''&&(+e.value<0||!Number.isFinite(+e.value))){e.setCustomValidity('Nhập số không âm');return}e.setCustomValidity('');update(e.dataset.field,e.value);if($('#warnings'))$('#warnings').innerHTML=warnings(cur())});document.querySelectorAll('[data-select]').forEach(e=>e.onclick=()=>{selected=e.dataset.select;render()});document.querySelectorAll('[data-focus]').forEach(e=>e.onclick=()=>{focus=e.dataset.focus;render()});document.querySelectorAll('[data-wheel]').forEach(e=>{const fn=()=>{const k=e.dataset.wheel;if(!cur()){notice('Tạo phương án SCP trước để nối hai mâm.');return}tab='practise';if(['S','C','P'].includes(k))focus=k;render();if(['V','B','F'].includes(k))$('#vbf').scrollIntoView({behavior:'smooth'})};e.onclick=fn;e.onkeydown=x=>{if(x.key==='Enter'||x.key===' '){x.preventDefault();fn()}}});document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>action(e.dataset.action));document.querySelectorAll('[data-selectfield]').forEach(e=>e.onchange=()=>{update('d.'+e.dataset.selectfield,e.value);render()});document.querySelectorAll('[data-partner]').forEach(e=>e.onchange=()=>{const [i,k]=e.dataset.partner.split(':');cur().partners[+i][k]=e.value;save();render()});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{if(confirm('Xóa bên này? Khôi phục bằng JSON đã xuất.')){cur().partners.splice(+e.dataset.remove,1);save();render()}});document.querySelectorAll('[data-link]').forEach(e=>e.onchange=()=>{cur().vbf=e.checked?[...new Set([...cur().vbf,e.dataset.link])]:cur().vbf.filter(x=>x!==e.dataset.link);save();render()});document.querySelectorAll('[data-channel]').forEach(e=>e.onchange=()=>{cur().channel.types=e.checked?[...new Set([...cur().channel.types,e.dataset.channel])]:cur().channel.types.filter(x=>x!==e.dataset.channel);save();render()});document.querySelectorAll('[data-example]').forEach(e=>e.onclick=()=>{const s=sectors[+e.dataset.example],d=design();d.name=s[1];d.segment.address=s[3];d.segment.uc=s[4];d.channel.types=[s[5]];d.partners=[{...item('partner'),type:s[6],role:'partner'}];d.segment.fit='Giả thuyết cần kiểm chứng: '+s[7];const parts=s[2].split(' → ');for(const [i,type]of ['F','B','V'].entries()){const v={id:uid(),type,text:parts[i]};state.vbf.push(v);d.vbf.push(v.id)}state.designs.push(d);selected=d.id;tab='practise';save();render()});if($('#sector'))$('#sector').onchange=e=>{filter=e.target.value;render()};if($('#vbfForm'))$('#vbfForm').onsubmit=e=>{e.preventDefault();const v={id:uid(),...Object.fromEntries(new FormData(e.target))};state.vbf.push(v);cur().vbf.push(v.id);save();render()}}
function action(a){if(a==='add'){const d=design();state.designs.push(d);selected=d.id}else if(a==='delete'){if(!confirm('Xóa phương án SCP? Chỉ khôi phục được từ JSON đã xuất.'))return;state.designs=state.designs.filter(d=>d!==cur());selected=''}else if(a==='partner')cur().partners.push({...item('partner'),type:'',role:'partner'});else if(a==='rim'){mode='rim';$('#file').click();return}save();render()}
$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='M-RIM-ho-so.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#import').onclick=()=>{mode='own';$('#file').click()};$('#file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>5e6)throw Error('Tối đa 5 MB');const s=JSON.parse(await f.text());if(mode==='own'){validate(s);if(!confirm('Thay hồ sơ hiện tại? Hãy xuất JSON dự phòng trước.'))return;state=s;selected=''}else{if(!Array.isArray(s.nodes)||s.nodes.length>2000)throw Error('Cần JSON V-RIM có nodes');const list=s.nodes.map(v=>{if(typeof v.id!=='string'||!['V','B','F'].includes(v.type)||typeof v.text!=='string'||v.text.length>30000)throw Error('VBF không hợp lệ');return {id:'rim-'+v.id,type:v.type,text:v.text}});for(const v of list)if(!state.vbf.some(x=>x.id===v.id))state.vbf.push(v)}save();render();notice('Đã nhập bản sao. Không đồng bộ tự động.')}catch(err){notice('Không nhập: '+err.message)}finally{e.target.value=''}};
$('#print').onclick=()=>{const w=window.open('','_blank');if(!w){notice('Cho phép cửa sổ bật lên để in.');return}const rows=o=>Object.entries(o).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(Array.isArray(v)?v.join(', '):v)}</p>`).join('');w.document.write('<!doctype html><meta charset="utf-8"><title>M-RIM Hồ sơ</title><style>body{font:15px/1.6 system-ui;margin:35px}article{break-before:page}p{overflow-wrap:anywhere}</style><h1>M-RIM · SCP · MyBizCar</h1><p>'+esc(state.company)+' · '+esc(state.product)+'</p><h2>APPLIER</h2>'+rows(state.workbook)+state.designs.map(d=>`<article><h2>${esc(d.name)}</h2><h3>VBF</h3>${state.vbf.filter(v=>d.vbf.includes(v.id)).map(v=>`<p>${v.type}: ${esc(v.text)}</p>`).join('')}<h3>S</h3>${rows(d.segment)}<h3>C</h3>${rows(d.channel)}<h3>P</h3>${d.partners.map(p=>rows(p)).join('<hr>')}<p>${esc(d.partnerReason)}</p><h3>Điều kiện</h3>${rows(d.constraints)}<h3>Cảnh báo</h3>${audit(d).map(a=>`<p>${esc(a.msg)}</p>`).join('')}<h3>Cải tiến</h3><p>${esc(d.improve)} · ${esc(d.owner)} · ${esc(d.due)}</p></article>`).join(''));w.document.close();w.focus();w.print()};render();
</script></body></html>

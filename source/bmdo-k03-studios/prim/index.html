<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P-RIM • COD • MyBizCar</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4ec;color:#173d3d;font:16px/1.6 system-ui}header{background:#173d3d;color:white;padding:18px 4%;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header span{flex:1}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;color:#173d3d;border:1px solid #bdcdc7;border-radius:10px;padding:9px 14px}button:hover,button.active{background:#d5ecdd}nav{display:flex;gap:8px;padding:16px 4%;flex-wrap:wrap;border-bottom:1px solid #d4ddd4}nav button{flex:1;min-width:140px;text-align:left}nav small{display:block;font-size:12px}main{max-width:1400px;margin:auto;padding:28px}h1{font-size:38px;line-height:1.2}h2{font-size:24px}article,.card{background:white;border:1px solid #d9dfd4;border-radius:18px;padding:24px;margin-bottom:20px;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}.wheels{display:grid;grid-template-columns:1fr 1fr;gap:22px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:block;font-weight:600;margin:12px 0}input:not([type=checkbox]),textarea,select{width:100%;padding:10px;border:1px solid #b6c9c2;border-radius:8px;color:inherit;background:#fcfdf8}textarea{min-height:85px;resize:vertical}small,.muted{font-size:13px;color:#5b7270}.tag{font-size:13px;background:#e6eee3;padding:4px 9px;border-radius:15px}.warn{padding:12px;background:#fff2d9;border-left:4px solid #c9922e;margin:9px 0}.conflict{background:#ffebe3;border-left-color:#bd5745}.wheel{width:100%;height:280px}.wheel [role=button]{cursor:pointer}.wheel [role=button]:focus{outline:none;stroke:#d18d26;stroke-width:4}fieldset{border:1px solid #d8e1d6;border-radius:12px;margin:18px 0;padding:18px;min-width:0}summary{cursor:pointer;font-weight:bold}details{margin:14px 0}table{width:100%;border-collapse </style><body><header><strong>MYBIZCAR / P-RIM</strong><span>Mâm nhân lực · CORE / OPEN / DIGITAL</span><button id="export">Xuất JSON</button><button id="import">Nhập JSON</button><button id="report">Phiếu hoạch định</button><input id="file" type="file" accept=".json" hidden></header><nav id="nav"></nav><main id="main"></main><footer style="padding:24px">The BizCar — Nguyễn Chí Thành · P-RIM Studio 1.0 · Công cụ học tập và hoạch định thử nghiệm, không tự chứng nhận năng lực. Lưu cục bộ; hãy xuất JSON để sao lưu.</footer><script>'use strict';
const KEY='mybizcar-prim-v1',tabs=['Activate|Cùng khởi động','Paradigm|Mô thức thực chiến','Practise|Thực hành thiết kế','Lens|Lăng kính học viên','Improve|Cải tiến MyBizCar','Extract|Rút ra bài học mang theo','Resolve|Cam kết hành động'],names={C:'Core · Nhân lực lõi',O:'Open · Nhân lực mở',D:'Digital · Nhân lực số'},colors={C:'#1d716b',O:'#d99531',D:'#6278bb'},phases=['Khám phá / kiểm chứng','Vận hành lặp lại','Tăng trưởng','Mở rộng nhiều đơn vị','Củng cố / tái cấu trúc'],statuses=['Mới dự kiến','Đang phát triển','Đã cam kết huy động','Sẵn dùng — đã kiểm chứng'],openTypes=['Cộng tác viên theo việc / dự án','Chuyên gia / cố vấn / người hướng dẫn','Quản lý / chuyên môn theo phần thời gian','Đội ngũ dịch vụ thuê ngoài','Đội nhận khoán / thầu phụ / gia công','Nhân lực đơn vị liên kết / trường–viện','Mạng lưới đồng sáng tạo','Khác — ghi rõ'];
const sectors=[
['Thực phẩm','Xử lý đơn bánh mì que',300,4,'đơn/ngày','D tiếp nhận thông tin; C chốt ngoại lệ; O hỗ trợ cao điểm','Chất lượng đầu vào và quyền chốt đơn phải rõ','Sự cố nhận đơn số trước giờ nghỉ văn phòng'],
['Bán lẻ / phân phối','Kiểm tra đơn hàng AR',180,5,'đơn/ngày','C quản lý công nợ; O bổ sung kiểm kê; D đối chiếu dữ liệu','AR mua để bán lại là khách hàng, không tự coi là nhân lực O','Cùng một cộng tác viên được tính ở hai cửa hàng'],
['Sản xuất công nghiệp','Kiểm tra lô linh kiện',40,18,'lô/tuần','C giữ tiêu chuẩn và trách nhiệm; O hiệu chuẩn; D thu dữ liệu','Phút máy không thay thời gian người kiểm tra','Thiếu người đủ năng lực xác nhận kết quả'],
['Bê tông / vật liệu','Chuẩn bị hồ sơ giao cấu kiện',60,12,'bộ/ngày','C xác nhận kỹ thuật; O hỗ trợ lập hồ sơ; D tổng hợp chứng từ','Không giao quyền phê duyệt kỹ thuật cho D chưa được kiểm soát','Đội giao hàng và kiểm tra lệch lịch'],
['Xây dựng / dự án','Nghiệm thu hạng mục',25,45,'hạng mục/tuần','C chịu trách nhiệm; O bổ sung đội chuyên môn; D quản lý hồ sơ','Không cộng công suất các công đoạn nối tiếp','Thầu phụ không huy động đúng tiến độ'],
['Logistics','Điều phối chuyến giao',160,6,'chuyến/ngày','C xử lý ngoại lệ; O bổ sung tài xế; D hỗ trợ phân tuyến','Phải xét khung giờ, tải tuyến và điều kiện giao','Đối tác không có xe đúng giờ cao điểm'],
['Phần mềm / thuê bao','Xử lý yêu cầu hỗ trợ',240,8,'yêu cầu/ngày','D hỗ trợ câu hỏi chuẩn; C xử lý lỗi; O bổ sung chuyên môn','Khách đánh giá câu trả lời hay không chứng minh đã xử lý lỗi','D đề xuất sai và thiếu tuyến chuyển cho người'],
['Thương mại điện tử','Kiểm tra đơn hoàn trả',120,7,'đơn/ngày','C chốt trường hợp tranh chấp; O xử lý khối lượng; D phân loại','Quyền truy cập dữ liệu khách phải theo nhiệm vụ','D hoặc O thay đổi trạng thái nhưng C chưa được báo'],
['Đào tạo / BMDO','Phản hồi bài thực hành CEO',80,15,'bài/khóa','C giữ chuẩn chuyên môn; O trợ giảng; D tổng hợp và gợi ý','Phản hồi D cần người kiểm tra; không tự xác nhận học viên đạt','Giảng viên vắng, không có người thay đúng chuyên môn'],
['Du lịch / lưu trú','Chuẩn bị phòng trước nhận khách',50,30,'phòng/ngày','C điều phối; O bổ sung tổ phục vụ; D cập nhật trạng thái','Phải xét giờ trả và nhận phòng, không chỉ tổng giờ/ngày','Thiếu đội phục vụ trong hai giờ cao điểm'],
['Dịch vụ sức khỏe','Sắp lịch và chuẩn bị hồ sơ',100,6,'hồ sơ/ngày','D hỗ trợ lịch; C kiểm tra; O bổ sung công việc phù hợp','Bài tập chỉ về hành chính, không thay đánh giá chuyên môn y tế','Nhầm thông tin và không có người xác minh'],
['Chuyên môn B2B','Chuẩn bị hồ sơ tư vấn',30,40,'hồ sơ/tuần','C phán đoán và chịu trách nhiệm; O chuyên gia; D tổng hợp','Phải kiểm chứng nguồn và bảo vệ thông tin khách','Chuyên gia chủ chốt dừng hợp tác, thiếu bàn giao']];
const blank=x=>x===undefined||x===null||String(x).trim()==='',number=x=>blank(x)?null:Number(x),fmt=x=>x===null||!Number.isFinite(x)?'—':Number(x.toFixed(2)).toLocaleString('vi-VN'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID(),$=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)],formData=f=>Object.fromEntries(new FormData(f)),fresh=()=>({kind:'prim',version:1,profiles:[],notes:{}});let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()}let current=state.profiles[0]?.id||'',tab=0,editor='',editId='';
const profile=()=>state.profiles.find(p=>p.id===current),plan=()=>profile()?.plans.find(p=>p.id===profile().activePlan),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Không lưu được tại trình duyệt. Hãy xuất JSON để sao lưu.')}},field=(n,l,v='',type='text',req=false)=>`<label>${l}<input name="${n}" type="${type}" value="${esc(v)}" ${type==='number'?'step="any"':''} ${req?'required':''}></label>`,area=(n,l,v='',req=false)=>`<label>${l}<textarea name="${n}" ${req?'required':''}>${esc(v)}</textarea></label>`,select=(n,l,items,v='')=>`<label>${l}<select name="${n}">${items.map(a=>`<option ${a===v?'selected':''}>${esc(a)}</option>`).join('')}</select></label>`;
function newPlan(name){return {id:uid(),name,resources:[],tasks:[],actions:[],history:[],decisions:[],changedAt:new Date().toISOString()}}
function change(reason){plan().changedAt=new Date().toISOString();plan().history.push({at:plan().changedAt,reason});save()}
function ready(r){return r.status==='Sẵn dùng — đã kiểm chứng'&&!!r.evidence?.trim()&&!!r.evidenceDate}
function taskLoad(t,multiplier=1){const v=number(t.volume),m=number(t.minutes),f=number(t.fixedMinutes);return v===null||m===null||f===null?null:v*multiplier*m+f}
function analyze(pl=plan(),multiplier=1){if(!pl)return {rows:[],alerts:[],cost:null,verifiedCost:null};const alerts=[];const add=(severity,text)=>alerts.push({severity,text});if(!pl.tasks.length)add('unknown','Chưa có công việc để đánh giá công suất.');if(!pl.resources.length)add('unknown','Chưa có nguồn lực COD.');
for(const t of pl.tasks){const r=pl.resources.find(r=>r.id===t.resource);if(!r)add('block',`${t.name}: chưa gán nguồn lực thực hiện.`);if(!t.owner?.trim())add('block',`${t.name}: chưa rõ người chịu trách nhiệm cuối cùng.`);if(!t.standard?.trim())add('unknown',`${t.name}: chưa có chuẩn đầu ra.`);if(t.gate==='Chưa đạt')add('block',`${t.name}: điều kiện bắt buộc chưa đạt.`);if(t.gate==='Chưa kiểm chứng')add('unknown',`${t.name}: điều kiện bắt buộc chưa được kiểm chứng.`);if(taskLoad(t,multiplier)===null)add('unknown',`${t.name}: thiếu khối lượng hoặc thời gian, chưa tính được tải.`);if(t.loadBasis!=='Đã đo kiểm chứng')add('unknown',`${t.name}: tải công việc đang là giả định, không phải định mức đã xác nhận.`);if(r?.type==='D'&&(!t.humanReview?.trim()||!t.fallback?.trim()))add('block',`${t.name}: D cần cơ chế giám sát/chuyển người và dự phòng.`);if(t.critical==='Có'&&!t.fallback?.trim())add('warn',`${t.name}: công việc trọng yếu chưa có phương án thay thế.`);if(!t.handoff?.trim())add('warn',`${t.name}: chưa ghi đầu vào, bàn giao và điểm nhận việc.`);}
const rows=pl.resources.map(r=>{const assigned=pl.tasks.filter(t=>t.resource===r.id),loads=assigned.map(t=>taskLoad(t,multiplier)),unknown=loads.some(v=>v===null),load=loads.reduce((a,b)=>a+(b??0),0),cap=number(r.capacity),util=cap!==null&&cap>0&&!unknown?load/cap*100:null,gap=cap===null||unknown?null:Math.max(0,load-cap);if(assigned.length&&!ready(r))add('unknown',`${r.name}: có việc được giao nhưng chưa phải năng lực sẵn dùng đã kiểm chứng.`);if(cap===null)add('unknown',`${r.name}: chưa có ngân sách thời gian khả dụng trong kỳ.`);if(gap>0)add('block',`${r.name}: vượt ${fmt(gap)} phút khả dụng trong kỳ.`);if(r.type==='O'&&(!r.agreement?.trim()||!r.availability?.trim()))add('warn',`${r.name}: O thiếu thỏa thuận hợp tác hoặc lịch huy động.`);if(r.type==='D'&&!r.boundaries?.trim())add('block',`${r.name}: D chưa có giới hạn quyền và nhiệm vụ.`);if(!r.backup?.trim())add('warn',`${r.name}: chưa ghi phụ thuộc và phương án thay thế.`);return {r,assigned:assigned.length,load,unknown,cap,util,gap}});
const codes=pl.resources.map(r=>(r.externalId||'').trim()).filter(Boolean);if(new Set(codes).size!==codes.length)add('block','Trùng mã nguồn lực trong cùng phương án: có nguy cơ tính công suất và chi phí hai lần.');const costs=pl.resources.map(r=>number(r.cost));const cost=!costs.length||costs.some(x=>x===null)?null:costs.reduce((a,b)=>a+b,0);const setups=pl.resources.map(r=>number(r.setupCost));return {rows,alerts,cost,setup:!setups.length||setups.some(x=>x===null)?null:setups.reduce((a,b)=>a+b,0),blocked:alerts.some(a=>a.severity==='block'),unknown:alerts.some(a=>a.severity==='unknown')}}
function conclusion(a){return a.blocked?'Cần xử lý điểm chặn trước khi huy động theo phương án':a.unknown?'Cần kiểm chứng thêm trước khi chốt năng lực sẵn sàng':a.alerts.length?'Có cơ sở thử nghiệm; còn điều kiện phối hợp cần hoàn thiện':'Có cơ sở triển khai trong phạm vi dữ liệu đã kiểm tra'}
function wheel(){const pl=plan();return `<svg class="wheel" viewBox="0 0 500 310" role="img" aria-label="Mâm COD với ba nhóm Core, Open, Digital; kích thước không biểu diễn tỷ lệ nhân lực"><ellipse cx="250" cy="285" rx="150" ry="12" fill="#dae4dc"/><circle cx="250" cy="144" r="117" fill="#eef3ed" stroke="#193f46" stroke-width="25"/>${['C','O','D'].map((c,i)=>{const angle=(i*120-90)*Math.PI/180,x=250+78*Math.cos(angle),y=144+78*Math.sin(angle),rs=pl?.resources.filter(r=>r.type===c)||[];return `<line x1="250" y1="144" x2="${x}" y2="${y}" stroke="${colors[c]}" stroke-width="27"/><circle cx="${x}" cy="${y}" r="37" fill="${colors[c]}"/><text x="${x}" y="${y-3}" text-anchor="middle" fill="white" font-size="23">${c}</text><text x="${x}" y="${y+17}" text-anchor="middle" fill="white" font-size="12">${rs.length} hồ sơ</text>`}).join('')}<circle cx="250" cy="144" r="24" fill="#173d3d"/><text x="250" y="150" text-anchor="middle" fill="white" font-size="12">COD</text></svg><p class="muted">Ba nhánh là ba lực lượng, không phải tỷ lệ tối ưu. Số hồ sơ không phải số người; không cộng phút người với phút máy thành số nhân viên tương đương.</p>`}
function wb(key,label){return `<form class="wb" data-key="${key}">${area('text',label,profile()?.notes[key]||state.notes[key]||'')}<button>Lưu nội dung</button></form>`}
function pickers(){return `<div class="grid"><label>Hồ sơ doanh nghiệp<select id="pick"><option value="">Chọn hồ sơ</option>${state.profiles.map(p=>`<option value="${p.id}" ${p.id===current?'selected':''}>${esc(p.company)} · ${esc(p.goal)}</option>`).join('')}</select></label>${profile()?`<label>Phương án đang thiết kế<select id="planpick">${profile().plans.map(p=>`<option value="${p.id}" ${p.id===profile().activePlan?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>`:''}</div>`}
function render(){ $('#nav').innerHTML=tabs.map((t,i)=>`<button data-tab="${i}" class="${i===tab?'active':''}">${i+1}. ${t.split('|')[0]}<small>${t.split('|')[1]}</small></button>`).join('');$('#main').innerHTML=(state.profiles.length?pickers():'')+[activate,paradigm,practise,lens,improve,extract,resolve][tab]();bind()}
function activate(){return `<div class="wheels"><article><span class="tag">PEOPLE WHEEL / P-RIM</span><h1>Đủ lực thực hiện.<br>Đúng cấu trúc COD.</h1><p>Không chỉ tuyển thêm người: thiết kế công việc, huy động nhân lực mở, triển khai nhân lực số và giữ trách nhiệm rõ ràng.</p><p><b>C:</b> đội ngũ chính thức / nòng cốt.<br><b>O:</b> con người, đội ngũ bên ngoài bổ sung năng lực thực hiện.<br><b>D:</b> hệ thống số được giao nhiệm vụ trong giới hạn có kiểm soát.</p><p>P-RIM thiết kế cấu trúc. Chưa tự định nghĩa P-CASING, P-TREAD, P-AIR.</p></article><article>${wheel()}</article></div><article><h2>Khởi tạo hồ sơ hoạch định</h2><form id="profileform"><div class="grid">${field('company','Doanh nghiệp','','text',true)}${select('sector','Ngành',sectors.map(x=>x[0]).concat('Khác / kết hợp'))}${select('phase','Giai đoạn',phases)}${field('goal','Mục tiêu / phương án VMF cần thực hiện','','text',true)}${field('period','Một kỳ hoạch định thống nhất: 1 ngày / 1 tuần / 1 tháng…','','text',true)}${field('currency','Đơn vị tiền dùng chung','VND','text',true)}</div>${area('context','Sản phẩm, địa bàn, mùa vụ, khung giờ cao điểm, yêu cầu chuyên môn')}${area('digital','Sẵn sàng số: quy trình, dữ liệu, kiểm tra đầu ra, người giám sát')}${area('vmf','Tham chiếu hồ sơ VMF / giới hạn tăng tốc (không tự đồng bộ)')}<button>Tạo hồ sơ và phương án hiện tại</button></form></article><article>${wb('activate','Đang thiếu người, thiếu năng lực hay thiếu cách tổ chức công việc?')}</article>`}
function caseHTML(x){const total=x[2]*x[3];return `<h3>1. Thiếu năng lực — tính đúng nhu cầu</h3><p>${x[2]} ${esc(x[4])}, mỗi việc ${x[3]} phút: ${fmt(total)} phút/kỳ. Chưa tính thời gian kiểm tra, sửa lỗi và điều phối. Chia nhu cầu theo công đoạn trước khi quyết định tuyển.</p><p><b>Phương án:</b> ${esc(x[5])}. <b>Kiểm chứng:</b> ${esc(x[6])}.</p><h3>2. Tăng trưởng — kiểm tra công suất</h3><p>Nhu cầu tăng 50%: tải trực tiếp là ${fmt(total*1.5)} phút/kỳ, nếu định mức và cơ cấu việc không đổi. Nguồn lực chỉ có ${fmt(total*1.2)} phút khả dụng thì thiếu ${fmt(total*.3)} phút. Không mặc định mua D hay gọi O sẽ lấp được ngay khoảng thiếu.</p><h3>3. Phối hợp — có đủ nguồn vẫn có thể lỗi</h3><p>${esc(x[7])}. Phải xác định bên bàn giao, bên nhận, thời điểm, chuẩn đầu ra và người xử lý ngoại lệ. Tạo riêng công việc kiểm tra/điều phối; không coi đây là thời gian miễn phí.</p><h3>4. Gián đoạn — thử phương án dự phòng</h3><p>Giả sử nguồn trọng yếu ngừng hoạt động một kỳ. Tạm đặt phút khả dụng của nguồn đó bằng 0 trong bản sao phương án. Rà công việc bị ảnh hưởng, năng lực thay thế đã kiểm chứng và giới hạn phục vụ. Không chuyển việc sang O/D chưa sẵn sàng chỉ để dashboard hết đỏ.</p>`}
function paradigm(){return `<h1>Mô thức thực chiến COD</h1><article><h2>Hoạch định theo kết quả, không theo trào lưu</h2><p>Mục tiêu → công việc → năng lực/công suất → lựa chọn C/O/D → trách nhiệm/bàn giao → chi phí → kiểm chứng → điều chỉnh.</p><p><b>Ba lớp dữ liệu:</b> ví dụ giả định; dữ kiện doanh nghiệp; giả định phương án tương lai. Không trộn chúng.</p><p><b>Năm giai đoạn:</b> khám phá → vận hành lặp lại → tăng trưởng → mở rộng → củng cố. Mỗi sản phẩm có thể ở giai đoạn khác. Không có tỷ lệ C/O/D mặc định cho mọi doanh nghiệp.</p></article><div class="grid">${Object.entries(names).map(([c,n])=>`<article><h2>${n}</h2><p>${{C:'Giữ năng lực, tri thức và trách nhiệm liên tục. Hoạch định tuyển, đào tạo, kế nhiệm; không mặc định chính thức là đủ năng lực.',O:'Huy động chuyên môn và công suất qua hợp tác rõ ràng. Nguồn có trong danh bạ chưa phải năng lực sẵn dùng.',D:'Giao nhiệm vụ có đầu vào, đầu ra, quyền hạn, giám sát và tuyến chuyển người. Có phần mềm chưa có nghĩa là có năng lực đã kiểm chứng.'}[c]}</p></article>`).join('')}</div><article><h2>Nhân lực mở: lựa chọn và hợp tác</h2><p>${openTypes.map(x=>esc(x)).join(' · ')}</p><p><b>8 tiêu chuẩn:</b> chuyên môn; khả năng huy động; hiểu bối cảnh; phối hợp; chính trực/trách nhiệm; bảo vệ thông tin; hiệu quả kinh tế; chuyển giao và tính liên tục.</p><p><b>Chính sách:</b> thử hợp tác có phạm vi; giao việc/ủy quyền; hội nhập; thù lao/thanh toán; phản hồi/ghi nhận; nghiệm thu/sửa lỗi; dữ liệu/sản phẩm bàn giao; kết thúc/thu hồi quyền.</p><p><b>O ở P-RIM:</b> bổ sung năng lực thực hiện. <b>P ở M-RIM:</b> đồng hành đưa giá trị tới thị trường. Một chủ thể có thể có hai vai trò; tách phạm vi và không cộng trùng chi phí. AR mua để bán lại vẫn là khách hàng. COD không thay việc xác định quan hệ và nghĩa vụ pháp lý thực tế.</p><p>Nguồn quen thuộc: người cũ, bạn nghề, chuyên gia nghỉ hưu, trường–viện, hiệp hội, giới thiệu tín nhiệm. Quan hệ không thay kiểm chứng; tôn trọng, rõ việc, công bằng lợi ích, không mặc định làm miễn phí.</p></article><article><h2>Đo và tính đúng</h2><p><b>Tải công việc = khối lượng × phút/đơn vị + phút cố định trong kỳ.</b> Phút cố định có thể là điều phối, kiểm tra theo lô. Nếu kiểm tra trên từng đơn, tạo dòng công việc riêng hoặc đưa vào định mức có giải thích, tránh tính hai lần.</p><p><b>Mức sử dụng nguồn = tổng tải được giao / phút khả dụng của nguồn.</b> Chỉ tính khi dữ liệu đầy đủ và phút khả dụng > 0. Phút khả dụng là thời gian hữu dụng dành riêng cho phạm vi này, đã trừ công việc ngoài phạm vi và thời gian không sẵn sàng.</p><p>Đối với D: chỉ dùng phút xử lý và năng lực đồng thời đã kiểm chứng. Không suy 24/7 hoặc nhân số phiên tùy ý. Với nhóm O/C: tránh cộng thời gian những người không thể thay thế nhau; tách nguồn chuyên môn.</p><p>Không cộng công suất công đoạn nối tiếp. Phần mềm kiểm tra tải từng nguồn; chưa tự mô phỏng lịch theo giờ hoặc chuỗi công đoạn. Dồn tải cao điểm cần kiểm tra riêng.</p><p><b>Chi phí:</b> chi phí từng nguồn trong kỳ + chi phí triển khai một lần được trình bày riêng. Ghi rõ bao gồm gì, không tính cùng khoản hai lần. Chưa có dữ kiện thì chưa có tổng đầy đủ.</p></article><h2>12 ngành × 4 tình huống</h2><p>Tất cả số liệu là minh họa giả định. Mẫu bối cảnh không tự tạo nguồn lực hoặc công suất trong hồ sơ thật.</p>${sectors.map((x,i)=>`<article><details><summary>${i+1}. ${x[0]} · ${x[1]}</summary>${caseHTML(x)}<button data-example="${i}">Dùng bối cảnh này</button></details></article>`).join('')}<article><h2>Trường hợp tổng hợp — bánh mì que</h2><p>300 đơn × 4 phút = 1.200 phút thủ công/ngày. Thử D: 210 đơn thường × 1 phút kiểm tra + 90 ngoại lệ × 5 phút + 60 phút giám sát = 720 phút công việc C. Giảm 480 phút không đồng nghĩa giảm một nhân viên.</p><p>Phải nhập thêm tải của D, chi phí, sửa lỗi và khung giờ. 90 ngoại lệ không được vừa tính trong 210 đơn thường vừa tính riêng. Một người làm cả kiểm tra và ngoại lệ phải dùng chung mã nguồn lực để thấy tổng tải.</p></article>`}
function resourceForm(r={}){return `<form id="resourceform"><input name="id" type="hidden" value="${esc(r.id||'')}"><div class="grid">${field('name','Tên nguồn lực / đội / hệ thống',r.name,'text',true)}${field('externalId','Mã duy nhất nhận diện nguồn (không dùng trùng)',r.externalId,'text',true)}${select('type','Thành phần COD',['C','O','D'],r.type)}${select('status','Mức sẵn sàng',statuses,r.status)}${field('capacity','Phút hữu dụng khả dụng trong kỳ',r.capacity,'number')}${field('cost','Tổng chi phí nguồn trong kỳ; nhập 0 nếu có căn cứ',r.cost,'number')}${field('setupCost','Chi phí triển khai một lần',r.setupCost,'number')}${field('owner','Đầu mối con người chịu trách nhiệm nguồn',r.owner,'text',true)}${field('availability','Lịch huy động / khung giờ / thời điểm sẵn sàng',r.availability)}${field('evidenceDate','Ngày kiểm chứng',r.evidenceDate,'date')}${select('openType','Loại O (chỉ áp dụng nếu O)',openTypes,r.openType)}</div>${area('skills','Năng lực, loại nhiệm vụ làm được và giới hạn',r.skills,true)}${area('evidence','Nguồn bằng chứng: kết quả thử, công suất, chất lượng và điều kiện',r.evidence)}${area('costScope','Chi phí bao gồm gì, khoản nào chưa tính, cách tránh trùng',r.costScope)}${area('agreement','Với O: đầu ra, nghiệm thu, lịch, thù lao, thanh toán, dữ liệu, bàn giao',r.agreement)}${area('boundaries','Với D: nhiệm vụ/quyền được phép, điều cấm, ai kiểm tra/chuyển người',r.boundaries)}${area('backup','Phụ thuộc trọng yếu, nguồn thay thế và thời gian phục hồi',r.backup)}${r.id?area('changeReason','Lý do thay đổi, giữ lịch sử','',true):''}<button>Lưu nguồn lực</button> <button type="button" id="close">Đóng</button></form>`}
function taskForm(t={}){return `<form id="taskform"><input name="id" type="hidden" value="${esc(t.id||'')}"><div class="grid">${field('name','Công việc / công đoạn / bước kiểm tra',t.name,'text',true)}${field('output','Đầu ra cần tạo',t.output,'text',true)}${field('volume','Khối lượng trong kỳ',t.volume,'number')}${field('unit','Đơn vị: đơn, lô, báo cáo…',t.unit)}${field('minutes','Phút thực hiện / đơn vị',t.minutes,'number')}${field('fixedMinutes','Phút cố định trong kỳ (nhập 0 nếu không có)',t.fixedMinutes,'number')}${select('loadBasis','Căn cứ định mức',['Giả định cần thử','Đã đo kiểm chứng'],t.loadBasis)}<label>Nguồn thực hiện<select name="resource"><option value="">Chưa phân công</option>${plan().resources.map(r=>`<option value="${r.id}" ${r.id===t.resource?'selected':''}>${esc(r.type+' · '+r.name)}</option>`).join('')}</select></label>${field('owner','Người chịu trách nhiệm cuối cùng (không nhập AI)',t.owner)}${select('critical','Công việc trọng yếu',['Có','Không'],t.critical)}${select('gate','Điều kiện bắt buộc',['Chưa kiểm chứng','Đáp ứng','Chưa đạt','Không áp dụng — có lý do'],t.gate)}</div>${area('standard','Chuẩn đầu ra và cách nghiệm thu',t.standard)}${area('gateBasis','Điều kiện bắt buộc + bằng chứng hoặc lý do không áp dụng',t.gateBasis)}${area('timeEvidence','Cách đo định mức, số quan sát, sửa lỗi đã tính chưa?',t.timeEvidence)}${area('handoff','Đầu vào, bước trước/sau, nhận bàn giao, giờ cao điểm',t.handoff)}${area('humanReview','Cơ chế giám sát, ngoại lệ và chuyển cho người (bắt buộc với D)',t.humanReview)}${area('fallback','Khi nguồn không đáp ứng: ai thay, điều kiện, thời gian',t.fallback)}${t.id?area('changeReason','Lý do thay đổi, giữ lịch sử','',true):''}<button>Lưu công việc</button> <button type="button" id="close">Đóng</button></form>`}
function practise(){if(!plan())return '<article>Tạo hồ sơ tại Activate để bắt đầu.</article>';return `<h1>Thiết kế cấu trúc COD</h1><article><h2>${esc(plan().name)}</h2><p>Kỳ: ${esc(profile().period)} · Tiền: ${esc(profile().currency)} · Giai đoạn: ${esc(profile().phase)}</p><p>Nhập nguồn lực một lần bằng mã duy nhất, rồi gán nhiều công việc để kiểm tra quá tải. Một công việc có C/O/D phối hợp cần tách thành các bước hoặc nhánh có khối lượng rõ.</p><div class="row"><button id="addresource">Thêm nguồn C / O / D</button><button id="addtask">Thêm công việc</button><button id="clone">Sao chép để thử phương án</button><button id="rename">Đổi tên phương án</button></div></article>${editor?`<article id="editor"><h2>${editor==='resource'?'Nguồn lực':'Công việc'}</h2>${editor==='resource'?resourceForm(plan().resources.find(r=>r.id===editId)||{}):taskForm(plan().tasks.find(t=>t.id===editId)||{})}</article>`:''}<div class="grid">${['C','O','D'].map(c=>`<article style="border-top:6px solid ${colors[c]}"><h2>${names[c]}</h2>${plan().resources.filter(r=>r.type===c).map(r=>`<p><b>${esc(r.name)}</b> · ${esc(r.externalId)}<br>${esc(r.status)}<br>${fmt(number(r.capacity))} phút/kỳ · ${fmt(number(r.cost))} ${esc(profile().currency)}/kỳ<br><button data-resource="${r.id}">Sửa / xem</button> <button data-remove-resource="${r.id}">Xóa</button></p>`).join('')||'<p>Chưa có nguồn. Không bắt buộc phải có đủ cả C/O/D.</p>'}</article>`).join('')}</div><article><h2>Bản đồ công việc</h2>${plan().tasks.map(t=>`<div class="criterion-row"><div><b>${esc(t.name)}</b><p>${esc(t.output)} · ${esc(plan().resources.find(r=>r.id===t.resource)?.name||'Chưa phân công')}<br>Tải: ${fmt(taskLoad(t))} phút/kỳ · ${esc(t.loadBasis)}<br>Chịu trách nhiệm: ${esc(t.owner||'Chưa rõ')}</p></div><div><button data-task="${t.id}">Sửa / xem</button> <button data-remove-task="${t.id}">Xóa</button></div></div>`).join('')||'Chưa có công việc.'}</article>`}
function showAlerts(a){return a.alerts.map(x=>`<p class="warn ${x.severity==='block'?'conflict':''}"><b>${{block:'Điểm chặn',unknown:'Chưa đủ căn cứ',warn:'Cần hoàn thiện'}[x.severity]}</b> · ${esc(x.text)}</p>`).join('')||'<p>Không có cảnh báo trong phạm vi quy tắc hiện tại. Không đồng nghĩa cấu trúc đã được chứng nhận tối ưu.</p>'}
function rowsTable(a){return `<div class="tablewrap"><table><thead><tr><th>Nguồn</th><th>Tải đã tính (phút)</th><th>Khả dụng (phút)</th><th>Sử dụng</th><th>Vượt tải (phút)</th><th>Sẵn sàng</th></tr></thead><tbody>${a.rows.map(x=>`<tr><td>${esc(x.r.type+' · '+x.r.name)}</td><td>${fmt(x.load)}${x.unknown?' + phần chưa biết':''}</td><td>${fmt(x.cap)}</td><td>${fmt(x.util)}${x.util===null?'':'%'}</td><td>${fmt(x.gap)}</td><td>${ready(x.r)?'Đã khai báo kiểm chứng':'Chưa xác nhận sẵn dùng'}</td></tr>`).join('')}</tbody></table></div>`}
function lens(){if(!plan())return '<article>Chưa có hồ sơ.</article>';const a=analyze();return `<h1>Lăng kính học viên · Dashboard COD</h1><article><h2>${conclusion(a)}</h2>${wheel()}<p>${esc(profile().goal)} · Kỳ ${esc(profile().period)}</p><p>Đánh giá dựa trên dữ kiện nhập; chưa tự xác minh chứng từ hoặc năng lực. Không dùng tỷ lệ C/O/D để xác nhận phù hợp.</p></article><div class="grid"><article><h2>Công việc</h2><div class="stat">${plan().tasks.length}</div><p>${plan().tasks.filter(t=>!t.owner?.trim()).length} chưa có người chịu trách nhiệm<br>${plan().tasks.filter(t=>!plan().resources.some(r=>r.id===t.resource)).length} chưa phân công</p></article><article><h2>Nguồn sẵn sàng</h2><div class="stat">${plan().resources.filter(ready).length}/${plan().resources.length}</div><p>Số hồ sơ đã khai báo kiểm chứng, không phải số người hoặc phần trăm đủ năng lực.</p></article><article><h2>Chi phí trong kỳ</h2><div class="stat">${fmt(a.cost)}</div><p>${esc(profile().currency)} · triển khai một lần: ${fmt(a.setup)}<br>Chưa đủ dữ liệu thì không hiển thị tổng đầy đủ. Chưa tự kiểm toán phạm vi chi phí.</p></article></div><article><h2>Tải theo từng nguồn</h2>${rowsTable(a)}<p class="muted">Không cộng phút người với phút hệ thống để quy đổi đầu người. Chưa kiểm tra lịch từng giờ; tổng kỳ có thể đủ nhưng giờ cao điểm vẫn thiếu.</p></article><article><h2>Cảnh báo và dữ kiện còn thiếu</h2>${showAlerts(a)}</article><article>${wb('lens','Phản biện: định mức có đúng? đang đếm trùng? thiếu việc kiểm tra? nguồn có thực sự sẵn sàng?')}</article>`}
function improve(){if(!plan())return '<article>Chưa có hồ sơ.</article>';return `<h1>So sánh & cải tiến MyBizCar</h1><article><h2>Các phương án cùng phạm vi và kỳ</h2><p>Phương án thay thế, không phải các bộ phận để cộng tổng nguồn lực. So sánh giá chỉ có ý nghĩa khi cùng khối lượng, chất lượng và phạm vi chi phí.</p><div class="tablewrap"><table><tr><th>Phương án</th><th>C/O/D (hồ sơ)</th><th>Chi phí kỳ</th><th>Triển khai</th><th>Kết luận</th></tr>${profile().plans.map(pl=>{const a=analyze(pl);return `<tr><td>${esc(pl.name)}</td><td>${['C','O','D'].map(c=>pl.resources.filter(r=>r.type===c).length).join(' / ')}</td><td>${fmt(a.cost)}</td><td>${fmt(a.setup)}</td><td>${conclusion(a)}</td></tr>`}).join('')}</table></div></article><article><h2>Thử biến động nhu cầu</h2><p>Nhân khối lượng tất cả công việc trong phương án đang chọn; phút cố định không đổi. Giả định định mức và cơ cấu việc giữ nguyên. Không phải dự báo tự động.</p><label>Hệ số nhu cầu<input id="multiplier" type="number" min="0" step="0.1" value="1.5"></label><button id="simulate">Tính thử, không sửa dữ liệu gốc</button><div id="simulation"></div></article><article><h2>Kế hoạch lấp khoảng thiếu COD</h2><form id="actionform"><div class="grid">${select('type','Hướng hành động',['Phát triển C','Tuyển thêm C','Huy động / phát triển O','Triển khai / cải tiến D','Tổ chức lại và phối hợp COD','Dự phòng / chuyển giao'])}${field('target','Công việc / nguồn / điểm nghẽn','','text',true)}${field('owner','Người chịu trách nhiệm','','text',true)}${field('due','Thời hạn','','date',true)}</div>${area('action','Làm gì, ngân sách và điều kiện sẵn sàng','',true)}${area('test','Đầu ra, phép thử, chuẩn nghiệm thu, giới hạn và mốc đo lại','',true)}<button>Lưu hành động</button></form>${plan().actions.map(a=>`<details><summary>${esc(a.type)} · ${esc(a.target)} · ${esc(a.due)}</summary><p>${esc(a.action)}</p><p>${esc(a.test)}</p><p>Phụ trách: ${esc(a.owner)}</p></details>`).join('')}</article>`}
function extract(){if(!plan())return '<article>Chưa có hồ sơ.</article>';return `<h1>Bài học mang theo</h1><article>${wb('extract','Điều gì trước đây tưởng là thiếu người nhưng thực ra là thiếu năng lực, cấu trúc hoặc phối hợp?')}</article><article><h2>Lịch sử thay đổi phương án</h2>${plan().history.slice().reverse().map(h=>`<details><summary>${esc(h.at)} · ${esc(h.reason)}</summary>${h.before?`<p>Phiên bản trước: ${esc(h.before.name)}</p><p>Ghi chú / bằng chứng: ${esc(h.before.evidence||h.before.timeEvidence||'')}</p>`:''}</details>`).join('')||'Chưa có thay đổi.'}</article>`}
function resolve(){if(!plan())return '<article>Chưa có hồ sơ.</article>';const d=plan().decisions.at(-1)||{};return `<h1>Chốt kế hoạch COD</h1><article><h2>${conclusion(analyze())}</h2><form id="decisionform">${select('choice','Quyết định',['Kiểm chứng thêm','Hiệu chỉnh trước','Thử triển khai giới hạn','Triển khai trong phạm vi đã kiểm tra'],d.choice)}${area('scope','Phạm vi công việc và quy mô được chốt',d.scope,true)}${area('reason','Căn cứ; xử lý cảnh báo và điều kiện bắt buộc',d.reason,true)}${area('resources','Ngân sách, người xác nhận nguồn C/O/D và mốc sẵn sàng',d.resources,true)}${area('stop','Điều kiện dừng / giảm tải và phương án tiếp tục vận hành',d.stop,true)}${field('owner','CEO / người chịu trách nhiệm chốt',d.owner,'text',true)}${field('review','Ngày rà lại',d.review,'date',true)}<button>Lưu quyết định và bản dữ liệu làm căn cứ</button></form><p class="muted">Quyết định là do người quản lý chốt, không phải ứng dụng cấp chứng nhận. Dữ liệu sửa sau bản chốt sẽ được nhắc rà lại.</p></article><article>${wb('resolve','Cam kết 30–60–90 ngày: kiểm chứng, huy động, đo lại')}</article>`}
function report(){if(!plan())return alert('Tạo hồ sơ trước.');const pl=plan(),pr=profile(),a=analyze(),d=pl.decisions.at(-1);$('#main').innerHTML=`<div class="row"><button onclick="window.print()">In / lưu PDF</button><button id="back">Trở lại</button></div><h1>PHIẾU HOẠCH ĐỊNH COD</h1><article><h2>${esc(pr.company)} · ${esc(pl.name)}</h2><p>Ngành: ${esc(pr.sector)} · Giai đoạn: ${esc(pr.phase)}<br>Mục tiêu: ${esc(pr.goal)}<br>Kỳ: ${esc(pr.period)} · Tiền: ${esc(pr.currency)}</p><p>${conclusion(a)}</p>${d&&pl.changedAt>d.at?'<p class="warn">Phương án đã thay đổi sau bản chốt. Cần rà lại quyết định.</p>':''}</article><article><h2>Nguồn lực và công suất</h2>${rowsTable(a)}<p>Chi phí kỳ: ${fmt(a.cost)} · Một lần: ${fmt(a.setup)} ${esc(pr.currency)}</p>${pl.resources.map(r=>`<p><b>${esc(r.type+' · '+r.name)}</b> · ${esc(r.status)}<br>Năng lực: ${esc(r.skills)}<br>Bằng chứng: ${esc(r.evidence)} · ${esc(r.evidenceDate)}<br>Lịch: ${esc(r.availability)}<br>Thỏa thuận O: ${esc(r.agreement)}<br>Giới hạn D: ${esc(r.boundaries)}<br>Dự phòng: ${esc(r.backup)}<br>Chi phí bao gồm: ${esc(r.costScope)}</p>`).join('')}</article><article><h2>Công việc và trách nhiệm</h2>${pl.tasks.map(t=>`<p><b>${esc(t.name)}</b> → ${esc(t.output)}<br>Nguồn: ${esc(pl.resources.find(r=>r.id===t.resource)?.name||'Chưa phân công')} · Người chịu trách nhiệm: ${esc(t.owner)}<br>${esc(t.volume)} ${esc(t.unit)} × ${esc(t.minutes)} phút + ${esc(t.fixedMinutes)} phút = ${fmt(taskLoad(t))} phút<br>Chuẩn: ${esc(t.standard)}<br>Điều kiện: ${esc(t.gate)} · ${esc(t.gateBasis)}<br>Bàn giao: ${esc(t.handoff)}<br>Kiểm tra: ${esc(t.humanReview)}<br>Dự phòng: ${esc(t.fallback)}</p>`).join('')}</article><article><h2>Cảnh báo</h2>${showAlerts(a)}</article><article><h2>Hành động</h2>${pl.actions.map(x=>`<p><b>${esc(x.target)}</b> · ${esc(x.type)}<br>${esc(x.action)}<br>${esc(x.test)}<br>${esc(x.owner)} · ${esc(x.due)}</p>`).join('')||'Chưa có hành động.'}</article><article><h2>Quyết định</h2>${d?`<p>${esc(d.choice)} · ${esc(d.at)}</p>${['scope','reason','resources','stop','owner','review'].map((k,i)=>`<p><b>${['Phạm vi','Căn cứ','Nguồn lực','Điều kiện dừng','Người chốt','Rà lại'][i]}:</b> ${esc(d[k])}</p>`).join('')}`:'Chưa có bản chốt.'}</article><p>Bản học tập P-RIM 1.0. Không thay kiểm chứng năng lực, lịch chi tiết hoặc rà soát nghĩa vụ áp dụng.</p>`;$('#back').onclick=render}
function bind(){$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;editor='';render()});$('#pick')?.addEventListener('change',ev=>{current=ev.target.value;editor='';render()});$('#planpick')?.addEventListener('change',ev=>{profile().activePlan=ev.target.value;editor='';save();render()});$$('.wb').forEach(f=>f.onsubmit=ev=>{ev.preventDefault();(profile()?profile().notes:state.notes)[f.dataset.key]=formData(f).text;save();alert('Đã lưu')});$('#profileform')?.addEventListener('submit',ev=>{ev.preventDefault();const pl=newPlan('Hiện tại'),pr={...formData(ev.target),id:uid(),plans:[pl],activePlan:pl.id,notes:{}};state.profiles.push(pr);current=pr.id;save();tab=2;render()});$$('[data-example]').forEach(b=>b.onclick=()=>{const x=sectors[+b.dataset.example];tab=0;render();$('#profileform [name=sector]').value=x[0];$('#profileform [name=goal]').value=x[1];$('#profileform [name=context]').value=x[6];$('#profileform').scrollIntoView()});$('#addresource')?.addEventListener('click',()=>{editor='resource';editId='';render();$('#editor').scrollIntoView()});$('#addtask')?.addEventListener('click',()=>{editor='task';editId='';render();$('#editor').scrollIntoView()});$$('[data-resource]').forEach(b=>b.onclick=()=>{editor='resource';editId=b.dataset.resource;render();$('#editor').scrollIntoView()});$$('[data-task]').forEach(b=>b.onclick=()=>{editor='task';editId=b.dataset.task;render();$('#editor').scrollIntoView()});$('#close')?.addEventListener('click',()=>{editor='';render()});$('#resourceform')?.addEventListener('submit',ev=>{ev.preventDefault();const r=formData(ev.target);for(const k of ['capacity','cost','setupCost'])if(number(r[k])!==null&&(!Number.isFinite(+r[k])||+r[k]<0))return alert('Thời gian và chi phí phải không âm.');if(plan().resources.some(x=>x.id!==r.id&&x.externalId.trim().toLowerCase()===r.externalId.trim().toLowerCase()))return alert('Mã nguồn đã có. Dùng nguồn đó cho nhiều việc, không tạo trùng công suất.');if(r.status==='Sẵn dùng — đã kiểm chứng'&&(!r.evidence.trim()||!r.evidenceDate))return alert('Cần bằng chứng và ngày kiểm chứng để khai báo sẵn dùng.');if(r.evidenceDate>new Date().toISOString().slice(0,10))return alert('Ngày kiểm chứng không thể ở tương lai.');storeItem('resources',r);editor='';render()});$('#taskform')?.addEventListener('submit',ev=>{ev.preventDefault();const t=formData(ev.target);for(const k of ['volume','minutes','fixedMinutes'])if(number(t[k])!==null&&(!Number.isFinite(+t[k])||+t[k]<0))return alert('Khối lượng và thời gian phải không âm.');if(t.gate!=='Chưa kiểm chứng'&&!t.gateBasis.trim())return alert('Cần căn cứ cho trạng thái điều kiện bắt buộc.');if(t.loadBasis==='Đã đo kiểm chứng'&&!t.timeEvidence.trim())return alert('Cần mô tả cách đo định mức.');storeItem('tasks',t);editor='';render()});$$('[data-remove-resource]').forEach(b=>b.onclick=()=>{if(plan().tasks.some(t=>t.resource===b.dataset.removeResource))return alert('Nguồn đang được giao việc. Chuyển hoặc bỏ phân công trước khi xóa.');if(confirm('Xóa nguồn này?')){const before=plan().resources.find(r=>r.id===b.dataset.removeResource);plan().history.push({at:new Date().toISOString(),reason:'Xóa nguồn',before:structuredClone(before)});plan().resources=plan().resources.filter(r=>r.id!==before.id);change('Xóa nguồn');render()}});$$('[data-remove-task]').forEach(b=>b.onclick=()=>{if(confirm('Xóa công việc này?')){const before=plan().tasks.find(t=>t.id===b.dataset.removeTask);plan().history.push({at:new Date().toISOString(),reason:'Xóa công việc',before:structuredClone(before)});plan().tasks=plan().tasks.filter(t=>t.id!==before.id);change('Xóa công việc');render()}});$('#clone')?.addEventListener('click',()=>{const name=prompt('Tên phương án mới (bản sao độc lập):','Phương án COD cải tiến');if(!name?.trim())return;const pl=structuredClone(plan());pl.id=uid();pl.name=name.trim();pl.decisions=[];pl.changedAt=new Date().toISOString();pl.history.push({at:pl.changedAt,reason:'Sao chép từ '+plan().name});profile().plans.push(pl);profile().activePlan=pl.id;save();render()});$('#rename')?.addEventListener('click',()=>{const name=prompt('Tên phương án:',plan().name);if(name?.trim()){plan().name=name.trim();change('Đổi tên phương án');render()}});$('#simulate')?.addEventListener('click',()=>{const m=number($('#multiplier').value);if(m===null||m<0||!Number.isFinite(m))return alert('Nhập hệ số không âm.');const a=analyze(plan(),m);$('#simulation').innerHTML=`<h3>Giả định nhu cầu × ${fmt(m)}</h3>${rowsTable(a)}${showAlerts(a)}<p>Chi phí chưa tự thay đổi theo hệ số. Muốn tính kinh tế: sao chép phương án và hiệu chỉnh nguồn/chi phí.</p>`});$('#actionform')?.addEventListener('submit',ev=>{ev.preventDefault();plan().actions.push({...formData(ev.target),id:uid()});change('Thêm kế hoạch');render()});$('#decisionform')?.addEventListener('submit',ev=>{ev.preventDefault();plan().decisions.push({...formData(ev.target),at:new Date().toISOString(),recommendation:conclusion(analyze()),snapshot:{resources:structuredClone(plan().resources),tasks:structuredClone(plan().tasks),actions:structuredClone(plan().actions)}});save();alert('Đã lưu bản chốt và dữ liệu làm căn cứ.')})}
function storeItem(key,item){const old=plan()[key].find(x=>x.id===item.id);if(old){plan().history.push({at:new Date().toISOString(),reason:item.changeReason,before:structuredClone(old)});Object.assign(old,item)}else plan()[key].push({...item,id:uid()});change('Cập nhật '+(key==='resources'?'nguồn lực':'công việc'))}
function valid(x){if(!x||x.kind!=='prim'||x.version!==1||!Array.isArray(x.profiles)||x.profiles.length>100||!x.notes||typeof x.notes!=='object')return false;const ids=new Set();for(const pr of x.profiles){if(!pr||typeof pr.id!=='string'||ids.has(pr.id)||!Array.isArray(pr.plans)||!pr.notes||!pr.plans.some(p=>p.id===pr.activePlan))return false;ids.add(pr.id);const pi=new Set();for(const pl of pr.plans){if(!pl||typeof pl.id!=='string'||pi.has(pl.id)||!['resources','tasks','actions','history','decisions'].every(k=>Array.isArray(pl[k]))||pl.resources.length>10000||pl.tasks.length>20000)return false;pi.add(pl.id);const ri=new Set();for(const r of pl.resources){if(!r||typeof r.id!=='string'||ri.has(r.id)||!['C','O','D'].includes(r.type)||!statuses.includes(r.status)||typeof r.externalId!=='string')return false;ri.add(r.id);for(const k of ['capacity','cost','setupCost'])if(!blank(r[k])&&(!Number.isFinite(Number(r[k]))||+r[k]<0))return false;}const ti=new Set();for(const t of pl.tasks){if(!t||typeof t.id!=='string'||ti.has(t.id)||(t.resource&&!ri.has(t.resource)))return false;ti.add(t.id);for(const k of ['volume','minutes','fixedMinutes'])if(!blank(t[k])&&(!Number.isFinite(Number(t[k]))||+t[k]<0))return false;}if(pl.actions.some(a=>!a||typeof a!=='object')||pl.history.some(a=>!a||typeof a!=='object')||pl.decisions.some(a=>!a||typeof a!=='object'))return false;}}return true}
$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='P-RIM-MyBizCar-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async ev=>{try{const f=ev.target.files[0];if(!f)return;if(f.size>20000000)throw Error('Tệp quá 20 MB');const x=JSON.parse(await f.text());if(!valid(x))throw Error('Không đúng cấu trúc P-RIM 1.0');if(confirm('Thay thế toàn bộ dữ liệu P-RIM? Hãy xuất sao lưu trước.')){state=x;current=x.profiles[0]?.id||'';editor='';save();render()}}catch(err){alert('Không nhập: '+err.message)}ev.target.value=''};$('#report').onclick=report;render();
</script></body></html>

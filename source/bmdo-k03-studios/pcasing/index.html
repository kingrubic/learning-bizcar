function pointStatus(p){if(p.target==='D'){const r=latest(p);return r?technical(r,p):'unknown'}const x=stats(p);return !x.n?'unknown':x.values.some(v=>v<=5)?'pain':x.values.some(v=>v<9)?'wait':'happy'}
const color=k=>({unknown:'#96a5ad',pain:'#bf584a',wait:'#d69c37',happy:'#278b76',pass:'#278b76',fail:'#bf584a'}[k]),statusLabel=k=>({unknown:'Chưa đủ dữ liệu',pain:'Có phản hồi PainZone',wait:'Có phản hồi WaitingZone, chưa ghi nhận PainZone',happy:'Mẫu hiện có đều HappyZone',pass:'Đáp ứng chuẩn vận hành đã đặt',fail:'Chưa đáp ứng chuẩn vận hành'}[k]);
function wheel(){const ps=visible();return `<svg class="wheel shell" viewBox="0 0 560 350" role="img" aria-label="Ba lớp vỏ WorkEx ServEx CommEx, các chấm biểu diễn EncounterPoints"><ellipse cx="235" cy="323" rx="150" ry="13" fill="#dce6df"/>${layers.map((l,i)=>`<circle cx="235" cy="166" r="${65+i*39}" fill="none" stroke="${['#a9ccc2','#e8ce9e','#b9c7dd'][i]}" stroke-width="30"/>`).join('')}<circle cx="235" cy="166" r="40" fill="#173d3d"/><text x="235" y="172" text-anchor="middle" fill="white" font-size="12">CXC / COD</text>${layers.map((l,i)=>{const rows=ps.filter(p=>p.layer===l);return rows.slice(0,24).map((p,j)=>{const a=(j/Math.max(rows.slice(0,24).length,1)*360-90)*Math.PI/180,r=65+i*39,x=235+r*Math.cos(a),y=166+r*Math.sin(a);return `<circle data-point="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)}" cx="${x}" cy="${y}" r="10" fill="${color(pointStatus(p))}" stroke="white" stroke-width="2"><title>${esc(p.name+' · '+statusLabel(pointStatus(p)))}</title></circle>`}).join('')}).join('')}${layers.map((l,i)=>`<text x="398" y="${105+i*45}" fill="#173d3d" font-size="15">${l}</text>`).join('')}</svg><p class="muted">Vòng trong WorkEx → ServEx → CommEx. Chọn chấm để xem điểm. Tối đa 24 chấm/lớp; danh sách xMAP hiển thị đầy đủ. Không đo “độ dày” bằng số chính sách. C/O: màu theo phản hồi XENERGY; D: theo chuẩn vận hành, không cùng thang cảm xúc.</p>`}
function wb(key,label){return `<form class="wb" data-key="${key}">${area('text',label,s.notes[key]||'')}<button>Lưu nội dung</button></form>`}
function picker(){return `<label>EncounterPoint đang xem<select id="pointpick"><option value="">Chọn điểm</option>${s.points.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.target+' · '+p.layer+' · '+p.name)}</option>`).join('')}</select></label>`}
function render(){ $('#nav').innerHTML=steps.map((v,i)=>`<button data-tab="${i}" class="${i===tab?'active':''}">${i+1}. ${v.split('|')[0]}<small>${v.split('|')[1]}</small></button>`).join('');$('#main').innerHTML=[activate,paradigm,practise,lens,improve,extract,resolve][tab]();bind()}
function activate(){return `<div class="wheels"><article><span class="tag">PEOPLE WHEEL / ĐIỀU KIỆN TRẢI NGHIỆM COD</span><h1>Làm gì, cho ai,<br>ở cuộc gặp nào?</h1><p>CXC tại P-CASING: COD Experience Condition. Thiết kế điều kiện công việc, phục vụ và truyền thông để C/O tương tác tốt hơn, D vận hành phù hợp hơn.</p><p>Chính sách được ban hành ≠ trải nghiệm đã tốt. Điểm trải nghiệm cao không tự chứng minh gắn bó, cống hiến hoặc niềm tin.</p><form id="context">${field('company','Doanh nghiệp',s.company,'text',true)}${sel('sector','Bối cảnh ngành',sectors.map(x=>x[0]).concat('Khác / kết hợp'),s.sector)}${area('scope','Phạm vi: đơn vị, nhóm COD, sản phẩm, giai đoạn, mã P-RIM',s.scope,true)}<button>Lưu bối cảnh</button></form></article><article>${wheel()}<div class="warn">C/O có cảm nhận. D được đo bằng dữ liệu vận hành, không chấm Feel hoặc XENERGY cho hệ thống số.</div></article></div><article>${wb('activate','Điểm nào đang khiến COD khó làm việc hoặc khó phối hợp? Có bằng chứng gì?')}</article>`}
function paradigm(){return `<h1>Mô thức thực chiến P-CASING</h1><div class="grid">${layers.map(l=>`<article><h2>${l}</h2><p>${layerName[l]}</p><p>${{WorkEx:'Giao việc, tải công việc, công cụ, quyền hạn, nơi làm việc, dữ liệu và bàn giao.',ServEx:'Hội nhập, hỗ trợ, tháo gỡ trở ngại, nghiệm thu, thanh toán, đời sống–gia đình–an sinh cho con người; bảo trì/phục hồi cho D.',CommEx:'Giải thích định hướng, lắng nghe, phản hồi, ghi nhận và thông tin trong/ngoài doanh nghiệp; phiên bản và tín hiệu bàn giao cho D.'}[l]}</p></article>`).join('')}</div><article><h2>Chuẩn đo riêng cho con người và D</h2><p><b>P:</b> “Anh/chị thấy điều kiện tại cuộc gặp này rõ ràng, dễ tiếp cận đến mức nào?”<br><b>F:</b> “Anh/chị cảm thấy tích cực, được tôn trọng/hỗ trợ đến mức nào trong cuộc gặp này?”<br><b>E:</b> “Anh/chị đánh giá điều kiện này đáp ứng nhu cầu thực hiện công việc đến mức nào?”<br><b>XENERGY:</b> “Tổng thể, anh/chị chấm năng lượng trải nghiệm tại cuộc gặp này bao nhiêu?”</p><p>Thang 1–10: từ mức rất thấp đến rất cao theo câu hỏi. Có quyền không trả lời/chưa đủ trải nghiệm. Ghi lời giải thích, không suy điểm từ văn bản. Không lấy trung bình P/F/E thay cho X. 1–5 PainZone; 6–8 WaitingZone; 9–10 HappyZone là quy ước mô thức, không phải ngưỡng khoa học phổ quát.</p><p><b>D:</b> dùng phép đo như tỷ lệ đầu vào hợp lệ, đầu ra đạt chuẩn, thời gian phục hồi, chuyển người đúng nơi. Mục tiêu và nguồn chuẩn phải rõ. Mỗi điểm D trong bản 1.0 gắn một chỉ số chính; tạo điểm đo liên quan riêng nếu cần thêm chỉ số.</p><p><b>WOW–WELL–WIN:</b> điều hữu ích vượt kỳ vọng; phục vụ ổn định/phù hợp; giúp đạt kết quả chính đáng. Đây là ý đồ thiết kế đề xuất. Với D không phải cảm xúc. Không thêm WOW để che thiếu hụt cơ bản.</p></article><article><h2>6N và trải nghiệm giao nhau</h2><p>Nhìn, Nghe, Ngửi, Nếm, Nắm–Chạm, Nghĩ: chọn phần liên quan cho C/O, không bắt buộc đủ cả sáu và không tăng kích thích bằng mọi giá. D không được gán sáu giác quan con người.</p><p>C→O, O→C, D→C, C→D…: chọn đối tượng nhận điều kiện làm góc nhìn chính. Muốn xem góc nhìn bên kia, tạo điểm liên quan riêng và ghi mã liên hệ. Không lấy trải nghiệm bên giao đại diện bên nhận.</p></article><h2>27 tình huống rõ theo COD × 3 lớp</h2><p>Ví dụ dưới đây là giả định để học, không phải dữ liệu thực nghiệm. “Dùng mẫu” chỉ điền gợi ý thiết kế, không tạo phản hồi hay điểm số.</p>${examples.map((x,i)=>`<article><details><summary>${x[0]} · ${x[1]} · ${x[2]}</summary><p><b>Trước:</b> ${x[3]}</p><p><b>Thay đổi điều kiện:</b> ${x[4]}</p><p><b>Kiểm chứng:</b> ${x[5]}</p><button data-example="${i}">Dùng mẫu này</button></details></article>`).join('')}<article><h2>12 bối cảnh ngành để cá nhân hóa</h2>${sectors.map(x=>`<details><summary>${x[0]}</summary><p>Điểm cần rà: ${x[1]}. Vai trò: ${x[2]}.</p><p>Áp dụng mẫu phù hợp, thêm dữ kiện thật, xác định tiêu chuẩn riêng. Không mặc định giải pháp giống nhau giữa các doanh nghiệp.</p></details>`).join('')}</article><article><h2>Đời sống, gia đình và an sinh</h2><p>Thiết kế cả lúc tìm hiểu chính sách, yêu cầu hỗ trợ, chờ phản hồi, nhận quyết định và hỏi thăm sau đó. Tự nguyện, kín đáo, công bằng; không thu thông tin nhạy cảm vào bài tập, không gắn hỗ trợ với nghĩa vụ ở lại/làm thêm. O được thiết kế theo phạm vi hợp tác, không mặc định giống chính sách C.</p><p>Thu phản hồi con người cần minh bạch mục đích, không ép trả lời, không dùng điểm để trừng phạt cá nhân. Chỉ nhập mã ẩn danh; nhóm quá nhỏ có nguy cơ nhận diện. Bản ngoại tuyến không phải hệ thống bảo mật hồ sơ nhân sự.</p></article>`}
function pointForm(p={}){const target=p.target||'C';return `<form id="pointform"><input type="hidden" name="id" value="${esc(p.id||'')}"><div class="grid">${sel('target','Đối tượng nhận điều kiện',targets,target)}${sel('layer','Lớp chính',layers,p.layer)}${field('name','EncounterPoint: một tình huống cụ thể',p.name,'text',true)}${field('role','Vai trò / nhóm cụ thể (không nhập tên nhạy cảm)',p.role,'text',true)}${field('interaction','Bên giao / bên phối hợp: C, O, D; mã điểm liên quan',p.interaction)}${field('period','Thời kỳ / đợt và phạm vi thu dữ liệu',p.period,'text',true)}${field('owner','Người chịu trách nhiệm điều kiện',p.owner,'text',true)}${sel('control','Mức kiểm soát',['Doanh nghiệp trực tiếp','Cùng đối tác thực hiện','Chủ yếu môi trường bên ngoài'],p.control)}${sel('conditionStatus','Tình trạng điều kiện',['Mới đề xuất','Đang triển khai','Đã triển khai','Đã kiểm tra việc thực hiện'],p.conditionStatus)}</div>${area('problem','Vấn đề hiện tại và nguồn căn cứ',p.problem,true)}${area('condition','Thay đổi cụ thể: doanh nghiệp sẽ làm gì cho đối tượng này?',p.condition,true)}${area('proof','Bằng chứng triển khai (không thay phản hồi trải nghiệm)',p.proof)}${area('wow','WOW–WELL–WIN dự kiến; không coi là kết quả đã xảy ra',p.wow)}<div id="humanFields" ${target==='D'?'hidden':''}><fieldset><legend>6N ưu tiên cho con người (tùy chọn)</legend>${senses.map(n=>`<label class="check"><input type="checkbox" name="senses" value="${n}" ${p.senses?.includes(n)?'checked':''}> ${n}</label>`).join('')}</fieldset>${field('xTarget','Mục tiêu XENERGY (1–10, tùy chọn)',p.xTarget,'number')}${area('xBasis','Căn cứ mục tiêu XENERGY và phương pháp thu phản hồi',p.xBasis)}</div><div id="digitalFields" ${target==='D'?'':'hidden'}><div class="grid">${field('metric','Chỉ số vận hành chính',p.metric)}${sel('metricType','Kiểu đo',['Giá trị số','Tỷ lệ (%)'],p.metricType)}${field('unit','Đơn vị: phút, lỗi… (tỷ lệ dùng %)',p.unit)}${sel('direction','Chiều mong muốn',['Cao hơn tốt hơn','Thấp hơn tốt hơn','Trong khoảng'],p.direction)}${field('threshold','Mục tiêu / cận dưới',p.threshold,'number')}${field('upper','Cận trên nếu đo Trong khoảng',p.upper,'number')}</div>${area('standard','Nguồn chuẩn, công thức, cách chọn mẫu, điều kiện loại trừ',p.standard)}</div>${area('method','Kế hoạch đo lại: ai, ở đâu, khi nào, chọn mẫu và giới hạn',p.method,true)}<button>Lưu thiết kế</button> <button id="cancel" type="button">Đóng</button></form>`}
function practise(){return `<h1>Thiết kế điều kiện tại từng cuộc gặp</h1><article><p>${esc(s.company)} · ${esc(s.scope)}</p><button id="addpoint">Thêm EncounterPoint riêng</button><p>Điểm đã có phản hồi sẽ khóa thiết kế để bảo toàn cách đối chiếu. Dùng “Tạo phiên bản tiếp” để đổi điều kiện hoặc chuẩn đo.</p></article>${edit!==null?`<article id="editor">${pointForm(edit)}</article>`:''}${s.points.length?`<article>${picker()}${point()?detail(point()):'Chọn điểm để xem.'}</article>`:'<article>Chưa có điểm. Có thể bắt đầu từ mẫu tại Paradigm.</article>'}<div class="grid">${s.points.map(p=>`<article><span class="tag">${esc(p.target+' · '+p.layer)}</span><h2>${esc(p.name)}</h2><p>${esc(p.condition)}</p><button data-point="${p.id}">Xem / thu dữ liệu</button></article>`).join('')}</div>`}
function detail(p){return `<h2>${esc(p.name)}</h2><p>${esc(p.target+' · '+p.layer+' · '+p.role)}<br>${esc(p.period)} · phụ trách ${esc(p.owner)} · ${esc(p.control)}</p><p><b>Vấn đề:</b> ${esc(p.problem)}<br><b>Điều kiện:</b> ${esc(p.condition)}<br><b>Thực hiện:</b> ${esc(p.conditionStatus)} — ${esc(p.proof)}</p><p>Liên hệ: ${esc(p.interaction)}<br>Đo lại: ${esc(p.method)}</p><div class="row"><button id="editpoint">Hiệu chỉnh thiết kế</button><button id="clonepoint">Tạo phiên bản tiếp</button></div><hr>${p.target==='D'?digitalForm(p):humanForm(p)}<details><summary>Dữ liệu đã lưu cho điểm này</summary>${p.target==='D'?s.readings.filter(r=>r.point===p.id).map(r=>`<p>${esc(r.date)} · ${esc(r.batch)} · ${esc(r.source)}<br>${statusLabel(technical(r,p))}<br>${esc(r.evidence)} <button data-remove-reading="${r.id}">Xóa bản nhập sai</button></p>`).join(''):s.feedback.filter(r=>r.point===p.id).map(r=>`<p>${esc(r.respondent)} · ${esc(r.batch)} · ${esc(r.date)}<br>P ${esc(r.p||'—')} / F ${esc(r.f||'—')} / E ${esc(r.e||'—')} / X ${esc(r.x||'—')}<br>${esc(r.comment)}<br>${esc(r.source)} · ${esc(r.limit)} <button data-remove-feedback="${r.id}">Xóa bản nhập sai</button></p>`).join('')}</details>`}
function humanForm(p){return `<h3>Thu phản hồi trực tiếp của ${p.target}</h3><p>Thang 1–10 theo câu hỏi ở Paradigm. Bỏ trống chỉ số chưa đủ trải nghiệm/không trả lời; ghi lý do. Không để CEO tự suy điểm thay người nhận.</p><form id="feedbackform"><div class="grid">${field('respondent','Mã người trả lời ẩn danh','','text',true)}${field('batch','Mã đợt đo','','text',true)}${field('date','Ngày phản hồi',today(),'date',true)}${field('source','Nguồn / mã phiếu','','text',true)}${field('p','P · nhận thức rõ, dễ tiếp cận','','number')}${field('f','F · cảm nhận tích cực, được tôn trọng/hỗ trợ','','number')}${field('e','E · đánh giá phù hợp công việc','','number')}${field('x','XENERGY trực tiếp, không tính từ PFE','','number')}</div>${area('comment','Lời giải thích / lý do không trả lời / trải nghiệm cụ thể','',true)}${area('limit','Giới hạn: mẫu nhỏ, tự chọn, ảnh hưởng người quản lý…')}<button>Lưu phản hồi</button></form>`}
function digitalForm(p){return `<h3>Ghi dữ liệu vận hành D — không có Feel</h3><p>${esc(p.metric)} · ${esc(p.direction)} · chuẩn ${esc(p.threshold||'—')} ${esc(p.unit)}<br>${esc(p.standard)}</p><form id="readingform"><div class="grid">${field('batch','Mã đợt / phép kiểm tra','','text',true)}${field('date','Ngày đo',today(),'date',true)}${field('source','Nguồn / mã nhật ký','','text',true)}${p.metricType==='Tỷ lệ (%)'?field('numerator','Tử số','','number',true)+field('denominator','Mẫu số (0 sẽ chưa tính)','','number',true):field('value','Giá trị quan sát','','number',true)}</div>${area('evidence','Điều kiện đo, phạm vi, số quan sát và giới hạn','',true)}<button>Lưu dữ liệu vận hành</button></form>`}
function filterUI(){return `<div class="grid">${sel('targetFilter','Đối tượng',['Tất cả',...targets],filters.target)}${sel('layerFilter','Lớp',['Tất cả',...layers],filters.layer)}<label>Mã đợt đo (để trống = tất cả)<input id="batchFilter" value="${esc(filters.batch)}"></label></div><button id="applyfilter">Áp dụng bộ lọc</button><p class="muted">Gộp nhiều đợt không chứng minh xu hướng; có thể có người trả lời lặp. D dùng bản đo mới nhất theo ngày trong bộ lọc. Thay điều kiện phải xem đúng phiên bản.</p>`}
function humanCard(p){const st=stats(p),dist=[st.values.filter(v=>v<=5).length,st.values.filter(v=>v>=6&&v<=8).length,st.values.filter(v=>v>=9).length];return `<p>${statusLabel(pointStatus(p))}</p><p><b>XENERGY:</b> TB ${fmt(st.mean)} · trung vị ${fmt(st.median)}<br>${st.n} phản hồi có X từ ${st.people} mã người · ${st.rows.length-st.n} phản hồi không có X</p><p>Pain ${dist[0]} · Waiting ${dist[1]} · Happy ${dist[2]}${st.n?'<br>Tỷ lệ: '+dist.map(n=>fmt(n/st.n*100)+'%').join(' / '):''}</p><p>P / F / E (TB, số phản hồi): ${['p','f','e'].map(k=>{const a=stats(p,k);return `${k.toUpperCase()} ${fmt(a.mean)} (n=${a.n})`}).join(' · ')}</p><p>Mục tiêu X: ${esc(p.xTarget||'Chưa đặt')} · chênh TB–mục tiêu: ${st.mean!==null&&num(p.xTarget)!==null?fmt(st.mean-num(p.xTarget)):'Chưa tính'}</p>${st.people>0&&st.people<5?'<div class="warn">Mẫu dưới 5 mã người: nguy cơ nhận diện và thiếu đại diện. Đây là cảnh báo quản trị, không phải bảo đảm ẩn danh khi đạt 5.</div>':''}`}
function digitalCard(p){const r=latest(p);if(!r)return '<p>Chưa có dữ liệu vận hành. Không chấm 0.</p>';const v=p.metricType==='Tỷ lệ (%)'?(+r.denominator>0?+r.numerator/+r.denominator*100:null):num(r.value);return `<p><b>${esc(p.metric)}</b>: ${fmt(v)} ${p.metricType==='Tỷ lệ (%)'?'%':esc(p.unit)}<br>${statusLabel(technical(r,p))}</p><p>Chuẩn: ${esc(p.direction)} ${esc(p.threshold)} ${p.direction==='Trong khoảng'?'đến '+esc(p.upper):''}<br>${esc(r.date)} · ${esc(r.batch)} · ${esc(r.source)}</p><p>${esc(r.evidence)}</p><p class="muted">Không quy đổi sang XENERGY, không đại diện cảm xúc hoặc gắn bó.</p>`}
function lens(){const ps=visible();return `<h1>xMAP · Nhìn rõ nơi cần cải thiện</h1><article>${filterUI()}${wheel()}<p>${ps.length} điểm trong bộ lọc · ${ps.filter(p=>pointStatus(p)==='unknown').length} điểm chưa đủ dữ liệu.<br>Không có điểm tổng COD. Màu phản hồi không phải chứng nhận điều kiện thực hiện hay kết quả gắn bó.</p></article><div class="grid">${ps.map(p=>`<article style="border-top:6px solid ${color(pointStatus(p))}"><span class="tag">${esc(p.target+' · '+p.layer)}</span><h2>${esc(p.name)}</h2><p>Điều kiện: ${esc(p.conditionStatus)}<br>${esc(p.condition)}</p>${p.target==='D'?digitalCard(p):humanCard(p)}<button data-point="${p.id}">Xem / bổ sung dữ liệu</button><button data-actionpoint="${p.id}">Lập kế hoạch cải thiện</button></article>`).join('')||'<article>Chưa có điểm phù hợp bộ lọc.</article>'}</div><article>${wb('lens','Điểm thấp do điều kiện nào? Có giải thích khác? Mẫu có đủ phù hợp để quyết định không?')}</article>`}
function improve(){return `<h1>Đầu tư vào đúng EncounterPoint</h1><article><p>Ưu tiên vấn đề nghiêm trọng, lặp lại, ảnh hưởng công việc và có bằng chứng. Không tạo WOW để che thiếu WELL cơ bản. Giả thuyết nguyên nhân cần được kiểm chứng.</p><form id="actionform"><label>Điểm cần cải thiện<select name="point" required><option value="">Chọn EncounterPoint</option>${s.points.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.target+' · '+p.name)}</option>`).join('')}</select></label>${sel('priority','Mức ưu tiên do người quản lý chọn',['Cần kiểm chứng','Cao','Khẩn cấp'])}${area('cause','Bằng chứng và giả thuyết nguyên nhân; giải thích khác','',true)}${area('action','Doanh nghiệp sẽ thay đổi điều kiện gì cho ai?','',true)}<div class="grid">${field('owner','Người phụ trách','','text',true)}${field('due','Hạn thực hiện','','date',true)}${field('budget','Ngân sách dự kiến (tùy chọn)','','number')}${field('currency','Đơn vị tiền','VND')}${sel('status','Trạng thái',['Đã có kế hoạch','Đã thực hiện','Đã đo lại'])}</div>${area('resources','Nhân lực / công cụ / bên phối hợp')}${area('evidence','Bằng chứng thực hiện hoặc mã dữ liệu đo lại')}${area('test','Đo lại: chỉ số, nguồn, thời điểm, điều kiện so sánh và giới hạn','',true)}<button>Lưu kế hoạch</button></form></article>${s.actions.map(a=>`<article><span class="tag">${esc(a.priority)} · ${esc(a.status)}</span><h2>${esc(s.points.find(p=>p.id===a.point)?.name||'Điểm không còn')}</h2><p>${esc(a.action)}</p><p>Căn cứ: ${esc(a.cause)}<br>Phụ trách: ${esc(a.owner)} · ${esc(a.due)}<br>Ngân sách: ${esc(a.budget||'Chưa đặt')} ${esc(a.currency)}</p><p>Kiểm chứng: ${esc(a.test)}<br>Bằng chứng: ${esc(a.evidence)}</p><button data-update-action="${a.id}">Cập nhật trạng thái / bằng chứng</button></article>`).join('')}<article><h2>So sánh trước–sau có điều kiện</h2><p>Dùng bộ lọc đợt tại Lens để xem từng giai đoạn. So sánh đúng nhóm, câu hỏi, phiên bản, phạm vi và cách chọn mẫu. Điểm tăng sau hành động chưa tự chứng minh hành động là nguyên nhân.</p></article>`}
function extract(){return `<h1>Bài học mang theo</h1><article><p>${s.points.length} EncounterPoints · ${s.feedback.length} phản hồi con người · ${s.readings.length} bản đo D · ${s.actions.length} kế hoạch.</p>${wb('extract','Điều kiện nào thực sự cần thay đổi? Việc gì nên dừng, giữ hoặc thử thêm?')}</article><article><h2>Lịch sử thiết kế và hiệu chỉnh</h2>${s.history.slice().reverse().map(h=>`<details><summary>${esc(h.at)} · ${esc(h.reason)}</summary>${h.before?`<p>Đối tượng: ${esc(h.before.name||h.before.respondent||h.before.status||h.before.batch||'Bản ghi')}</p>`:''}</details>`).join('')||'Chưa có lịch sử.'}</article>`}
function resolve(){return `<h1>Cam kết 30–60–90 ngày</h1><article><p><b>30 ngày:</b> xác định điểm trọng yếu, thu phản hồi ban đầu, xử lý vấn đề cấp bách.<br><b>60 ngày:</b> thực hiện điều kiện cải thiện, kiểm tra việc thực hiện và tác động ngoài dự kiến.<br><b>90 ngày:</b> đo lại, phản biện và điều chỉnh.</p>${wb('resolve','Cam kết: việc gì, cho ai, ai chịu trách nhiệm, ngân sách, mốc kiểm chứng và điều kiện dừng')}</article><article><h2>Giới hạn cần giữ</h2><p>Không sử dụng phản hồi để suy đoán sức khỏe, hoàn cảnh gia đình hoặc trừng phạt cá nhân. Không thu thông tin nhạy cảm trong bài tập. Công cụ không có máy chủ bảo mật nhân sự, xác minh danh tính hoặc cơ chế ẩn danh được bảo đảm.</p><p>Chưa tự đồng bộ P-RIM/VMF. Không tự chứng nhận trải nghiệm, niềm tin hoặc gắn bó. XENERGY là phản hồi trực tiếp, chỉ số D là kết quả vận hành theo chuẩn đã đặt. Xuất JSON để giữ toàn bộ dữ liệu; phiếu in chỉ trình bày tổng hợp và kế hoạch.</p></article>`}
function report(){const old={...filters};filters={target:'Tất cả',layer:'Tất cả',batch:''};$('#main').innerHTML=`<button onclick="window.print()">In / lưu PDF</button> <button id="back">Trở lại</button><h1>PHIẾU THIẾT KẾ P-CASING</h1><article><h2>${esc(s.company)}</h2><p>${esc(s.sector)} · ${esc(s.scope)}</p><p>Toàn bộ phiên bản và đợt đo; không suy xu hướng khi gộp đợt.</p></article>${s.points.map(p=>`<article><h2>${esc(p.target+' · '+p.layer+' · '+p.name)}</h2><p>Nhóm: ${esc(p.role)} · ${esc(p.period)}<br>Vấn đề: ${esc(p.problem)}<br>Điều kiện: ${esc(p.condition)}<br>Trạng thái: ${esc(p.conditionStatus)} · ${esc(p.proof)}<br>Người phụ trách: ${esc(p.owner)}<br>Kế hoạch đo: ${esc(p.method)}</p>${p.target==='D'?digitalCard(p):humanCard(p)}</article>`).join('')}<article><h2>Kế hoạch cải thiện</h2>${s.actions.map(a=>`<p><b>${esc(s.points.find(p=>p.id===a.point)?.name)}</b><br>${esc(a.action)}<br>${esc(a.owner)} · ${esc(a.due)} · ${esc(a.budget||'Chưa đặt ngân sách')} ${esc(a.currency)}<br>${esc(a.status)} · ${esc(a.evidence)}<br>Đo lại: ${esc(a.test)}</p>`).join('')||'Chưa có kế hoạch.'}</article><article><h2>Cam kết</h2><p>${esc(s.notes.resolve||'Chưa có cam kết.')}</p></article><p>Bản học tập 1.0 — không chứng nhận hiệu quả hoặc suy cảm xúc cho D.</p>`;filters=old;$('#back').onclick=render}
function hasData(p){return s.feedback.some(r=>r.point===p.id)||s.readings.some(r=>r.point===p.id)}
function bind(){$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;edit=null;render()});$$('.wb').forEach(f=>f.onsubmit=ev=>{ev.preventDefault();s.notes[f.dataset.key]=fd(f).text;save();alert('Đã lưu')});$('#context')?.addEventListener('submit',ev=>{ev.preventDefault();Object.assign(s,fd(ev.target));save();alert('Đã lưu')});$$('[data-example]').forEach(b=>b.onclick=()=>{const x=examples[+b.dataset.example];edit={target:x[0],layer:x[1],name:x[2],problem:x[3],condition:x[4],method:x[5]};tab=2;render();$('#editor').scrollIntoView()});$('#addpoint')?.addEventListener('click',()=>{edit={};render();$('#editor').scrollIntoView()});$('#cancel')?.addEventListener('click',()=>{edit=null;render()});$('#pointpick')?.addEventListener('change',ev=>{selected=ev.target.value;render()});$$('[data-point]').forEach(b=>{b.onclick=()=>{selected=b.dataset.point;tab=2;edit=null;render();$('#pointpick')?.scrollIntoView()};b.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();b.click()}}});$('#pointform [name=target]')?.addEventListener('change',ev=>{$('#humanFields').hidden=ev.target.value==='D';$('#digitalFields').hidden=ev.target.value!=='D'});$('#pointform')?.addEventListener('submit',ev=>{ev.preventDefault();const p=fd(ev.target);p.senses=new FormData(ev.target).getAll('senses');if(p.target==='D'){p.senses=[];p.xTarget='';p.xBasis='';if(!p.metric.trim()||!p.standard.trim()||num(p.threshold)===null)return alert('Điểm D cần tên chỉ số, chuẩn và mục tiêu.');if(p.direction==='Trong khoảng'&&(num(p.upper)===null||+p.upper<+p.threshold))return alert('Cần cận trên hợp lệ.')}else{if(!blank(p.xTarget)&&(!Number.isInteger(+p.xTarget)||+p.xTarget<1||+p.xTarget>10))return alert('Mục tiêu X phải là số nguyên 1–10 hoặc để trống.');if(!blank(p.xTarget)&&!p.xBasis.trim())return alert('Ghi căn cứ mục tiêu XENERGY.');}if(p.conditionStatus==='Đã kiểm tra việc thực hiện'&&!p.proof.trim())return alert('Cần bằng chứng kiểm tra việc thực hiện.');const old=s.points.find(x=>x.id===p.id);if(old&&hasData(old))return alert('Điểm đã có dữ liệu: tạo phiên bản mới.');if(old){log('Sửa thiết kế',old);Object.assign(old,p)}else{p.id=id();p.created=new Date().toISOString();p.previous=edit?.previous||'';s.points.push(p);log('Tạo EncounterPoint '+p.name)}selected=p.id;edit=null;save();render()});$('#editpoint')?.addEventListener('click',()=>{if(hasData(point()))return alert('Đã có dữ liệu. Tạo phiên bản tiếp để không thay đổi chuẩn cũ.');edit=structuredClone(point());render();$('#editor').scrollIntoView()});$('#clonepoint')?.addEventListener('click',()=>{edit={...structuredClone(point()),id:'',previous:point().id,name:point().name+' — phiên bản tiếp',conditionStatus:'Mới đề xuất',proof:''};render();$('#editor').scrollIntoView()});$('#feedbackform')?.addEventListener('submit',ev=>{ev.preventDefault();const r=fd(ev.target);for(const k of ['p','f','e','x'])if(!blank(r[k])&&(!Number.isInteger(+r[k])||+r[k]<1||+r[k]>10))return alert('Điểm phải là số nguyên 1–10 hoặc bỏ trống.');if(r.date>today())return alert('Ngày phản hồi không thể ở tương lai.');r.respondent=r.respondent.trim();r.batch=r.batch.trim();if(!r.respondent||!r.batch)return alert('Cần mã người và đợt.');if(s.feedback.some(x=>x.point===selected&&x.respondent===r.respondent&&x.batch===r.batch))return alert('Trùng người / đợt / điểm. Kiểm tra bản đã lưu.');s.feedback.push({...r,id:id(),point:selected});save();render()});$('#readingform')?.addEventListener('submit',ev=>{ev.preventDefault();const r=fd(ev.target);if(r.date>today())return alert('Ngày đo không thể ở tương lai.');if(point().metricType==='Tỷ lệ (%)'&&(+r.numerator<0||+r.denominator<0))return alert('Tử số và mẫu số không âm.');if(s.readings.some(x=>x.point===selected&&x.batch.trim()===r.batch.trim()&&x.source.trim()===r.source.trim()))return alert('Trùng phép đo / nguồn / điểm.');s.readings.push({...r,id:id(),point:selected,created:new Date().toISOString()});save();render()});for(const [attr,key]of [['feedback','feedback'],['reading','readings']])$$('[data-remove-'+attr+']').forEach(b=>b.onclick=()=>{if(confirm('Xóa bản nhập sai? Lịch sử vẫn giữ bản cũ trong JSON; không nhập dữ liệu nhạy cảm.')){const rid=b.getAttribute('data-remove-'+attr),old=s[key].find(r=>r.id===rid);s[key]=s[key].filter(r=>r.id!==rid);log('Xóa bản nhập sai',old);render()}});$('#applyfilter')?.addEventListener('click',()=>{filters={target:$('[name=targetFilter]').value,layer:$('[name=layerFilter]').value,batch:$('#batchFilter').value.trim()};render()});$$('[data-actionpoint]').forEach(b=>b.onclick=()=>{selected=b.dataset.actionpoint;tab=4;render()});$('#actionform')?.addEventListener('submit',ev=>{ev.preventDefault();const a=fd(ev.target);if(!blank(a.budget)&&+a.budget<0)return alert('Ngân sách không âm.');if(a.status!=='Đã có kế hoạch'&&!a.evidence.trim())return alert('Cần bằng chứng cho trạng thái thực hiện / đo lại.');s.actions.push({...a,id:id()});save();render()});$$('[data-update-action]').forEach(b=>b.onclick=()=>{const a=s.actions.find(a=>a.id===b.dataset.updateAction),v=prompt('1: Đã có kế hoạch; 2: Đã thực hiện; 3: Đã đo lại');if(!['1','2','3'].includes(v))return;const ev=prompt('Bằng chứng thực hiện / mã dữ liệu đo lại:',a.evidence);if(ev===null)return;if(v!=='1'&&!ev.trim())return alert('Cần bằng chứng.');log('Cập nhật kế hoạch',a);a.status=['Đã có kế hoạch','Đã thực hiện','Đã đo lại'][+v-1];a.evidence=ev;save();render()})}
function valid(x){if(!x||x.kind!=='pcasing'||x.version!==1||typeof x.company!=='string'||!x.notes||!['points','feedback','readings','actions','history'].every(k=>Array.isArray(x[k])&&x[k].length<=30000))return false;const ids=new Set();for(const p of x.points){if(!p||typeof p.id!=='string'||ids.has(p.id)||!targets.includes(p.target)||!layers.includes(p.layer)||!Array.isArray(p.senses))return false;ids.add(p.id)}for(const r of x.feedback){const p=x.points.find(p=>p.id===r?.point);if(!r||!p||p.target==='D'||typeof r.respondent!=='string'||typeof r.batch!=='string')return false;for(const k of ['p','f','e','x'])if(!blank(r[k])&&(!Number.isInteger(+r[k])||+r[k]<1||+r[k]>10))return false;}for(const r of x.readings){const p=x.points.find(p=>p.id===r?.point);if(!r||!p||p.target!=='D'||typeof r.date!=='string'||typeof r.created!=='string')return false;for(const k of ['value','numerator','denominator'])if(!blank(r[k])&&!Number.isFinite(Number(r[k])))return false;}if(x.actions.some(a=>!a||!ids.has(a.point))||x.history.some(h=>!h||typeof h!=='object'))return false;return true}
$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='P-CASING-MyBizCar-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async ev=>{try{const f=ev.target.files[0];if(!f)return;if(f.size>20000000)throw Error('Tệp quá 20 MB');const x=JSON.parse(await f.text());if(!valid(x))throw Error('Không đúng dữ liệu P-CASING 1.0');if(confirm('Nhập sẽ thay toàn bộ dữ liệu P-CASING. Bạn đã xuất bản sao lưu chưa?')){s=x;selected=x.points[0]?.id||'';edit=null;save();render()}}catch(err){alert('Không nhập: '+err.message)}ev.target.value=''};$('#report').onclick=report;render();
</script></body></html>

<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M-CASING · PFE · MyBizCar</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4ec;color:#173d3d;font:16px/1.6 system-ui}header{background:#173d3d;color:white;padding:18px 4%;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header span{flex:1}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;color:#173d3d;border:1px solid #bdcdc7;border-radius:10px;padding:9px 14px}button:hover,button.active{background:#d5ecdd}nav{display:flex;gap:8px;padding:16px 4%;flex-wrap:wrap;border-bottom:1px solid #d4ddd4}nav button{flex:1;min-width:140px;text-align:left}nav small{display:block;font-size:12px}main{max-width:1400px;margin:auto;padding:28px}h1{font-size:38px;line-height:1.2}h2{font-size:24px}article,.card{background:white;border:1px solid #d9dfd4;border-radius:18px;padding:24px;margin-bottom:20px;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}.wheels{display:grid;grid-template-columns:1fr 1fr;gap:22px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:block;font-weight:600;margin:12px 0}input:not([type=checkbox]),textarea,select{width:100%;padding:10px;border:1px solid #b6c9c2;border-radius:8px;color:inherit;background:#fcfdf8}textarea{min-height:85px;resize:vertical}small,.muted{font-size:13px;color:#5b7270}.tag{font-size:13px;background:#e6eee3;padding:4px 9px;border-radius:15px}.warn{padding:12px;background:#fff2d9;border-left:4px solid #c9922e;margin:9px 0}.conflict{background:#ffebe3;border-left-color:#bd5745}.wheel{width:100%;height:280px}.wheel [role=button]{cursor:pointer}.wheel [role=button]:focus{outline:none;stroke:#d18d26;stroke-width:4}fieldset{border:1px solid #d8e1d6;border-radius:12px;margin:18px 0;padding:18px;min-width:0}summary{cursor:pointer;font-weight:bold}details{margin:14px 0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border:1px solid #d5dfd8;padding:10px;text-align:left;vertical-align:top}.tablewrap{overflow:auto}.check{font-weight:400}#notice{display:none;position:fixed;bottom:18px;left:18px;background:#173d3d;color:white;padding:14px;border-radius:10px;max-width:90vw}footer{padding:20px 0}.danger{color:#aa4132}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:760px){main{padding:16px}.wheels,.grid{grid-template-columns:1fr}h1{font-size:30px}}@media print{header,nav,button,footer{display:none}article{break-inside:avoid}}
</style><body><header><b>MYBIZCAR / M-CASING</b><span>Lắng nghe trải nghiệm thị trường</span><button id="export">Xuất JSON</button><button id="import">Nhập JSON</button><button id="print">In báo cáo</button></header><nav></nav><main></main><input id="file" type="file" accept=".json" hidden><div id="notice" role="status"></div><script>const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID();
const steps=[['activate','A','Activate','Cùng khởi động'],['paradigm','P','Paradigm','Mô thức thực chiến'],['practise','P','Practise','Thực hành thiết kế'],['lens','L','Lens','Lăng kính học viên'],['improve','I','Improve','Cải tiến MyBizCar'],['extract','E','Extract','Rút ra bài học mang theo'],['resolve','R','Resolve','Cam kết hành động']];
const layers={PRODEX:'Sản phẩm / dịch vụ',SERVEX:'Phục vụ',COMMEX:'Truyền thông'},dimensions={P:'Perception · Nhận biết / hiểu',F:'Feel · Cảm xúc',E:'Evaluate · Đánh giá',X:'XENERGY · Năng lượng trải nghiệm'};
const examples=[['Thực phẩm','Mở bao bì','PRODEX','Thông tin nhãn có rõ ràng với anh/chị không?','rất khó hiểu','rất rõ ràng','Thông tin trên bao bì','Khảo sát sau mở bao bì, trước khi hỏi đánh giá hương vị'],['Phần mềm','Thiết lập lần đầu','PRODEX','Anh/chị cảm thấy tự tin đến mức nào khi thực hiện thiết lập?','rất thiếu tự tin','rất tự tin','Hướng dẫn từng bước','Hỏi sau tác vụ; ghi nhận người đã hoàn thành và người gặp khó khăn'],['Đào tạo','Nhận phản hồi bài tập','SERVEX','Phản hồi giúp anh/chị cải thiện bài làm đến mức nào?','hoàn toàn không hữu ích','rất hữu ích','Phản hồi cụ thể theo bài làm','Hỏi sau khi học viên có thời gian đọc phản hồi'],['Sản xuất B2B','Nhận hồ sơ lô hàng','COMMEX','Hồ sơ giúp anh/chị hiểu thông tin lô hàng đến mức nào?','hoàn toàn không rõ','rất rõ','Hồ sơ bàn giao rõ ràng','Hỏi người tiếp nhận thực tế; không thay thế phép thử kỹ thuật'],['Logistics','Thông báo giao trễ','COMMEX','Thông báo giúp anh/chị hiểu thời gian giao mới đến mức nào?','hoàn toàn không rõ','rất rõ','Thông báo cập nhật thời gian','Khảo sát sau thông báo, tách khỏi đánh giá toàn bộ chuyến giao'],['Bán lẻ','Đổi trả sản phẩm','SERVEX','Anh/chị cảm thấy được tôn trọng đến mức nào trong quá trình đổi trả?','hoàn toàn không được tôn trọng','rất được tôn trọng','Nhân viên giải thích và tiếp nhận yêu cầu','Hỏi cả hồ sơ được chấp thuận và bị từ chối'],['Du lịch','Nhận phòng','SERVEX','Quá trình nhận phòng thuận tiện đến mức nào?','rất bất tiện','rất thuận tiện','Hướng dẫn nhận phòng','Hỏi sau nhận phòng; ghi nhận thời điểm đông/vắng'],['Nội thất','Xem phương án bố trí','PRODEX','Phương án đáp ứng cách sử dụng không gian của anh/chị đến mức nào?','hoàn toàn không đáp ứng','đáp ứng rất tốt','Thiết kế theo hiện trạng','Hỏi người sử dụng, không chỉ người đặt mua'],['Bảo trì','Giải thích sau sửa chữa','COMMEX','Anh/chị hiểu hướng dẫn sử dụng sau sửa đến mức nào?','hoàn toàn không hiểu','rất rõ','Hướng dẫn bàn giao','Không suy chất lượng kỹ thuật từ điểm hiểu hướng dẫn'],['Nông nghiệp','Tư vấn sử dụng vật tư','SERVEX','Anh/chị hiểu cách sử dụng được hướng dẫn đến mức nào?','hoàn toàn không hiểu','rất rõ','Tư vấn đúng bối cảnh canh tác','Không suy năng suất thực tế từ điểm tư vấn'],['Thương mại điện tử','Theo dõi đơn hàng','COMMEX','Thông tin giúp anh/chị hiểu trạng thái đơn hàng đến mức nào?','hoàn toàn không rõ','rất rõ','Cập nhật trạng thái đơn','Hỏi sau lần tra cứu; tách nhóm đơn bình thường và có sự cố'],['Tư vấn','Bàn giao khuyến nghị','PRODEX','Khuyến nghị phù hợp nguồn lực đơn vị đến mức nào?','hoàn toàn không phù hợp','rất phù hợp','Khuyến nghị theo bối cảnh','Hỏi đầu mối triển khai, ghi rõ chưa triển khai hay đã thử']];
const workbookKeys=['concern','goal','self','peer','limits','lesson','application','action','owner','due','proof'];
const fresh=()=>({kind:'mcasing',version:1,company:'',product:'',points:[],measures:[],responses:[],workbook:Object.fromEntries(workbookKeys.map(k=>[k,'']))});
const newPoint=()=>({id:id(),name:'',layer:'PRODEX',uc:'',condition:'',source:'',change:'',owner:'',due:''});
const newMeasure=point=>({id:id(),point,dimension:'P',question:'',low:'',high:'',audience:'',timing:'',channel:'',sampling:'',limit:'',owner:'',target:'',threshold:'',reason:''});
let state=fresh(),tab='activate',part='points',selected='',mode='own',filter='';const KEY='mybizcar-mcasing-1';const num=x=>Number.isInteger(x)&&x>=1&&x<=10;
function validate(s){const str=x=>typeof x==='string'&&x.length<30001;if(!s||s.kind!=='mcasing'||s.version!==1||!Array.isArray(s.points)||!Array.isArray(s.measures)||!Array.isArray(s.responses)||s.points.length>500||s.measures.length>2000||s.responses.length>15000)throw Error('Không đúng hồ sơ M-CASING 1.0');for(const k of ['company','product'])if(!str(s[k]))throw Error('Thiếu bối cảnh');for(const k of workbookKeys)if(!str(s.workbook?.[k]))throw Error('Thiếu APPLIER');const ids=new Set,qs=new Set,rs=new Set,dups=new Set;for(const p of s.points){if(!str(p.id)||ids.has(p.id)||!layers[p.layer])throw Error('Điểm không hợp lệ');ids.add(p.id);for(const k of ['name','uc','condition','source','change','owner','due'])if(!str(p[k]))throw Error('Điểm thiếu trường')}for(const m of s.measures){if(!str(m.id)||qs.has(m.id)||!ids.has(m.point)||!dimensions[m.dimension])throw Error('Phép đo mất liên kết');qs.add(m.id);for(const k of ['question','low','high','audience','timing','channel','sampling','limit','owner','target','threshold','reason'])if(!str(m[k]))throw Error('Phép đo thiếu trường');for(const k of ['target','threshold'])if(m[k]!==''&&!num(Number(m[k])))throw Error('Ngưỡng phải nguyên 1–10 hoặc trống')}for(const r of s.responses){if(!str(r.id)||rs.has(r.id)||!qs.has(r.measure)||!['score','na','qualitative'].includes(r.type)||r.type==='score'&&!num(r.score)||r.type!=='score'&&r.score!==null)throw Error('Phản hồi / điểm không hợp lệ');rs.add(r.id);for(const k of ['date','source','respondent','text','batch','context'])if(!str(r[k]))throw Error('Phản hồi thiếu trường');if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||!r.source.trim()||!r.respondent.trim()||!r.batch.trim())throw Error('Thiếu ngày/nguồn/mã người/lượt trải nghiệm');const key=[r.measure,r.respondent,r.batch].join('|');if(dups.has(key))throw Error('Trùng phản hồi cùng phép đo/người/lượt');dups.add(key)}return s}
try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw))}catch{setTimeout(()=>notice('Hồ sơ cũ không đọc được; chưa ghi đè. Giữ bản JSON dự phòng.'),100)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notice('Không lưu được. Hãy xuất JSON.')}}function notice(t){$('#notice').textContent=t;$('#notice').style.display='block';setTimeout(()=>$('#notice').style.display='none',5000)}const opts=(o,v)=>Object.entries(o).map(([k,l])=>`<option value="${esc(k)}" ${v===k?'selected':''}>${esc(l)}</option>`).join('');
function field(l,path,v,type='textarea'){return `<label>${esc(l)}${type==='textarea'?`<textarea data-field="${path}">${esc(v)}</textarea>`:`<input data-field="${path}" type="${type}" ${type==='number'?'min="1" max="10" step="1"':''} value="${esc(v)}">`}</label>`}const wb=(l,k)=>field(l,'workbook.'+k,state.workbook[k]);
function stats(m){const all=state.responses.filter(r=>r.measure===m.id),scored=all.filter(r=>r.type==='score'),counts=Array.from({length:10},(_,i)=>scored.filter(r=>r.score===i+1).length);return {all,scored,counts,n:scored.length,na:all.filter(r=>r.type==='na').length,qual:all.filter(r=>r.type==='qualitative').length,people:new Set(scored.map(r=>r.respondent)).size}}
function flag(m){const s=stats(m);if(!s.n)return ['#9aaba9','Chưa có điểm'];if(m.dimension==='X'){if(s.scored.some(r=>r.score<=5))return ['#d36e4a','Có phản hồi Vùng Đau'];if(s.scored.some(r=>r.score<=8))return ['#d9a847','Có phản hồi Vùng Đợi'];return ['#389789','Các điểm hiện có ở Vùng Đã']}if(m.threshold!==''&&s.scored.some(r=>r.score<Number(m.threshold)))return ['#d36e4a','Có điểm dưới ngưỡng tự đặt'];return ['#548fa7','Có dữ liệu — cần đối chiếu']}
function wheel(){return `<svg class="wheel" viewBox="0 0 440 310" role="img" aria-label="Ba lớp vỏ và các điểm phản hồi"><circle cx="220" cy="152" r="130" fill="none" stroke="#5d8fa3" stroke-width="26"/><circle cx="220" cy="152" r="98" fill="none" stroke="#d4ac62" stroke-width="25"/><circle cx="220" cy="152" r="67" fill="none" stroke="#6aab96" stroke-width="24"/><text x="220" y="148" text-anchor="middle" font-weight="bold" fill="#173d3d">M-CASING</text><text x="220" y="169" text-anchor="middle" fill="#173d3d">P · F · E</text>${state.points.slice(0,24).map((p,i)=>{const r={PRODEX:67,SERVEX:98,COMMEX:130}[p.layer],a=i*2*Math.PI/Math.min(state.points.length,24)-Math.PI/2,ms=state.measures.filter(m=>m.point===p.id),color=ms.some(m=>flag(m)[0]==='#d36e4a')?'#d36e4a':ms.some(m=>stats(m).n)?'#548fa7':'#a2afad';return `<circle cx="${220+Math.cos(a)*r}" cy="${152+Math.sin(a)*r}" r="9" fill="${color}" stroke="white" stroke-width="2"><title>${esc(p.name)}</title></circle>`}).join('')}</svg><p class="muted">Trong → ngoài: PRODEX · SERVEX · COMMEX. Tối đa 24 dấu trên hình; xMAP giữ mọi điểm. Xám: chưa có điểm. Xanh: có dữ liệu. Cam: có phản hồi cần xem xét, không kết luận toàn bộ trải nghiệm kém.</p>`}
function activate(){return `<h1>Từ điều kiện thiết kế đến phản hồi thực</h1><div class="grid"><article>${field('Doanh nghiệp','company',state.company,'text')}${field('Sản phẩm / thương hiệu','product',state.product,'text')}${wb('Điểm trải nghiệm cần lắng nghe','concern')}${wb('Quyết định muốn có dữ liệu hỗ trợ','goal')}</article><article>${wheel()}<p>V-CASING ghi điều doanh nghiệp thiết kế. M-CASING ghi phản hồi có nguồn; cảm nhận từng khách không phải chứng nhận khách quan về chất lượng kỹ thuật.</p></article></div>`}
function paradigm(){return `<h1>PFE · Chuẩn thiết kế phép đo</h1><article class="tablewrap"><table><tr><th>Chiều</th><th>Đo điều gì</th><th>Tránh</th></tr><tr><td>P · Perception</td><td>Nhận biết, hiểu, nhìn nhận một nội dung cụ thể</td><td>Gộp rõ ràng, uy tín và tiện lợi vào một câu</td></tr><tr><td>F · Feel</td><td>Một cảm xúc cụ thể trong tình huống</td><td>Suy cảm xúc thay khách; câu hỏi dẫn dắt</td></tr><tr><td>E · Evaluate</td><td>Đánh giá theo một tiêu chí / kỳ vọng xác định</td><td>Đồng nhất hài lòng với chất lượng kỹ thuật</td></tr></table><p>Đây là tiêu chí thiết kế nội bộ, chưa phải thang đo kiểm định cho mọi ngành. Mỗi câu hỏi có hai đầu 1–10 rõ nghĩa; điểm cao theo hướng thuận lợi. Cho phép không áp dụng hoặc chưa trải nghiệm.</p></article><article><h2>Bảy bước thu dữ liệu</h2><ol><li>Chọn điều kiện V-CASING cần kiểm tra.</li><li>Chọn EncounterPoint, UC và bối cảnh.</li><li>Đặt một câu hỏi cho một nội dung, thử hỏi trước.</li><li>Chọn thời điểm, kênh và cách lấy mẫu.</li><li>Ghi nguồn, ngày, mã người ẩn danh và lượt trải nghiệm; kiểm tra trùng.</li><li>Đọc phân bố, số mẫu và giới hạn; không suy rộng quá phạm vi.</li><li>Cải tiến rồi đo lại với câu hỏi/phạm vi có thể so sánh.</li></ol><p><b>XENERGY riêng:</b> 1–5 Vùng Đau; 6–8 Vùng Đợi; 9–10 Vùng Đã. Không lấy trung bình P/F/E thành XENERGY, không đổi lời bình thành số.</p></article><h2>12 ví dụ theo ngành</h2><p>Mẫu thiết kế mô phỏng, không chứa phản hồi thị trường. Có thể thêm nhiều phép đo P/F/E riêng tại một điểm.</p><div class="grid">${examples.map((e,i)=>`<article><span class="tag">${e[0]} · ${e[2]}</span><h3>${e[1]}</h3><p>${e[3]}</p><p>1 = ${e[4]} · 10 = ${e[5]}</p><p>${e[7]}</p><button data-example="${i}">Dùng mẫu thiết kế</button></article>`).join('')}</div>`}
function pointEditor(){return `<article><button data-action="vcasing">Nhập các điểm từ V-CASING</button> <button data-action="point">＋ EncounterPoint riêng</button><p>Nhập bản sao điều kiện, UC và lớp vỏ. Không nhập phản hồi hay điểm mục tiêu thành dữ liệu thực.</p></article>${state.points.map((p,i)=>`<article>${field('Tên EncounterPoint',`p.${i}.name`,p.name,'text')}<label>Lớp vỏ<select data-point="${i}">${opts(layers,p.layer)}</select></label>${field('UC / Address / nhóm khách',`p.${i}.uc`,p.uc)}${field('Điều kiện V-CASING cần kiểm tra',`p.${i}.condition`,p.condition)}<p class="muted">Nguồn: ${esc(p.source||'Tạo thủ công')}</p><button data-newmeasure="${esc(p.id)}">＋ Phép đo tại điểm này</button> <button data-deletepoint="${esc(p.id)}" class="danger">Xóa điểm và dữ liệu liên quan…</button></article>`).join('')}`}
function measureEditor(){return `<p>Một phép đo giữ nguyên câu hỏi khi đã có phản hồi. Muốn đổi câu hỏi/đầu thang, hãy tạo phiên bản mới để tránh trộn dữ liệu.</p>${state.measures.map((m,i)=>{const locked=state.responses.some(r=>r.measure===m.id);return `<article><h2>${esc(state.points.find(p=>p.id===m.point)?.name)}</h2><p class="muted">Mã phép đo: ${esc(m.id)}${locked?' · Đã có phản hồi, thiết kế được khóa':''}</p><fieldset ${locked?'disabled':''}><label>Chiều<select data-dimension="${i}">${opts(dimensions,m.dimension)}</select></label>${[['question','Câu hỏi nguyên văn'],['low','Ý nghĩa điểm 1'],['high','Ý nghĩa điểm 10'],['audience','Ai đủ điều kiện trả lời?'],['timing','Hỏi lúc nào, sau trải nghiệm nào?'],['channel','Nguồn / kênh thu thập dự kiến'],['sampling','Cách chọn mẫu và phạm vi'],['limit','Nguy cơ lệch mẫu / giới hạn'],['owner','Người phụ trách'],['reason','Lý do chọn ngưỡng (nếu có)']].map(([k,l])=>field(l,`m.${i}.${k}`,m[k])).join('')}${field('Mục tiêu thiết kế riêng, không phải điểm thực',`m.${i}.target`,m.target,'number')}${field('Cảnh báo PFE nếu điểm thấp hơn ngưỡng này; để trống nếu chưa chốt',`m.${i}.threshold`,m.threshold,'number')}</fieldset><button data-clone="${esc(m.id)}">Tạo phiên bản mới</button></article>`}).join('')||'<article>Thêm EncounterPoint rồi tạo phép đo.</article>'}`}
function feedback(){const m=state.measures.find(q=>q.id===selected)||state.measures[0];return !m?'<article>Thiết kế phép đo trước khi thu phản hồi.</article>':`<article><h2>Ghi phản hồi từ thị trường</h2><label>Phép đo<select id="measureSelect">${state.measures.map(q=>`<option value="${esc(q.id)}" ${q===m?'selected':''}>${esc(state.points.find(p=>p.id===q.point)?.name)} · ${q.dimension} · ${esc(q.question||'Chưa có câu hỏi')}</option>`).join('')}</select></label><p><b>${esc(m.question)}</b></p><p>1 = ${esc(m.low)} · 10 = ${esc(m.high)}</p><form id="response"><label>Loại phản hồi<select name="type" id="responseType"><option value="score">Điểm khách trả lời trực tiếp</option><option value="na">Không áp dụng / chưa trải nghiệm</option><option value="qualitative">Chỉ có nhận xét, không có điểm</option></select></label><label>Điểm nguyên 1–10<input name="score" type="number" min="1" max="10" step="1" required></label><div class="grid">${[['date','Ngày phản hồi','date'],['source','Nguồn / kênh thực tế','text'],['respondent','Mã người ẩn danh','text'],['batch','Mã lượt trải nghiệm / đợt đo','text']].map(([k,l,t])=>`<label>${l}<input name="${k}" type="${t}" required></label>`).join('')}</div><label>UC / Address / bối cảnh thực tế<input name="context"></label><label>Nhận xét nguyên văn / lý do không áp dụng<textarea name="text"></textarea></label><button>Ghi phản hồi</button></form><p class="muted">Không nhập tên, số điện thoại hoặc thông tin nhạy cảm. Cùng phép đo + mã người + lượt trải nghiệm được coi là trùng.</p></article><article><h2>Phản hồi đã lưu</h2>${state.responses.filter(r=>r.measure===m.id).map(r=>`<div><p><b>${r.type==='score'?r.score+'/10':r.type==='na'?'Không áp dụng':'Định tính'}</b> · ${esc(r.date)} · ${esc(r.source)} · ${esc(r.respondent)} / ${esc(r.batch)}</p><p>${esc(r.text)}</p><small>${esc(r.context)}</small> <button data-deleteresponse="${esc(r.id)}">Xóa…</button></div>`).join('')||'Chưa có phản hồi.'}</article>`}
function measureCard(m){const s=stats(m),f=flag(m);return `<div class="card"><h3>${m.dimension} · ${esc(m.question||'Chưa đặt câu hỏi')}</h3><p style="color:${f[0]}">${f[1]}</p><p>Mục tiêu: ${esc(m.target||'chưa đặt')} · ${s.n} điểm / ${s.people} mã người · ${s.na} không áp dụng · ${s.qual} định tính</p><div class="tablewrap"><table><tr><th>Điểm</th>${s.counts.map((_,i)=>`<th>${i+1}</th>`).join('')}</tr><tr><td>Số lượt</td>${s.counts.map(n=>`<td>${n}</td>`).join('')}</tr></table></div>${m.dimension==='X'?`<p>Đau: ${s.scored.filter(r=>r.score<=5).length} · Đợi: ${s.scored.filter(r=>r.score>=6&&r.score<=8).length} · Đã: ${s.scored.filter(r=>r.score>=9).length}</p>`:''}<details><summary>Phạm vi và nguồn dữ liệu</summary><p>Đối tượng dự kiến: ${esc(m.audience)} · Cách lấy mẫu: ${esc(m.sampling)}</p><p>Giới hạn: ${esc(m.limit||'Chưa khai báo')}</p><p>Kênh thực tế: ${esc([...new Set(s.all.map(r=>r.source))].join(', ')||'chưa có')}</p><p>Đợt: ${esc([...new Set(s.all.map(r=>r.batch))].join(', ')||'chưa có')}</p><p>Đang gộp các phản hồi của đúng mã phép đo này; khác bối cảnh có thể không so sánh được. Không suy tính đại diện từ số mẫu.</p></details><button data-collect="${esc(m.id)}">Xem / thêm phản hồi</button></div>`}
function map(){return `<div class="grid"><article>${wheel()}</article><article><h2>xMAP · Phản hồi theo lớp vỏ</h2><p>Không gộp P/F/E, không tự quy đổi XENERGY, không tự suy điểm từ bình luận. Hình vỏ xe cảnh báo điểm cần xem xét, không tô xanh toàn bộ khi dữ liệu còn thiếu.</p><label>Lớp<select id="layerFilter"><option value="">Tất cả</option>${opts(layers,filter)}</select></label></article></div>${Object.keys(layers).filter(l=>!filter||l===filter).map(l=>`<h2>${l} · ${layers[l]}</h2>${state.points.filter(p=>p.layer===l).map(p=>`<article><h2>${esc(p.name)}</h2><p><b>V-CASING:</b> ${esc(p.condition||'Chưa ghi điều kiện')}</p><p><b>UC:</b> ${esc(p.uc||'Chưa xác định')}</p>${state.measures.filter(m=>m.point===p.id).map(measureCard).join('')||'<p>Chưa có phép đo — chưa thể đánh giá.</p>'}</article>`).join('')||'<p>Chưa có điểm.</p>'}`).join('')}`}
function practise(){return `<h1>Thiết kế và thu phản hồi</h1><div class="row">${Object.entries({points:'1 · Nối V-CASING',measures:'2 · Thiết kế phép đo',feedback:'3 · Ghi phản hồi',map:'4 · xMAP'}).map(([k,l])=>`<button data-part="${k}" class="${part===k?'active':''}">${l}</button>`).join('')}</div><br>${({points:pointEditor,measures:measureEditor,feedback,map}[part])()}`}
function lens(){return `<h1>Lăng kính học viên</h1><article>${wb('Câu hỏi có đo đúng trải nghiệm và tránh dẫn dắt không?','self')}${wb('Góc nhìn và phản biện của học viên khác','peer')}${wb('Phạm vi mẫu, dữ liệu còn thiếu và giới hạn kết luận','limits')}</article><article><h2>Điểm cần rà soát</h2>${state.measures.map(m=>{const missing=['question','low','high','audience','timing','sampling','owner'].filter(k=>!m[k].trim());return `<p>${esc(m.question||m.id)}: ${missing.length?'Chưa đủ thiết kế ('+missing.join(', ')+')':'Đủ trường cơ bản; chưa xác nhận độ tin cậy thang đo.'} ${stats(m).n?'':'Chưa có điểm thực.'}</p>`}).join('')||'Chưa có phép đo.'}<p>Hỏi người có trải nghiệm, kiểm tra nhóm không phản hồi, tách thay đổi câu hỏi khỏi thay đổi trải nghiệm. Điểm cao không chứng minh an toàn hay chất lượng kỹ thuật.</p></article>`}
function improve(){return `<h1>Cải tiến vỏ trải nghiệm</h1><p>Phản hồi: ${esc(state.workbook.peer||'Chưa ghi nhận phản biện.')}</p>${state.points.map((p,i)=>`<article><h2>${esc(p.name)}</h2><p>Điều kiện đang thiết kế: ${esc(p.condition)}</p>${state.measures.filter(m=>m.point===p.id).map(m=>`<p>${m.dimension}: ${flag(m)[1]} · ${stats(m).n} điểm</p>`).join('')}${field('Điều kiện V-CASING cần sửa; lý do; cách đo lại','p.'+i+'.change',p.change)}${field('Người phụ trách','p.'+i+'.owner',p.owner,'text')}${field('Thời hạn','p.'+i+'.due',p.due,'date')}</article>`).join('')||'<article>Chưa có EncounterPoint.</article>'}<p>Không tự đồng bộ ngược sang V-CASING. Điểm thay đổi chưa tự chứng minh quan hệ nhân quả.</p>`}
function extract(){return `<h1>Rút ra bài học mang theo</h1><article>${wb('Tôi học được gì về phản hồi và suy diễn?','lesson')}${wb('Áp dụng trong sản phẩm / bộ phận nào?','application')}</article>`}
function resolve(){return `<h1>Cam kết hành động</h1><article>${wb('Việc thu thập hoặc cải tiến sẽ làm','action')}${wb('Người phụ trách và phối hợp','owner')}${field('Thời hạn','workbook.due',state.workbook.due,'date')}${wb('Bằng chứng mang về, tiêu chí xem xét, điều kiện đo lại','proof')}</article>`}
function render(){const i=steps.findIndex(s=>s[0]===tab);$('nav').innerHTML=steps.map(([k,l,en,vi])=>`<button data-tab="${k}" class="${tab===k?'active':''}"><b>${l} · ${en}</b><small>${vi}</small></button>`).join('');$('main').innerHTML=({activate,paradigm,practise,lens,improve,extract,resolve}[tab])()+`<footer class="row">${i?`<button data-tab="${steps[i-1][0]}">← ${steps[i-1][2]}</button>`:''}<small>APPLIER ${i+1}/7 · Dữ liệu lưu tại trình duyệt</small>${i<6?`<button data-tab="${steps[i+1][0]}">${steps[i+1][2]} →</button>`:''}</footer>`;bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=e.dataset.tab;render()});document.querySelectorAll('[data-part]').forEach(e=>e.onclick=()=>{part=e.dataset.part;render()});document.querySelectorAll('[data-field]').forEach(e=>e.oninput=()=>{if(e.type==='number'&&e.value!==''&&!num(Number(e.value))){e.setCustomValidity('Số nguyên 1–10');return}e.setCustomValidity('');let keys=e.dataset.field.split('.'),o=state;if(['p','m'].includes(keys[0]))o=state[keys.shift()==='p'?'points':'measures'][+keys.shift()];while(keys.length>1)o=o[keys.shift()];o[keys[0]]=e.value;save()});document.querySelectorAll('[data-point]').forEach(e=>e.onchange=()=>{state.points[+e.dataset.point].layer=e.value;save()});document.querySelectorAll('[data-dimension]').forEach(e=>e.onchange=()=>{state.measures[+e.dataset.dimension].dimension=e.value;save()});document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>{if(e.dataset.action==='vcasing'){mode='vcasing';$('#file').click()}else{state.points.push(newPoint());save();render()}});document.querySelectorAll('[data-newmeasure]').forEach(e=>e.onclick=()=>{state.measures.push(newMeasure(e.dataset.newmeasure));part='measures';save();render()});document.querySelectorAll('[data-clone]').forEach(e=>e.onclick=()=>{const old=state.measures.find(m=>m.id===e.dataset.clone);state.measures.push({...old,id:id(),question:old.question+' [phiên bản mới]'});save();render()});document.querySelectorAll('[data-deletepoint]').forEach(e=>e.onclick=()=>{if(!confirm('Xóa điểm, các phép đo và toàn bộ phản hồi liên quan? Chỉ khôi phục từ JSON đã xuất.'))return;const ids=state.measures.filter(m=>m.point===e.dataset.deletepoint).map(m=>m.id);state.responses=state.responses.filter(r=>!ids.includes(r.measure));state.measures=state.measures.filter(m=>m.point!==e.dataset.deletepoint);state.points=state.points.filter(p=>p.id!==e.dataset.deletepoint);save();render()});document.querySelectorAll('[data-deleteresponse]').forEach(e=>e.onclick=()=>{if(confirm('Xóa phản hồi? Khôi phục bằng JSON đã xuất.')){state.responses=state.responses.filter(r=>r.id!==e.dataset.deleteresponse);save();render()}});document.querySelectorAll('[data-collect]').forEach(e=>e.onclick=()=>{selected=e.dataset.collect;part='feedback';render()});document.querySelectorAll('[data-example]').forEach(e=>e.onclick=()=>{const i=+e.dataset.example,x=examples[i],p=newPoint();p.name=x[1];p.layer=x[2];p.condition=x[6];p.source='Mẫu minh họa — cần cá nhân hóa';state.points.push(p);const m=newMeasure(p.id);m.dimension=[1,5].includes(i)?'F':[2,6,7,11].includes(i)?'E':'P';m.question=x[3];m.low=x[4];m.high=x[5];m.timing=x[7];state.measures.push(m);tab='practise';part='measures';save();render()});if($('#layerFilter'))$('#layerFilter').onchange=e=>{filter=e.target.value;render()};if($('#measureSelect'))$('#measureSelect').onchange=e=>{selected=e.target.value;render()};if($('#responseType'))$('#responseType').onchange=e=>{const input=$('[name=score]');input.required=e.target.value==='score';input.disabled=e.target.value!=='score';if(input.disabled)input.value=''};if($('#response'))$('#response').onsubmit=e=>{e.preventDefault();const m=state.measures.find(m=>m.id===selected)||state.measures[0];if(!m.question.trim()||!m.low.trim()||!m.high.trim()){notice('Cần câu hỏi và hai đầu thang trước khi thu dữ liệu.');return}const f=Object.fromEntries(new FormData(e.target)),r={id:id(),measure:m.id,...f,score:f.type==='score'?Number(f.score):null};try{validate({...state,responses:[...state.responses,r]});state.responses.push(r);save();render();notice('Đã ghi phản hồi. Thiết kế phép đo được khóa.')}catch(err){notice(err.message)}}}
$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='M-CASING-ho-so.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#import').onclick=()=>{mode='own';$('#file').click()};$('#file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>10e6)throw Error('Tối đa 10 MB');const s=JSON.parse(await f.text());if(mode==='own'){validate(s);if(!confirm('Thay toàn bộ hồ sơ? Xuất JSON dự phòng trước nếu cần.'))return;state=s;selected=''}else{if(s.kind!=='vcasing'||!Array.isArray(s.points)||s.points.length>500)throw Error('Cần JSON V-CASING');const list=s.points.map(p=>{if(typeof p.id!=='string'||typeof p.name!=='string'||typeof p.condition!=='string'||typeof p.uc!=='string'||!layers[p.layer])throw Error('Điểm nguồn không hợp lệ');return {...newPoint(),id:'v-'+p.id,name:p.name,condition:p.condition,uc:p.uc,layer:p.layer,source:'V-CASING · '+p.id}});for(const p of list)if(!state.points.some(x=>x.id===p.id))state.points.push(p)}save();render();notice('Đã nhập bản sao; không tự đồng bộ.')}catch(err){notice('Không nhập: '+err.message)}finally{e.target.value=''}};
$('#print').onclick=()=>{const w=window.open('','_blank');if(!w){notice('Cho phép cửa sổ bật lên để in.');return}w.document.write('<!doctype html><meta charset="utf-8"><title>M-CASING Báo cáo</title><style>body{font:14px/1.6 system-ui;margin:35px}table{border-collapse:collapse}td,th{border:1px solid #aaa;padding:6px}button,svg{display:none}article{break-inside:avoid}p{overflow-wrap:anywhere}</style><h1>M-CASING · PFE · xMAP</h1><p>'+esc(state.company)+' · '+esc(state.product)+'</p>'+map()+'<h2>Cải tiến</h2>'+state.points.map(p=>'<p><b>'+esc(p.name)+'</b>: '+esc(p.change)+' · '+esc(p.owner)+' · '+esc(p.due)+'</p>').join(''));w.document.close();w.focus();w.print()};render();
</script></body></html>

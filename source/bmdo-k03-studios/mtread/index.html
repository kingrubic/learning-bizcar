<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M-TREAD · GRIP</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4ec;color:#173d3d;font:16px/1.6 system-ui}header{background:#173d3d;color:white;padding:18px 4%;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header span{flex:1}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;color:#173d3d;border:1px solid #bdcdc7;border-radius:10px;padding:9px 14px}button:hover,button.active{background:#d5ecdd}nav{display:flex;gap:8px;padding:16px 4%;flex-wrap:wrap;border-bottom:1px solid #d4ddd4}nav button{flex:1;min-width:140px;text-align:left}nav small{display:block;font-size:12px}main{max-width:1400px;margin:auto;padding:28px}h1{font-size:38px;line-height:1.2}h2{font-size:24px}article,.card{background:white;border:1px solid #d9dfd4;border-radius:18px;padding:24px;margin-bottom:20px;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}.wheels{display:grid;grid-template-columns:1fr 1fr;gap:22px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:block;font-weight:600;margin:12px 0}input:not([type=checkbox]),textarea,select{width:100%;padding:10px;border:1px solid #b6c9c2;border-radius:8px;color:inherit;background:#fcfdf8}textarea{min-height:85px;resize:vertical}small,.muted{font-size:13px;color:#5b7270}.tag{font-size:13px;background:#e6eee3;padding:4px 9px;border-radius:15px}.warn{padding:12px;background:#fff2d9;border-left:4px solid #c9922e;margin:9px 0}.conflict{background:#ffebe3;border-left-color:#bd5745}.wheel{width:100%;height:280px}.wheel [role=button]{cursor:pointer}.wheel [role=button]:focus{outline:none;stroke:#d18d26;stroke-width:4}fieldset{border:1px solid #d8e1d6;border-radius:12px;margin:18px 0;padding:18px;min-width:0}summary{cursor:pointer;font-weight:bold}details{margin:14px 0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border:1px solid #d5dfd8;padding:10px;text-align:left;vertical-align:top}.tablewrap{overflow:auto}.check{font-weight:400}#notice{display:none;position:fixed;bottom:18px;left:18px;background:#173d3d;color:white;padding:14px;border-radius:10px;max-width:90vw}footer{padding:20px 0}.danger{color:#aa4132}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:760px){main{padding:16px}.wheels,.grid{grid-template-columns:1fr}h1{font-size:30px}}@media print{header,nav,button,footer{display:none}article{break-inside:avoid}}
</style><body><header><b>MYBIZCAR / M-TREAD</b><span>Bốn luồng bám thị trường · GRIP</span><button id="export">Xuất JSON</button><button id="import">Nhập JSON</button><button onclick="window.print()">In trang</button></header><nav></nav><main></main><input id="file" type="file" accept=".json" hidden><div id="notice" role="status"></div><script>const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID();
const steps=[['activate','A','Activate','Cùng khởi động'],['paradigm','P','Paradigm','Mô thức thực chiến'],['practise','P','Practise','Thực hành thiết kế'],['lens','L','Lens','Lăng kính học viên'],['improve','I','Improve','Cải tiến MyBizCar'],['extract','E','Extract','Rút ra bài học mang theo'],['resolve','R','Resolve','Cam kết hành động']];const grip={G:'Get Adoption · Mua mới',R:'Renew / Remain Buying · Tiếp tục mua',I:'Increase Buying · Mua tăng',P:'Prompt Advocacy · Giới thiệu / ủng hộ'};const addr={AH:'AH · Hộ gia đình',AR:'AR · Mua để bán lại',AP:'AP · Địa điểm công cộng',AC:'AC · Doanh nghiệp'};const wbKeys=['concern','goal','self','peer','action','owner','due','lesson','proof'];
const fresh=()=>({kind:'mtread',version:1,company:'',currency:'VND',previousStart:'',previousEnd:'',currentStart:'',currentEnd:'',coverage:'unknown',threshold:'20',addresses:[],orders:[],opportunities:[],workbook:Object.fromEntries(wbKeys.map(k=>[k,'']))});let state=fresh(),tab='activate',part='addresses',areaFilter='',addressFilter='',productFilter='';const KEY='mybizcar-mtread-1';
const dateOK=x=>/^\d{4}-\d{2}-\d{2}$/.test(x)&&!isNaN(Date.parse(x));const str=x=>typeof x==='string'&&x.length<20000;const money=x=>Number.isFinite(x)&&x>=0;
function validate(s){if(!s||s.kind!=='mtread'||s.version!==1||!Array.isArray(s.addresses)||!Array.isArray(s.orders)||!Array.isArray(s.opportunities)||s.orders.length>15000||s.opportunities.length>15000)throw Error('Không đúng hồ sơ M-TREAD 1.0');for(const k of ['company','currency','previousStart','previousEnd','currentStart','currentEnd','threshold'])if(!str(s[k]))throw Error('Thiếu cấu hình');if(!s.currency.trim()||!['unknown','complete'].includes(s.coverage)||s.threshold===''||!Number.isFinite(+s.threshold)||+s.threshold<=0||+s.threshold>100)throw Error('Cấu hình kỳ/ngưỡng không hợp lệ');for(const k of wbKeys)if(!str(s.workbook?.[k]))throw Error('Thiếu APPLIER');const ids=new Set;for(const a of s.addresses){if(!str(a.id)||ids.has(a.id)||!addr[a.type]||!Array.isArray(a.areas)||a.areas.length!==5)throw Error('Địa chỉ không hợp lệ');ids.add(a.id);for(const k of ['name','uc','owner','nextDue','basis'])if(!str(a[k]))throw Error('Thiếu địa chỉ');if(a.areas.some(x=>!str(x)))throw Error('Địa bàn không hợp lệ');if(a.nextDue&&!dateOK(a.nextDue))throw Error('Sai ngày đến kỳ')}const codes=new Set;for(const o of s.orders){if(!str(o.code)||!o.code.trim()||codes.has(o.code)||!ids.has(o.address)||!grip[o.axis]||!['draft','confirmed','recorded','cancelled'].includes(o.status)||!dateOK(o.date))throw Error('SO sai mã/địa chỉ/trạng thái/ngày');codes.add(o.code);for(const k of ['product','evidence','referral','bo'])if(!str(o[k]))throw Error('Thiếu SO');for(const k of ['amount','refund','cost'])if(!money(o[k]))throw Error('Số tiền không âm');if(o.refund>o.amount)throw Error('Hoàn trả vượt giá trị');if(o.axis==='P'&&!o.referral.trim())throw Error('Gai P cần nguồn giới thiệu');if(['G','R','I'].includes(o.axis)&&!o.evidence.trim())throw Error('SO cần căn cứ phân loại')}const bs=new Set;for(const o of s.opportunities){if(!str(o.code)||!o.code.trim()||bs.has(o.code)||!ids.has(o.address)||!grip[o.axis]||!['open','won','lost'].includes(o.status)||!dateOK(o.date)||!money(o.amount)||!str(o.product)||!str(o.source))throw Error('BO không hợp lệ');bs.add(o.code)}for(const o of s.orders)if(o.bo&&!bs.has(o.bo))throw Error('BO liên kết không tồn tại');return s}
try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw))}catch{setTimeout(()=>notice('Không đọc được hồ sơ lưu. Chưa ghi đè dữ liệu cũ.'),100)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notice('Không lưu được. Hãy xuất JSON.')}}function notice(t){$('#notice').textContent=t;$('#notice').style.display='block';setTimeout(()=>$('#notice').style.display='none',5000)}const opts=(o,v)=>Object.entries(o).map(([k,l])=>`<option value="${esc(k)}" ${k===v?'selected':''}>${esc(l)}</option>`).join('');
function field(l,p,v,type='textarea'){return `<label>${esc(l)}${type==='textarea'?`<textarea data-field="${p}">${esc(v)}</textarea>`:`<input data-field="${p}" value="${esc(v)}" type="${type}">`}</label>`}const wb=(l,k)=>field(l,'workbook.'+k,state.workbook[k]);const fmt=n=>n.toLocaleString('vi-VN',{maximumFractionDigits:2});
function periodValid(){let s=state;return [s.previousStart,s.previousEnd,s.currentStart,s.currentEnd].every(dateOK)&&s.previousStart<=s.previousEnd&&s.currentStart<=s.currentEnd&&s.previousEnd<s.currentStart&&(Date.parse(s.previousEnd)-Date.parse(s.previousStart))===(Date.parse(s.currentEnd)-Date.parse(s.currentStart))}
function included(a){return (!addressFilter||a.id===addressFilter)&&(!areaFilter||a.areas.includes(areaFilter))}const inPeriod=(x,start,end)=>x.date>=start&&x.date<=end;
function metrics(axis,address=''){const belongs=o=>(!address||o.address===address)&&included(state.addresses.find(a=>a.id===o.address))&&(!productFilter||o.product===productFilter);const all=state.orders.filter(o=>o.axis===axis&&belongs(o)&&o.status==='recorded');const old=all.filter(o=>inPeriod(o,state.previousStart,state.previousEnd)),now=all.filter(o=>inPeriod(o,state.currentStart,state.currentEnd)),net=a=>a.reduce((s,o)=>s+o.amount-o.refund,0);const prev=net(old),value=net(now),change=prev>0?(value-prev)/prev*100:null;const comparable=periodValid()&&state.coverage==='complete';const status=!comparable||!prev?'unknown':change<=-Number(state.threshold)?'worn':change>=Number(state.threshold)?'up':'stable';const bos=state.opportunities.filter(o=>o.axis===axis&&belongs(o)&&inPeriod(o,state.currentStart,state.currentEnd));return {prev,value,change,status,count:now.length,cost:now.reduce((s,o)=>s+o.cost,0),bo:bos.filter(o=>o.status==='open'),won:bos.filter(o=>o.status==='won').length,lost:bos.filter(o=>o.status==='lost').length}}
const titles={unknown:'Chưa đủ cơ sở so sánh',worn:'Dòng doanh thu giảm',up:'Dòng doanh thu tăng',stable:'Trong biên biến động'};
function wheel(){return `<svg class="wheel" viewBox="0 0 520 300" role="img" aria-label="Bốn dải gai GRIP theo biến động dòng doanh thu"><ellipse cx="260" cy="270" rx="195" ry="14" fill="#173d3d18"/><rect x="58" y="60" width="405" height="198" rx="80" fill="#24454a"/>${Object.keys(grip).map((k,i)=>{const m=metrics(k),h={unknown:16,worn:12,stable:26,up:38}[m.status],color={unknown:'#92a4a5',worn:'#d47a51',stable:'#d4b267',up:'#57ac9a'}[m.status];return `<g role="button" tabindex="0" data-axis="${k}"><text x="${110+i*100}" y="42" text-anchor="middle" fill="#173d3d" font-size="22" font-weight="bold">${k}</text>${Array.from({length:5},(_,j)=>`<path d="M${77+i*100} ${83+j*32} l16 -${h} h43 l-16 ${h}z" fill="${color}" stroke="#ffffff77"/>`).join('')}</g>`}).join('')}</svg><p class="muted">Minh họa bốn dải gai, không phải đo độ bám vật lý. Chiều cao theo phân loại biến động doanh thu riêng từng gai; không so doanh thu tuyệt đối giữa các gai. Xám = chưa đủ cơ sở, không phải gai mòn. Tăng doanh thu chưa chứng minh khách gắn bó hơn.</p>`}
function activate(){return `<h1>Thị trường đang bám bằng gai nào?</h1><div class="grid"><article>${field('Doanh nghiệp','company',state.company,'text')}${field('Một đồng tiền cho toàn hồ sơ','currency',state.currency,'text')}${wb('Mối quan tâm về mua mới, mua lại, mua tăng, giới thiệu','concern')}${wb('Điều muốn làm rõ sau buổi học','goal')}</article><article>${wheel()}</article></div>`}
function paradigm(){return `<h1>GRIP · Bốn luồng bám</h1><div class="grid">${Object.entries(grip).map(([k,l])=>`<article><h2>${k} · ${l}</h2><p>${{G:'Khách bắt đầu mua. Dùng thử hoặc cơ hội chưa phải doanh thu.',R:'Gia hạn / tiếp tục mua theo chu kỳ phù hợp. Không đến kỳ chưa có nghĩa mất khách.',I:'Mua tăng so với mức nền: cần nêu tăng lượng, giá trị hay phạm vi; tăng giá chưa đủ chứng minh tăng độ bám.',P:'Giới thiệu có nguồn và đơn phát sinh. Lời giới thiệu chưa chuyển thành đơn chưa phải doanh thu.'}[k]}</p></article>`).join('')}</div><article><h2>Quy tắc không cộng trùng</h2><p>Mỗi SO có một gai chính do người học chọn và giải thích. Doanh thu thuần ghi nhận = giá trị ghi nhận − hoàn trả. Một SO chỉ vào một dòng tổng. Nguồn giới thiệu được lưu riêng dù gai chính là G/R/I; báo cáo nguồn giới thiệu không cộng thêm vào tổng GRIP.</p><p>R/I có thể giao nhau: chọn rõ mục đích phân tích. Trong bản đầu, SO gán I dùng toàn giá trị thuần của đơn, <b>không phải phần doanh thu tăng thêm</b>. Không có phân bổ tự động.</p><p>BO mở là giá trị cơ hội chưa trọng số, không cộng vào doanh thu. BO thắng vẫn chưa thành doanh thu nếu không có SO được ghi nhận. Các trạng thái do người dùng khai; không thay thế kế toán.</p></article><div class="grid">${[['Bánh mì que','Văn phòng mua lần đầu G; đặt lại R; tăng số suất I; giới thiệu đơn vị khác P.'],['Phần mềm','Mua mới G; gia hạn R; tăng người dùng hoặc gói I; khách giới thiệu khách mới P.'],['Sản xuất B2B','Đơn thử có trả tiền G; đơn lặp lại R; mở thêm nhóm linh kiện I; đối tác khách giới thiệu đơn vị khác P.'],['Đào tạo','Đơn vị đăng ký lần đầu G; đặt khóa tiếp theo R; tăng lớp/phạm vi I; đơn do giới thiệu P.'],['Bán lẻ','Mua lần đầu G; mua theo nhu cầu lặp R; tăng giỏ hàng I; đơn từ người giới thiệu P.'],['Bảo trì','Hợp đồng mới G; gia hạn R; mở rộng thiết bị I; giới thiệu khách khác P.']].map(([a,b])=>`<article><h3>${a}</h3><p>${b}</p><small>Tình huống minh họa; không tạo dữ liệu giao dịch giả.</small></article>`).join('')}</div>`}
function config(){return `<article><h2>Kỳ so sánh và độ đầy đủ</h2><p>Chỉ cảnh báo xu hướng khi hai kỳ không chồng lấn, cùng số ngày và bạn xác nhận dữ liệu đủ cả hai kỳ. Cần tự kiểm tra mùa vụ và thay đổi phạm vi.</p><div class="grid">${[['previousStart','Kỳ trước từ'],['previousEnd','Kỳ trước đến'],['currentStart','Kỳ hiện tại từ'],['currentEnd','Kỳ hiện tại đến']].map(([k,l])=>field(l,k,state[k],'date')).join('')}</div><label>Dữ liệu hai kỳ<select id="coverage">${opts({unknown:'Chưa xác nhận đầy đủ',complete:'Tôi xác nhận đã nhập đủ phạm vi hai kỳ'},state.coverage)}</select></label>${field('Ngưỡng biến động doanh thu (%) lớn hơn 0, tối đa 100','threshold',state.threshold,'number')}<p>Đây là ngưỡng cảnh báo quản trị tự đặt, không phải chuẩn ngành. ${periodValid()?'Hai kỳ hợp lệ về ngày.':'Chưa có hai kỳ hợp lệ, cùng độ dài.'}</p></article>`}
function addresses(){return `<article><h2>Địa chỉ và địa bàn</h2><button data-action="address">＋ Địa chỉ</button><p>Area A0–A4 là các nhãn địa bàn lồng nhau do doanh nghiệp khai báo; không có bản đồ địa lý tự động.</p></article>${state.addresses.map((a,i)=>`<article>${field('Tên / mã địa chỉ',`a.${i}.name`,a.name,'text')}<label>Loại<select data-address="${i}">${opts(addr,a.type)}</select></label>${field('UC và vai trò',`a.${i}.uc`,a.uc)}<div class="grid">${['A0 Quốc gia','A1 Tỉnh/thành','A2 Xã/phường','A3 Tổ/ấp','A4 Cụm'].map((l,j)=>field(l,`a.${i}.areas.${j}`,a.areas[j],'text')).join('')}</div>${field('Người phụ trách',`a.${i}.owner`,a.owner,'text')}${field('Ngày dự kiến cần mua lại (không bắt buộc)',`a.${i}.nextDue`,a.nextDue,'date')}${field('Căn cứ chu kỳ và phạm vi sản phẩm',`a.${i}.basis`,a.basis)}</article>`).join('')}`}
function entry(kind){if(!state.addresses.length)return '<article>Thêm Address trước khi nhập giao dịch.</article>';const so=kind==='SO';return `<article><h2>${so?'SO · Đơn hàng':'BO · Cơ hội'}</h2><form id="entry" data-kind="${kind}"><div class="grid"><label>Mã ${kind} duy nhất<input name="code" required></label><label>Address<select name="address">${opts(Object.fromEntries(state.addresses.map(a=>[a.id,a.name||a.id])),null)}</select></label><label>Ngày ${so?'ghi nhận / trạng thái':'tạo cơ hội'}<input name="date" type="date" required></label><label>Sản phẩm / dòng sản phẩm<input name="product" required></label><label>Gai chính<select name="axis">${opts(grip,'G')}</select></label><label>Trạng thái<select name="status">${opts(so?{draft:'Dự thảo',confirmed:'Đã xác nhận chưa ghi nhận',recorded:'Đã ghi nhận doanh thu',cancelled:'Đã hủy'}:{open:'Đang mở',won:'Đã thắng',lost:'Đã mất'},so?'draft':'open')}</select></label><label>Giá trị ${so?'doanh thu trước hoàn trả':'cơ hội'} (${esc(state.currency)})<input name="amount" type="number" min="0" step="any" required></label>${so?'<label>Hoàn trả / giảm trừ<input name="refund" type="number" min="0" step="any" value="0" required></label><label>Chi phí trực tiếp phân bổ cho đơn (không phải đầy đủ lợi nhuận)<input name="cost" type="number" min="0" step="any" value="0" required></label>':''}</div>${so?`<label>Căn cứ chọn gai (đặc biệt mức nền R/I)<textarea name="evidence"></textarea></label><label>Nguồn / mã giới thiệu (bắt buộc khi gai P)<input name="referral"></label><label>BO liên quan<select name="bo"><option value="">Không liên kết</option>${opts(Object.fromEntries(state.opportunities.map(o=>[o.code,o.code])),null)}</select></label>`:'<label>Nguồn cơ hội / giới thiệu<input name="source"></label>'}<button>Ghi ${kind}</button></form><p>Không nhập dữ liệu nhạy cảm. Cần chỉnh bản ghi: xuất dự phòng, xóa bản sai rồi nhập đúng mã.</p></article><article><h2>${kind} đã ghi</h2>${(so?state.orders:state.opportunities).map(o=>`<p><b>${esc(o.code)}</b> · ${o.axis} · ${esc(o.status)} · ${fmt(o.amount)} ${esc(state.currency)} · ${esc(o.date)} <button data-remove="${kind}:${esc(o.code)}">Xóa…</button></p>`).join('')||'Chưa có.'}</article>`}
function filters(){return `<div class="grid"><label>Area<select id="areaFilter"><option value="">Tất cả</option>${opts(Object.fromEntries([...new Set(state.addresses.flatMap(a=>a.areas).filter(Boolean))].map(x=>[x,x])),areaFilter)}</select></label><label>Address<select id="addressFilter"><option value="">Tất cả</option>${opts(Object.fromEntries(state.addresses.map(a=>[a.id,a.name||a.id])),addressFilter)}</select></label><label>Sản phẩm<select id="productFilter"><option value="">Tất cả</option>${opts(Object.fromEntries([...new Set([...state.orders,...state.opportunities].map(o=>o.product))].map(x=>[x,x])),productFilter)}</select></label></div>`}
function dashboard(){const ms=Object.keys(grip).map(k=>[k,metrics(k)]),scope=state.addresses.filter(included);return `${filters()}<div class="grid"><article>${wheel()}</article><article><h2>Doanh thu không cộng trùng</h2><h1>${fmt(ms.reduce((s,[,m])=>s+m.value,0))} ${esc(state.currency)}</h1><p>Chỉ SO đã ghi nhận trong kỳ hiện tại, trừ hoàn trả. Không gồm BO hoặc SO chưa ghi nhận.</p><p>Doanh thu có nguồn giới thiệu (góc nhìn chồng lấp, không cộng thêm): ${fmt(state.orders.filter(o=>o.status==='recorded'&&o.referral.trim()&&scope.some(a=>a.id===o.address)&&(!productFilter||o.product===productFilter)&&inPeriod(o,state.currentStart,state.currentEnd)).reduce((s,o)=>s+o.amount-o.refund,0))}</p><p>${periodValid()&&state.coverage==='complete'?'Đã khai đủ dữ liệu hai kỳ; cần tự xem mùa vụ.':'Chưa đủ điều kiện kết luận xu hướng.'}</p></article></div><div class="grid">${ms.map(([k,m])=>`<article id="axis-${k}"><h2>${grip[k]}</h2><p><b>${titles[m.status]}</b>${m.change!==null?' · '+m.change.toFixed(1)+'%':''}</p><p>Kỳ hiện tại: ${fmt(m.value)} · Kỳ trước: ${fmt(m.prev)} ${esc(state.currency)}</p><p>${m.count} SO ghi nhận · Chi phí trực tiếp đã nhập: ${fmt(m.cost)}</p><p>BO mở tạo trong kỳ: ${m.bo.length} · Giá trị chưa trọng số: ${fmt(m.bo.reduce((s,o)=>s+o.amount,0))}</p><p>BO tạo trong kỳ khai thắng: ${m.won} · khai mất: ${m.lost}</p><small>BO tính theo ngày tạo, trạng thái hiện tại; chưa có lịch sử chuyển giai đoạn. Chi phí chưa đầy đủ, không gọi là lợi nhuận.</small></article>`).join('')}</div><h2>Cảnh báo tại Address và Area</h2>${scope.map(a=>{const worn=Object.keys(grip).filter(k=>metrics(k,a.id).status==='worn');const due=state.coverage==='complete'&&dateOK(a.nextDue)&&a.nextDue>=state.currentStart&&a.nextDue<=state.currentEnd&&a.basis.trim()&&!state.orders.some(o=>o.address===a.id&&o.status==='recorded'&&o.date>=a.nextDue&&o.date<=state.currentEnd);return `<article><b>${esc(a.name)}</b> · ${esc(a.type)} · ${esc(a.areas.filter(Boolean).join(' → '))}<p>Phụ trách: ${esc(a.owner||'chưa có')}</p>${worn.length?`<div class="warn conflict">Dòng ${worn.join(', ')} giảm vượt ngưỡng. Đối chiếu SO, giá bán và chu kỳ trước khi kết luận nguyên nhân.</div>`:'<p>Không phát hiện giảm vượt ngưỡng theo quy tắc hiện có; không đồng nghĩa mọi gai mạnh.</p>'}${due?'<div class="warn">Đã đến ngày dự kiến nhưng chưa có SO ghi nhận từ ngày đó đến cuối kỳ. Cần kiểm tra, chưa kết luận mất khách. Cảnh báo này ở cấp Address, không theo bộ lọc sản phẩm.</div>':''}</article>`}).join('')||'<article>Chưa có địa chỉ trong phạm vi.</article>'}`}
function practise(){return `<h1>Thiết kế dữ liệu và soi gai thị trường</h1><div class="row">${Object.entries({addresses:'1 · Address–Area',config:'2 · Kỳ so sánh',BO:'3 · BO',SO:'4 · SO',dashboard:'5 · Bốn gai GRIP'}).map(([k,l])=>`<button data-part="${k}" class="${part===k?'active':''}">${l}</button>`).join('')}</div><br>${part==='addresses'?addresses():part==='config'?config():part==='dashboard'?dashboard():entry(part)}`}
function lens(){return `<h1>Lăng kính học viên</h1><article>${wb('Dòng nào đang thay đổi, dữ liệu nào làm căn cứ?','self')}${wb('Phản biện: mùa vụ, tăng giá, khách chưa đến kỳ, dữ liệu thiếu?','peer')}<ul><li>G tăng nhưng R giảm: kiểm tra mua mới có đang bù khách cũ không.</li><li>I tăng do lượng mua hay chỉ do giá? Bản đầu chưa tách giá và lượng.</li><li>P có đơn thực hay mới có cơ hội? Giới thiệu tự nhiên hay có thưởng?</li><li>Doanh thu tăng chưa tự chứng minh mức phù hợp hoặc sự tự nguyện gắn bó.</li></ul></article>`}
function improve(){return `<h1>Cải tiến MyBizCar</h1><article>${wb('Address/Area, gai cần cải tiến và việc phải kiểm chứng; liên hệ VBF, DFARS, kênh, trải nghiệm hoặc ARM','action')}${wb('Người phụ trách','owner')}${field('Thời hạn','workbook.due',state.workbook.due,'date')}<p>GRIP là biểu hiện độ bám; hoạt động can thiệp cần truy về nguyên nhân, không mặc định giảm doanh thu là do một bộ phận.</p></article>`}
function extract(){return `<h1>Rút ra bài học mang theo</h1><article>${wb('Bài học về cơ cấu độ bám và chất lượng dòng doanh thu','lesson')}</article>`}
function resolve(){return `<h1>Cam kết hành động</h1><article><p>${esc(state.workbook.action||'Chưa có hành động cải tiến')}</p>${wb('Tiêu chí, dữ liệu sẽ thu và thời điểm xem xét lại','proof')}${wb('Người chịu trách nhiệm','owner')}${field('Thời hạn','workbook.due',state.workbook.due,'date')}</article>`}
function render(){const i=steps.findIndex(s=>s[0]===tab);$('nav').innerHTML=steps.map(([k,l,en,vi])=>`<button data-tab="${k}" class="${tab===k?'active':''}"><b>${l} · ${en}</b><small>${vi}</small></button>`).join('');$('main').innerHTML=({activate,paradigm,practise,lens,improve,extract,resolve}[tab])()+`<footer class="row">${i?`<button data-tab="${steps[i-1][0]}">← ${steps[i-1][2]}</button>`:''}<small>APPLIER ${i+1}/7 · Xuất JSON thường xuyên</small>${i<6?`<button data-tab="${steps[i+1][0]}">${steps[i+1][2]} →</button>`:''}</footer>`;bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=e.dataset.tab;render()});document.querySelectorAll('[data-part]').forEach(e=>e.onclick=()=>{part=e.dataset.part;render()});document.querySelectorAll('[data-field]').forEach(e=>e.oninput=()=>{if(e.dataset.field==='threshold'&&(!Number.isFinite(+e.value)||+e.value<=0||+e.value>100)){e.setCustomValidity('Lớn hơn 0 và không quá 100');return}e.setCustomValidity('');let p=e.dataset.field.split('.'),o=state;if(p[0]==='a'){p.shift();o=state.addresses[+p.shift()]}while(p.length>1)o=o[p.shift()];o[p[0]]=e.value;save()});document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>{state.addresses.push({id:uid(),name:'',type:'AH',uc:'',areas:['','','','',''],owner:'',nextDue:'',basis:''});save();render()});document.querySelectorAll('[data-address]').forEach(e=>e.onchange=()=>{state.addresses[+e.dataset.address].type=e.value;save()});if($('#coverage'))$('#coverage').onchange=e=>{state.coverage=e.target.value;save();render()};for(const k of ['areaFilter','addressFilter','productFilter'])if($('#'+k))$('#'+k).onchange=e=>{if(k==='areaFilter')areaFilter=e.target.value;if(k==='addressFilter')addressFilter=e.target.value;if(k==='productFilter')productFilter=e.target.value;render()};document.querySelectorAll('[data-axis]').forEach(e=>{const f=()=>{tab='practise';part='dashboard';render();$('#axis-'+e.dataset.axis)?.scrollIntoView({behavior:'smooth'})};e.onclick=f;e.onkeydown=x=>{if(x.key==='Enter')f()}});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{let [kind,...rest]=e.dataset.remove.split(':'),code=rest.join(':');if(kind==='BO'&&state.orders.some(o=>o.bo===code)){notice('BO đang được SO tham chiếu; sửa liên kết trước.');return}if(confirm('Xóa bản ghi? Khôi phục bằng JSON đã xuất.')){let g=kind==='SO'?'orders':'opportunities';state[g]=state[g].filter(o=>o.code!==code);save();render()}});if($('#entry'))$('#entry').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target)),g=e.target.dataset.kind==='SO'?'orders':'opportunities';o.amount=Number(o.amount);if(g==='orders'){o.refund=Number(o.refund);o.cost=Number(o.cost)}try{validate({...state,[g]:[...state[g],o]});state[g].push(o);save();render();notice('Đã ghi dữ liệu.')}catch(err){notice(err.message)}}}
$('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='M-TREAD-ho-so.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>10e6)throw Error('Tối đa 10 MB');const s=validate(JSON.parse(await f.text()));if(!confirm('Thay hồ sơ hiện tại? Xuất JSON dự phòng trước nếu cần.'))return;state=s;areaFilter=addressFilter=productFilter='';save();render();notice('Đã nhập hồ sơ.')}catch(err){notice('Không nhập: '+err.message)}finally{e.target.value=''}};render();
</script></body></html>

<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M-AIR • MyBizCar</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4ec;color:#173d3d;font:16px/1.6 system-ui}header{background:#173d3d;color:white;padding:18px 4%;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header span{flex:1}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;color:#173d3d;border:1px solid #bdcdc7;border-radius:10px;padding:9px 14px}button:hover,button.active{background:#d5ecdd}nav{display:flex;gap:8px;padding:16px 4%;flex-wrap:wrap;border-bottom:1px solid #d4ddd4}nav button{flex:1;min-width:140px;text-align:left}nav small{display:block;font-size:12px}main{max-width:1400px;margin:auto;padding:28px}h1{font-size:38px;line-height:1.2}h2{font-size:24px}article,.card{background:white;border:1px solid #d9dfd4;border-radius:18px;padding:24px;margin-bottom:20px;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}.wheels{display:grid;grid-template-columns:1fr 1fr;gap:22px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:block;font-weight:600;margin:12px 0}input:not([type=checkbox]),textarea,select{width:100%;padding:10px;border:1px solid #b6c9c2;border-radius:8px;color:inherit;background:#fcfdf8}textarea{min-height:85px;resize:vertical}small,.muted{font-size:13px;color:#5b7270}.tag{font-size:13px;background:#e6eee3;padding:4px 9px;border-radius:15px}.warn{padding:12px;background:#fff2d9;border-left:4px solid #c9922e;margin:9px 0}.conflict{background:#ffebe3;border-left-color:#bd5745}.wheel{width:100%;height:280px}.wheel [role=button]{cursor:pointer}.wheel [role=button]:focus{outline:none;stroke:#d18d26;stroke-width:4}fieldset{border:1px solid #d8e1d6;border-radius:12px;margin:18px 0;padding:18px;min-width:0}summary{cursor:pointer;font-weight:bold}details{margin:14px 0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border:1px solid #d5dfd8;padding:10px;text-align:left;vertical-align:top}.tablewrap{overflow:auto}.check{font-weight:400}#notice{display:none;position:fixed;bottom:18px;left:18px;background:#173d3d;color:white;padding:14px;border-radius:10px;max-width:90vw}footer{padding:20px 0}.danger{color:#aa4132}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:760px){main{padding:16px}.wheels,.grid{grid-template-columns:1fr}h1{font-size:30px}}@media print{header,nav,button,footer{display:none}article{break-inside:avoid}}
</style><body><header><strong>MYBIZCAR / M-AIR</strong><span>Hơi niềm tin thị trường · CIB</span><button id="export">Xuất dữ liệu</button><button id="import">Nhập dữ liệu</button><button onclick="window.print()">In trang hiện tại</button><input id="file" type="file" accept=".json" hidden></header><nav id="nav"></nav><main id="main"></main><footer style="padding:24px">Mô thức ứng dụng The BizCar — Nguyễn Chí Thành · Bản học tập 1.0 · Dữ liệu lưu trên trình duyệt này. Hãy xuất JSON để sao lưu.</footer><script>'use strict';
const KEY='mybizcar-mair-v1',dims={C:'Capability · Khả lực',I:'Integrity · Chính trực',B:'Benevolence · Thiện chí'},steps=['Activate|Cùng khởi động','Paradigm|Mô thức thực chiến','Practise|Thực hành thiết kế','Lens|Lăng kính học viên','Improve|Cải tiến MyBizCar','Extract|Rút ra bài học mang theo','Resolve|Cam kết hành động'];
const fresh=()=>({kind:'mair',version:1,company:'',product:'',claims:[],responses:[],risks:[],plans:[],workbook:{}});let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{s=fresh()}let tab=0,selected='',dim='C';const $=x=>document.querySelector(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID(),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{alert('Không lưu được. Hãy xuất JSON để tránh mất dữ liệu.')}},opt=(a,v='')=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join(''),field=(name,label,type='text',value='',req=true)=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${req?'required':''}></label>`,area=(name,label,value='',req=false)=>`<label>${label}<textarea name="${name}" ${req?'required':''}>${esc(value)}</textarea></label>`,select=(name,label,items)=>`<label>${label}<select name="${name}">${opt(items)}</select></label>`,data=f=>Object.fromEntries(new FormData(f)),claim=()=>s.claims.find(c=>c.id===selected)||s.claims[0],download=(name,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
const industries=[
['Thực phẩm · Bánh mì que','Pâté đạt yêu cầu chất lượng từng lô','Kiểm tra đầu vào và lưu bằng chứng theo lô; lời nhà cung cấp không thay kiểm chứng.','Công khai thành phần và sửa thông tin sai.','Tư vấn phù hợp hạn chế ăn uống, không cố bán món không phù hợp.'],
['Sản xuất bê tông','Giao cấu kiện đúng yêu cầu và lịch đã thống nhất','Đối chiếu kiểm tra chất lượng, năng lực và lịch giao.','Thông báo sai lệch kỹ thuật hoặc tiến độ ngay khi phát hiện.','Cùng khách tìm cách giảm gián đoạn thay vì đẩy toàn bộ thiệt hại sang khách.'],
['Đào tạo CEO · BMDO','Học viên thực hành được một thiết kế phù hợp doanh nghiệp','Xem sản phẩm thực hành và khả năng vận dụng, không chỉ số giờ học.','Nói rõ kết quả phụ thuộc dữ liệu và mức tham gia của học viên.','Gợi ý lộ trình phù hợp, không ép mua thêm khóa không cần thiết.'],
['Phần mềm doanh nghiệp','Hệ thống đáp ứng quy mô vận hành đã cam kết','Thử tải và ghi nhận sự cố trong phạm vi sử dụng thực tế.','Thông báo giới hạn, phí và sự cố minh bạch.','Hỗ trợ xuất dữ liệu và chuyển đổi công bằng, không giữ khách bằng gây khó.'],
['Logistics','Hàng được giao đúng điều kiện và thời gian','Theo dõi hành trình, nhiệt độ nếu có yêu cầu, tỷ lệ đúng hẹn.','Không sửa trạng thái thành đã giao khi chưa giao.','Chủ động hỗ trợ khách khi gián đoạn, thống nhất phương án thay thế.'],
['Bán lẻ','Sản phẩm đúng mô tả, có hỗ trợ sau bán','Kiểm chứng nguồn hàng và năng lực bảo hành.','Hiển thị tổng giá và điều kiện đổi trả trước mua.','Không tư vấn mẫu đắt hơn nếu không đáp ứng tốt hơn nhu cầu.'],
['Khách sạn','Phòng và dịch vụ đúng điều đã đặt','Kiểm tra khả năng phục vụ vào mùa cao điểm.','Không dùng hình phòng cao cấp để mô tả hạng thấp.','Chủ động giải pháp phù hợp khi khách có nhu cầu tiếp cận đặc biệt.'],
['Dịch vụ sức khỏe','Thực hiện dịch vụ trong phạm vi chuyên môn','Kiểm tra năng lực và điều kiện thực hiện; không biến điểm tin thành kết luận an toàn.','Nói rõ giới hạn, chi phí và không hứa kết quả chắc chắn.','Không đề xuất dịch vụ không cần thiết chỉ vì doanh thu.'],
['Tài chính · Bảo hiểm','Giải thích và thực hiện đúng điều khoản dịch vụ','Đối chiếu năng lực xử lý hồ sơ trong phạm vi cam kết.','Nêu rõ loại trừ, phí và rủi ro thay vì chỉ nêu lợi ích.','Đề xuất sản phẩm phù hợp khả năng và mục đích của khách.'],
['Xây dựng','Thực hiện hạng mục đúng yêu cầu thỏa thuận','Kiểm chứng nhân lực, vật tư và tiến độ.','Thống nhất phát sinh bằng văn bản trước khi thực hiện.','Đề xuất phương án giảm chi phí hợp lý mà không làm mất yêu cầu thiết yếu.'],
['Thương mại điện tử','Hàng nhận được đúng mô tả và cam kết giao','Đối chiếu phản hồi theo người bán và lô hàng.','Không dùng đánh giá giả hoặc che tài trợ.','Giải quyết khiếu nại công bằng, tránh đẩy khách qua nhiều bên.'],
['Dịch vụ chuyên môn B2B','Giải pháp đáp ứng phạm vi công việc đã thống nhất','Đối chiếu chuyên môn, sản phẩm bàn giao và khả năng hỗ trợ.','Nói rõ giả định, giới hạn và xung đột lợi ích.','Khuyên khách không triển khai khi chi phí vượt lợi ích có căn cứ.']];
const risklib={C:['Cam kết vượt năng lực','Chất lượng không ổn định','Giao trễ lặp lại','Đầu vào chưa kiểm chứng','Phụ thuộc một nhà cung cấp','Nhân viên chưa đủ năng lực','Thiếu phương án dự phòng','Hậu mãi không đáp ứng'],I:['Thông tin vượt bằng chứng','Che giấu giới hạn','Phí hoặc điều khoản không rõ','Đổi cam kết không thông báo','Né trách nhiệm khi có lỗi','Báo cáo hoặc đánh giá giả','Không công khai tài trợ','Dùng dữ liệu trái cam kết'],B:['Ép mua hoặc bán thêm không cần','Tư vấn không phù hợp','Gây khó khi hủy hoặc chuyển đổi','Bỏ mặc sau bán','Xử lý khiếu nại thiếu công bằng','Lợi dụng khách thiếu hiểu biết','Đẩy rủi ro bất hợp lý sang khách','KPI thưởng gây xung đột lợi ích']};
function workbook(key,label){return area('wb',label,s.workbook[key]||'')+`<button data-wb="${key}">Lưu nội dung</button>`}
function render(){if(!selected&&s.claims.length)selected=s.claims[0].id;$('#nav').innerHTML=steps.map((x,i)=>`<button data-tab="${i}" class="${tab===i?'active':''}">${i+1}. ${x.split('|')[0]}<small>${x.split('|')[1]}</small></button>`).join('');$('#main').innerHTML=[activate,paradigm,practise,lens,improve,extract,resolve][tab]();bind()}
function activate(){return `<div class="wheels"><article><span class="tag">BÁNH XE THỊ TRƯỜNG / HƠI</span><h1>Niềm tin không thể<br>tự bơm bằng lời hứa.</h1><p>Đo điều thị trường tin. Kiểm tra căn cứ. Vá nguyên nhân xì hơi. Tạo thêm bằng chứng để xứng đáng được tin.</p><p><b>V-AIR:</b> CEO và đội ngũ tin vào giá trị mình cung cấp.<br><b>M-AIR:</b> khách hàng và thị trường tin doanh nghiệp đến đâu, trong bối cảnh nào.</p><form id="context">${field('company','Doanh nghiệp','text',s.company)}${field('product','Sản phẩm / dịch vụ / thương hiệu','text',s.product)}<button>Lưu bối cảnh</button></form></article><article>${wheel([])}<h2>Ba lớp phải tách biệt</h2><p>① Doanh nghiệp làm được gì.<br>② Khách đã tiếp nhận bằng chứng gì.<br>③ Khách thực sự tin điều gì.</p><div class="warn">Doanh số, sự hài lòng và lượt tiếp cận không tự chứng minh niềm tin. Chưa có dữ liệu không phải điểm 0.</div></article></div><article>${workbook('activate','Hiện nay khách tin điều gì? Điều gì khiến đội ngũ lo ngại mất lòng tin?')}</article>`}
function paradigm(){return `<h1>CIB · Từ khái niệm đến kiểm chứng</h1><div class="grid">${Object.entries(dims).map(([d,n])=>`<article><h2>${n}</h2><p>${{C:'Khách tin doanh nghiệp có thể thực hiện lời hứa cụ thể trong điều kiện cụ thể.',I:'Khách tin doanh nghiệp trung thực, giữ nguyên tắc, minh bạch và nhận trách nhiệm.',B:'Khách tin doanh nghiệp quan tâm đến lợi ích chính đáng của họ, kể cả khi lợi ích hai bên xung đột.'}[d]}</p><b>Câu hỏi trực tiếp gợi ý</b><p>${question(d)}</p></article>`).join('')}</div><article><h2>Quy trình đo 6 bước</h2><ol><li>Chọn lời hứa, sản phẩm, UC/vai trò, địa chỉ, địa bàn và thời kỳ.</li><li>Chọn từng C/I/B và câu hỏi cố định cho đợt đo.</li><li>Thu phản hồi trực tiếp, phỏng vấn, khảo sát sau sự kiện hoặc theo dõi nhóm qua thời gian.</li><li>Ghi mã người trả lời, nguồn, ngày, đợt, điểm và lý do; loại bản trùng.</li><li>Xem từng chiều, phân bố, số mẫu và giới hạn. Không tự đổi lời bình thành điểm.</li><li>Vá nguyên nhân, cung cấp bằng chứng, đo lại với bối cảnh so sánh được.</li></ol><p><b>Thang gợi ý:</b> 1 = hoàn toàn không tin; 5 = mức tin thấp/trung gian cần hỏi rõ; 10 = rất tin trong phạm vi đang hỏi. Có lựa chọn “chưa đủ trải nghiệm”. Các mốc là quy ước khảo sát, không chứng nhận chất lượng hay an toàn.</p><p>Lắng nghe đa kênh cần kiểm tra trùng nguồn, tài trợ, thiên lệch tự chọn. Hành vi mua chỉ là dữ kiện bổ trợ; hợp đồng, chi phí chuyển đổi và thiếu lựa chọn có thể giải thích việc mua tiếp.</p></article><h2>12 ngành · 36 tình huống C/I/B</h2><p>Tất cả là ví dụ minh họa giả định, không phải kết quả nghiên cứu hay chứng thực doanh nghiệp.</p>${industries.map((x,i)=>`<article><details><summary>${x[0]} — ${x[1]}</summary>${['C','I','B'].map((d,j)=>`<h3>${dims[d]}</h3><p>${x[j+2]}</p><p><b>Đo:</b> ${question(d)} Hỏi thêm: “Trải nghiệm hoặc bằng chứng nào khiến anh/chị đánh giá như vậy?”</p>`).join('')}<button data-example="${i}">Dùng lời hứa này để thiết kế</button></details></article>`).join('')}<article><h2>Trạm bơm và vá xì</h2><p>Trạm nội bộ: chính sách, kiểm soát chất lượng, thực hiện cam kết, minh bạch, xử lý khiếu nại. Trạm bên ngoài: khách hàng hiện hữu, đối tác, tín kết, chuyên gia, kiểm định đúng phạm vi.</p><p>Khách giới thiệu không chứng minh đủ CIB. Đối tác không mặc nhiên độc lập. Trạm BTS tạo độ phủ, trạm M-AIR tạo căn cứ tin; phải đo phản hồi để biết hiệu quả.</p><p>Nền tảng tham khảo: <a href="https://journals.aom.org/doi/10.5465/amr.1995.9508080335" target="_blank" rel="noopener">Mayer, Davis & Schoorman (1995)</a>: Ability–Benevolence–Integrity. MyBizCar vận dụng CIB trong cấu trúc bánh xe; không tuyên bố ba thành tố là phát hiện mới.</p></article>`}
function question(d){return {C:'Anh/chị tin doanh nghiệp có khả năng thực hiện lời hứa đang xét ở mức nào?',I:'Anh/chị tin doanh nghiệp sẽ trung thực, minh bạch và giữ cam kết trong việc này ở mức nào?',B:'Anh/chị tin doanh nghiệp sẽ quan tâm đến lợi ích chính đáng của mình khi xử lý việc này ở mức nào?'}[d]}
function picker(){return `<label>Hồ sơ lời hứa đang xem<select id="claimpick">${s.claims.map(c=>`<option value="${c.id}" ${claim()?.id===c.id?'selected':''}>${esc(c.promise)} · ${esc(c.address)}</option>`).join('')}</select></label>`}
function practise(){const c=claim();return `<h1>Thiết kế hồ sơ niềm tin</h1><article><details ${!c?'open':''}><summary>Thêm lời hứa / phạm vi đo mới</summary><form id="claimform">${field('promise','Lời hứa cụ thể có thể kiểm chứng')}${field('brand','Sản phẩm / thương hiệu','text',s.product)}<div class="grid">${select('type','Nhóm địa chỉ',['AH','AR','AP','AC'])}${field('address','Mã / tên địa chỉ (không cần thông tin cá nhân)')}${field('area','Địa bàn / mã Area và cấp A0–A4')}${field('uc','UC / vai trò người trả lời')}${field('scope','Điều kiện: quy mô, thời gian, giới hạn, rủi ro')}${field('period','Thời kỳ và cách chọn mẫu')}</div>${area('actual','Điều kiện thực tế và bằng chứng doanh nghiệp có')}${area('received','Bằng chứng khách đã tiếp nhận / nguồn xác nhận')}${area('links','Tham chiếu V-AIR / VBF / EncounterPoint / BO-SO (không tự đồng bộ)')}<button>Tạo hồ sơ</button></form></details></article>${c?`<article>${picker()}<h2>${esc(c.promise)}</h2><p>${esc(c.brand)} · ${esc(c.type)} / ${esc(c.address)} · ${esc(c.area)} · ${esc(c.uc)}</p><p>Phạm vi: ${esc(c.scope)}<br>Chọn mẫu: ${esc(c.period)}</p><details><summary>Điều kiện và bằng chứng đã ghi</summary><p>${esc(c.actual)}</p><p>${esc(c.received)}</p><p>${esc(c.links)}</p></details><p class="muted">Đổi lời hứa hoặc cách hỏi: tạo hồ sơ mới, không trộn dữ liệu cũ.</p></article><article><h2>Nhập phản hồi thị trường</h2><p>Câu hỏi cố định theo C/I/B ở phần Mô thức. Không nhập điểm do CEO tự suy đoán thay khách.</p><form id="response"><div class="grid">${select('dim','Chiều đo',['C','I','B'])}${field('respondent','Mã ẩn danh người trả lời')}${field('batch','Mã đợt đo')}${field('date','Ngày phản hồi','date',new Date().toISOString().slice(0,10))}${select('method','Phương thức',['Khảo sát trực tiếp','Phỏng vấn','Sau sự kiện','Theo dõi định kỳ','Phản hồi đa kênh'])}${field('source','Nguồn / mã bằng chứng kiểm tra được')}${select('mode','Loại phản hồi',['Có điểm trực tiếp','Chưa đủ trải nghiệm','Chỉ định tính'])}<label>Điểm 1–10<input name="score" type="number" min="1" max="10" step="1"></label></div>${area('reason','Lời khách / lý do / trải nghiệm làm căn cứ','',true)}${area('limits','Giới hạn: thiên lệch, tài trợ, trải nghiệm gián tiếp, bối cảnh khác...')}<button>Lưu phản hồi</button></form></article><article><h2>Phản hồi đã lưu</h2>${s.responses.filter(r=>r.claim===c.id).map(r=>`<p><b>${esc(r.dim)} · ${r.mode==='Có điểm trực tiếp'?r.score:'Không chấm điểm'}</b> — ${esc(r.respondent)} / ${esc(r.batch)} / ${esc(r.date)}<br>${esc(r.reason)}<br><small>${esc(r.source)} · ${esc(r.limits)}</small> <button data-del="${r.id}">Xóa bản ghi sai</button></p>`).join('')||'Chưa có phản hồi.'}</article>`:'<p>Tạo hồ sơ để bắt đầu thu thập phản hồi.</p>'}`}
function wheel(rows){const nums=rows.filter(r=>r.mode==='Có điểm trực tiếp').map(r=>+r.score),avg=nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null,ry=avg===null?96:65+avg*6;return `<svg class="wheel" viewBox="0 0 440 290" role="img" aria-label="Hình lốp minh họa mức tin ${avg===null?'chưa có dữ liệu':avg.toFixed(1)}"><defs><radialGradient id="air"><stop stop-color="#bce9dd"/><stop offset="1" stop-color="#3b8e83"/></radialGradient></defs><ellipse cx="220" cy="265" rx="155" ry="12" fill="#dce5dc"/><ellipse cx="220" cy="${255-ry}" rx="148" ry="${ry}" fill="${avg===null?'#a7b4b5':'url(#air)'}" stroke="#193f46" stroke-width="25"/><ellipse cx="220" cy="${255-ry}" rx="61" ry="${ry*.55}" fill="#f5f4e9" stroke="#eead53" stroke-width="12"/><text x="220" y="${260-ry}" text-anchor="middle" font-size="25" fill="#173d3d">${avg===null?'?':avg.toFixed(1)}</text><text x="220" y="24" text-anchor="middle" fill="#173d3d">${avg===null?'CHƯA CÓ DỮ LIỆU':dim+' · '+nums.length+' phản hồi có điểm'}</text></svg><p class="muted">Độ căng là ẩn dụ của điểm tin trực tiếp trên mẫu đang chọn, không phải áp suất vật lý hoặc chứng nhận CIB đạt chuẩn.</p>`}
function lens(){const c=claim();return `<h1>Lăng kính học viên</h1>${c?`<article>${picker()}<div class="row">${Object.keys(dims).map(d=>`<button data-dim="${d}" class="${dim===d?'active':''}">${dims[d]}</button>`).join('')}</div><label>Đợt đo<select id="batchfilter"><option value="">Tất cả đợt — chỉ mô tả, không suy xu hướng</option>${[...new Set(s.responses.filter(r=>r.claim===c.id).map(r=>r.batch))].map(b=>`<option>${esc(b)}</option>`).join('')}</select></label><div id="dashboard"></div></article>`:'<article>Chưa có hồ sơ. Hãy sang Thực hành thiết kế.</article>'}<article><h2>Phản biện trước khi kết luận</h2><ul><li>Mẫu này có đại diện cho địa chỉ / địa bàn đang xét không?</li><li>Các đợt có cùng câu hỏi, vai trò, điều kiện và cách chọn mẫu không?</li><li>Có ý kiến trái chiều bị trung bình che khuất không?</li><li>Khách mua lại vì tin hay vì thiếu lựa chọn?</li><li>Bằng chứng nào chống lại kết luận của đội ngũ?</li></ul>${workbook('lens','Ghi phản biện của học viên và giảng viên')}</article>`}
function dashboard(){if(!$('#dashboard'))return;const batch=$('#batchfilter').value,rows=s.responses.filter(r=>r.claim===claim()?.id&&r.dim===dim&&(!batch||r.batch===batch)),nums=rows.filter(r=>r.mode==='Có điểm trực tiếp'),count=n=>nums.filter(r=>+r.score===n).length;$('#dashboard').innerHTML=`<div class="wheels"><div>${wheel(rows)}</div><div><h2>${dims[dim]}</h2><p>${rows.length} phản hồi · ${nums.length} có điểm · ${rows.length-nums.length} chưa chấm điểm</p><p>${new Set(nums.map(r=>r.respondent)).size} người có điểm. Một người có thể trả lời nhiều đợt; tổng hợp tất cả không phải số người độc lập.</p>${nums.length?Array.from({length:10},(_,i)=>`<div class="row"><span>${i+1}</span><meter min="0" max="${nums.length}" value="${count(i+1)}" style="flex:1"></meter><span>${count(i+1)}</span></div>`).join(''):'<div class="warn">Chưa đủ dữ liệu chấm điểm. Không kết luận niềm tin thấp.</div>'}<p class="warn">Không gộp C/I/B. Không tự suy toàn thị trường từ mẫu thuận tiện; không kết luận nhân quả từ thay đổi điểm.</p></div></div>`}
function improve(){return `<h1>Phòng ngừa · Vá xì · Bơm bổ sung</h1><article><h2>Thư viện 24 nguy cơ CIB</h2><p>Các gợi ý không tự tạo cáo buộc. Chọn nguy cơ rồi ghi dữ kiện để kiểm chứng.</p><div class="grid">${Object.entries(risklib).map(([d,list])=>`<div><h3>${dims[d]}</h3>${list.map((x,i)=>`<p><button data-risk="${d}|${i}">${x}</button></p>`).join('')}</div>`).join('')}</div></article><article><h2>Ghi nhận cảnh báo có căn cứ</h2><form id="riskform">${select('dim','Chiều chính',['C','I','B'])}${field('title','Nguy cơ / hành vi (có thể tự bổ sung)')}${field('target','Địa chỉ / địa bàn / lời hứa chịu ảnh hưởng')}${select('state','Trạng thái',['Thiếu dữ liệu','Nguy cơ xì hơi','Sự cố đã xảy ra','Niềm tin suy giảm đã được ghi nhận'])}${select('severity','Ưu tiên do người quản lý xác định',['Cần kiểm chứng','Cao','Khẩn cấp'])}${area('evidence','Dữ kiện, nguồn, ngày và phạm vi làm căn cứ','',true)}${area('alternative','Giải thích khác cần loại trừ / điều chưa biết')}${area('action','Phòng ngừa / ngăn tiếp diễn / khắc phục','',true)}<button>Lưu cảnh báo</button></form></article>${s.risks.map(r=>`<article><span class="tag">${esc(r.dim)} · ${esc(r.state)} · ${esc(r.severity)}</span><h2>${esc(r.title)}</h2><p>${esc(r.target)}</p><p>${esc(r.evidence)}</p><p>Cần kiểm chứng: ${esc(r.alternative)}</p><p>Hành động: ${esc(r.action)}</p></article>`).join('')}<article><h2>Thiết kế trạm bơm / biện pháp vá xì</h2><p>Chính sách được ban hành ≠ đã thực hiện ≠ khách đã tin. Trạm bên ngoài không thay việc sửa chất lượng bên trong.</p><form id="planform">${field('target','Lời hứa / CIB / địa chỉ / nguy cơ liên quan')}${select('station','Loại trạm',['Nội bộ: chính sách','Nội bộ: hành động / vận hành','Nội bộ: đội ngũ / minh bạch','Bên ngoài: khách hàng hiện hữu','Bên ngoài: đối tác','Bên ngoài: tín kết','Bên ngoài: chuyên gia / kiểm định','Bên ngoài: KOL / KOC / truyền thông','Khác'])}${field('name','Tên trạm / bên thực hiện')}${area('action','Vá nguyên nhân gì? Bổ sung bằng chứng gì?','',true)}${area('disclosure','Phạm vi xác nhận / tài trợ / lợi ích liên quan')}${field('owner','Người chịu trách nhiệm')}${field('due','Hạn thực hiện','date')}${select('status','Trạng thái',['Đã có kế hoạch','Đã thực hiện','Thị trường đã xác nhận'])}${area('evidence','Bằng chứng thực hiện / phản hồi xác nhận')}${area('remeasure','Đo lại: ai, câu hỏi nào, thời điểm, nguồn và cách so sánh','',true)}<button>Lưu kế hoạch</button></form></article>${s.plans.map(p=>`<article><h2>${esc(p.name)}</h2><span class="tag">${esc(p.station)} · ${esc(p.status)}</span><p>${esc(p.target)}</p><p>${esc(p.action)}</p><p>Trách nhiệm: ${esc(p.owner)} · Hạn: ${esc(p.due)}</p><p>Bằng chứng: ${esc(p.evidence)}<br>Minh bạch: ${esc(p.disclosure)}</p><p>Đo lại: ${esc(p.remeasure)}</p><button data-plan="${p.id}">Cập nhật trạng thái / bằng chứng</button></article>`).join('')}`}
function extract(){return `<h1>Rút ra bài học mang theo</h1><article><h2>Hồ sơ MyBizCar của bạn</h2><p>${esc(s.company)} · ${esc(s.product)}</p><p>${s.claims.length} hồ sơ lời hứa · ${s.responses.length} phản hồi · ${s.risks.length} cảnh báo do người dùng ghi nhận · ${s.plans.length} kế hoạch trạm bơm / vá xì.</p><p>V-RIM: tin vào giá trị nào? V-CASING: điều kiện nào tạo trải nghiệm? V-TREAD: khác biệt có giữ được lời hứa? V-AIR: niềm tin nội bộ có căn cứ?</p><p>M-RIM: ai / địa chỉ / địa bàn nào? M-CASING: trải nghiệm nhận được? M-TREAD: hành vi mua gì? M-AIR: tin điều gì? Các liên hệ là câu hỏi kiểm chứng, không tự động suy ra nhau.</p>${workbook('extract','Ba phát hiện, một giả định cần bỏ và một điều cần kiểm chứng')}</article>`}
function resolve(){return `<h1>Cam kết hành động 90 ngày</h1><article><p><b>0–30 ngày:</b> chọn phạm vi, thu đường cơ sở, xử lý nguy cơ cấp bách.<br><b>31–60 ngày:</b> thực hiện vá xì và trạm bơm có bằng chứng.<br><b>61–90 ngày:</b> đo lại, đối chiếu điều kiện và điều chỉnh.</p>${workbook('resolve','Cam kết: việc gì, ai chịu trách nhiệm, khi nào, nguồn lực, bằng chứng hoàn thành và cách đo lại')}</article><article><h2>Giới hạn của phiên bản học tập</h2><p>Ứng dụng chạy ngoại tuyến, không tự thu thập mạng xã hội, không có máy chủ đa người dùng hoặc xác minh chứng từ. Không có thuật toán chứng nhận niềm tin. Cảnh báo thư viện là gợi ý; kết luận cần người quản lý kiểm chứng. Chỉ nhập mã ẩn danh và dữ liệu được phép sử dụng.</p><p>Xuất JSON để sao lưu/chuyển máy. Nhập JSON thay thế dữ liệu hiện tại sau xác nhận. ZIP không chứa dữ liệu bạn đã nhập trong trình duyệt.</p></article>`}
function bind(){$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;render()});$$('[data-wb]').forEach(b=>b.onclick=()=>{s.workbook[b.dataset.wb]=b.previousElementSibling.querySelector('textarea').value;save();alert('Đã lưu')});$('#context')?.addEventListener('submit',e=>{e.preventDefault();Object.assign(s,data(e.target));save();alert('Đã lưu')});$('#claimform')?.addEventListener('submit',e=>{e.preventDefault();const c={...data(e.target),id:id()};s.claims.push(c);selected=c.id;save();render()});$('#claimpick')?.addEventListener('change',e=>{selected=e.target.value;render()});$$('[data-example]').forEach(b=>b.onclick=()=>{tab=2;render();$('#claimform').closest('details').open=true;$('#claimform [name=promise]').value=industries[+b.dataset.example][1];$('#claimform').scrollIntoView()});$('#response')?.addEventListener('submit',e=>{e.preventDefault();const r=data(e.target);if(r.mode==='Có điểm trực tiếp'&&(!Number.isInteger(+r.score)||+r.score<1||+r.score>10))return alert('Điểm trực tiếp phải là số nguyên từ 1 đến 10.');if(r.date>new Date().toISOString().slice(0,10))return alert('Ngày phản hồi không được ở tương lai.');if(s.responses.some(x=>x.claim===claim().id&&x.dim===r.dim&&x.respondent.trim()===r.respondent.trim()&&x.batch.trim()===r.batch.trim()))return alert('Trùng người / đợt / chiều / hồ sơ. Kiểm tra bản đã lưu.');if(r.mode!=='Có điểm trực tiếp')r.score='';s.responses.push({...r,id:id(),claim:claim().id});save();render()});$$('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Xóa phản hồi nhập sai? Hãy sao lưu nếu cần giữ lịch sử.')){s.responses=s.responses.filter(r=>r.id!==b.dataset.del);save();render()}});$$('[data-dim]').forEach(b=>b.onclick=()=>{dim=b.dataset.dim;render()});$('#batchfilter')?.addEventListener('change',dashboard);dashboard();$$('[data-risk]').forEach(b=>b.onclick=()=>{const[d,i]=b.dataset.risk.split('|');$('#riskform [name=dim]').value=d;$('#riskform [name=title]').value=risklib[d][i];$('#riskform').scrollIntoView()});$('#riskform')?.addEventListener('submit',e=>{e.preventDefault();s.risks.push({...data(e.target),id:id()});save();render()});$('#planform')?.addEventListener('submit',e=>{e.preventDefault();const p=data(e.target);if(p.status!=='Đã có kế hoạch'&&!p.evidence.trim())return alert('Cần bằng chứng cho trạng thái thực hiện/xác nhận.');s.plans.push({...p,id:id()});save();render()});$$('[data-plan]').forEach(b=>b.onclick=()=>{const p=s.plans.find(p=>p.id===b.dataset.plan);const status=prompt('Nhập: 1 = Kế hoạch; 2 = Đã thực hiện; 3 = Thị trường đã xác nhận',String(['Đã có kế hoạch','Đã thực hiện','Thị trường đã xác nhận'].indexOf(p.status)+1));if(!['1','2','3'].includes(status))return;const evidence=prompt('Bằng chứng thực hiện / phản hồi xác nhận:',p.evidence);if(evidence===null)return;if(status!=='1'&&!evidence.trim())return alert('Cần bằng chứng.');p.status=['Đã có kế hoạch','Đã thực hiện','Thị trường đã xác nhận'][+status-1];p.evidence=evidence;save();render()})}
function $$(q){return [...document.querySelectorAll(q)]}
function validate(x){if(!x||x.kind!=='mair'||x.version!==1||typeof x.company!=='string'||typeof x.product!=='string'||!x.workbook||typeof x.workbook!=='object')return false;for(const k of ['claims','responses','risks','plans'])if(!Array.isArray(x[k])||x[k].length>20000||x[k].some(v=>!v||typeof v!=='object'||Object.values(v).some(z=>typeof z!=='string')))return false;const ids=x.claims.map(c=>c.id);if(new Set(ids).size!==ids.length)return false;return x.responses.every(r=>ids.includes(r.claim)&&['C','I','B'].includes(r.dim)&&['Có điểm trực tiếp','Chưa đủ trải nghiệm','Chỉ định tính'].includes(r.mode)&&(r.mode!=='Có điểm trực tiếp'||(Number.isInteger(+r.score)&&+r.score>=1&&+r.score<=10)))}
$('#export').onclick=()=>download('M-AIR-MyBizCar-data.json',JSON.stringify(s,null,2));$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>15000000)throw Error('Tệp quá lớn');const x=JSON.parse(await f.text());if(!validate(x))throw Error('Sai cấu trúc hoặc điểm dữ liệu');if(confirm('Nhập sẽ thay thế dữ liệu M-AIR hiện tại. Bạn đã xuất bản sao lưu chưa?')){s=x;selected='';save();render()}}catch(err){alert('Không nhập: '+err.message)}e.target.value=''};render();
</script></body></html>
